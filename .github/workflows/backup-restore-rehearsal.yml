name: Rehearse verified backup restore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-rehearsal-${{ github.repository }}
  cancel-in-progress: false

jobs:
  restore:
    name: Restore verified archive into an isolated PostgreSQL container
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: restore-rehearsal

    steps:
      - name: Require protected main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Verify and rehearse the isolated restore
        shell: bash
        env:
          RESTORE_REHEARSAL_DUMP_URL: ${{ secrets.RESTORE_REHEARSAL_DUMP_URL }}
          RESTORE_REHEARSAL_CHECKSUM_URL: ${{ secrets.RESTORE_REHEARSAL_CHECKSUM_URL }}
          POSTGRES_IMAGE: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        run: |
          set -euo pipefail

          stage='preflight'
          result='FAIL'
          checksum_verified='false'
          network_isolated='false'
          bind_mount_count='unknown'
          tmpfs_configured='false'
          user_table_count='0'
          user_index_count='0'
          user_view_count='0'
          extension_count='0'
          container_name='backup-restore-rehearsal-postgres'
          container_started='false'
          archive_directory=''
          archive_path=''

          cleanup() {
            if [ "$container_started" = 'true' ] && docker inspect "$container_name" >/dev/null 2>&1; then
              docker stop "$container_name" >/dev/null 2>&1 || true
            fi

            if [ -n "$archive_path" ] && [ -e "$archive_path" ]; then
              rm -f "$archive_path"
            fi
            if [ -n "$archive_directory" ] && [ -d "$archive_directory" ]; then
              rmdir "$archive_directory" || true
            fi

            printf 'restore_rehearsal_result=%s stage=%s checksum_verified=%s network_isolated=%s bind_mount_count=%s tmpfs_configured=%s user_table_count=%s user_index_count=%s user_view_count=%s extension_count=%s\n' \
              "$result" "$stage" "$checksum_verified" "$network_isolated" "$bind_mount_count" "$tmpfs_configured" "$user_table_count" "$user_index_count" "$user_view_count" "$extension_count"
          }
          trap cleanup EXIT

          test -n "$RESTORE_REHEARSAL_DUMP_URL"
          test -n "$RESTORE_REHEARSAL_CHECKSUM_URL"
          docker info >/dev/null 2>&1

          stage='checksum_verification'
          expected_sha="$(curl --fail --silent --show-error --location "$RESTORE_REHEARSAL_CHECKSUM_URL" 2>/dev/null | awk 'NR == 1 { print $1 }')"
          archive_directory="$(mktemp --directory /dev/shm/backup-restore-rehearsal.XXXXXX)"
          archive_path="$archive_directory/archive.dump"
          test "$(findmnt --noheadings --output FSTYPE --target "$archive_directory")" = 'tmpfs'
          curl --fail --silent --show-error --location "$RESTORE_REHEARSAL_DUMP_URL" --output "$archive_path" 2>/dev/null
          actual_sha="$(sha256sum "$archive_path" | awk '{ print $1 }')"
          [[ "$expected_sha" =~ ^[a-f0-9]{64}$ ]]
          test "$expected_sha" = "$actual_sha"
          checksum_verified='true'

          stage='container_start'
          docker pull "$POSTGRES_IMAGE" >/dev/null 2>&1
          docker run --rm --detach --name "$container_name" \
            --network none \
            --read-only \
            --pids-limit 256 \
            --memory 1536m \
            --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,noexec,size=1g \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
            --tmpfs /var/run/postgresql:rw,nosuid,nodev,noexec,size=64m \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            "$POSTGRES_IMAGE" >/dev/null 2>&1
          container_started='true'

          network_mode="$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$container_name")"
          bind_mount_count="$(docker inspect --format '{{len .Mounts}}' "$container_name")"
          tmpfs_count="$(docker inspect --format '{{len .HostConfig.Tmpfs}}' "$container_name")"
          test "$network_mode" = 'none'
          test "$bind_mount_count" = '0'
          test "$tmpfs_count" -ge 3
          network_isolated='true'
          tmpfs_configured='true'

          stage='database_ready'
          database_ready='false'
          for _ in {1..30}; do
            if docker exec "$container_name" pg_isready -U postgres >/dev/null 2>&1; then
              database_ready='true'
              break
            fi
            sleep 1
          done
          test "$database_ready" = 'true'
          docker exec "$container_name" createdb -U postgres restorecheck >/dev/null 2>&1

          stage='restore_stream'
          cat "$archive_path" | \
            docker exec --interactive "$container_name" \
              pg_restore -U postgres -d restorecheck --exit-on-error --no-owner --no-privileges >/dev/null 2>&1

          stage='catalog_integrity'
          catalog_counts="$(docker exec "$container_name" psql -U postgres -d restorecheck -v ON_ERROR_STOP=1 -Atc "
            SELECT
              (SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema')) || ' ' ||
              (SELECT count(*) FROM pg_catalog.pg_indexes WHERE schemaname NOT IN ('pg_catalog', 'information_schema')) || ' ' ||
              (SELECT count(*) FROM pg_catalog.pg_views WHERE schemaname NOT IN ('pg_catalog', 'information_schema')) || ' ' ||
              (SELECT count(*) FROM pg_extension WHERE extname <> 'plpgsql');
          " 2>/dev/null)"
          read -r user_table_count user_index_count user_view_count extension_count <<< "$catalog_counts"
          for count in "$user_table_count" "$user_index_count" "$user_view_count" "$extension_count"; do
            [[ "$count" =~ ^[0-9]+$ ]]
          done
          test "$user_table_count" -gt 0

          result='PASS'
          stage='complete'
