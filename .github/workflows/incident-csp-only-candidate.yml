name: Incident CSP-only candidate (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: incident-csp-only-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dongphugia-web
  PRODUCTION_SITE_URL: https://www.dongphugia.vn
  BUNNY_CDN_HOSTNAME: cdn.dongphugia.com.vn

jobs:
  build:
    name: Build and scan isolated linux/arm64 candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Require isolated CSP-only source branch
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/codex/blog-managed-media-hardening-csp-only"

      - uses: actions/checkout@v4

      - name: Verify native ARM64 build environment
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in aarch64|arm64) ;; *) exit 1 ;; esac
          case "$(docker info --format '{{.Architecture}}')" in aarch64|arm64) ;; *) exit 1 ;; esac
          test "$(node -p 'process.arch')" = "arm64"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require production Publishing CDN hostname
        shell: bash
        env:
          PUBLISHING_BUNNY_CDN_HOSTNAME: ${{ vars.PRODUCTION_PUBLISHING_BUNNY_CDN_HOSTNAME }}
        run: |
          set -euo pipefail
          test -n "$PUBLISHING_BUNNY_CDN_HOSTNAME"
          [[ "$PUBLISHING_BUNNY_CDN_HOSTNAME" =~ ^[a-z0-9.-]+$ ]]

      - name: Build and push isolated immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:incident-csp-only-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=incident-csp-only-${{ github.sha }}
          build-args: |
            DEPLOY_TARGET=production
            NEXT_PUBLIC_SITE_URL=${{ env.PRODUCTION_SITE_URL }}
            BUNNY_CDN_HOSTNAME=${{ env.BUNNY_CDN_HOSTNAME }}
            PUBLISHING_BUNNY_CDN_HOSTNAME=${{ vars.PRODUCTION_PUBLISHING_BUNNY_CDN_HOSTNAME }}

      - name: Verify pushed digest, architecture and provenance label
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF" >/dev/null
          actual_digest="$(docker image inspect "$IMAGE_REF" --format '{{index .RepoDigests 0}}' | sed 's/^.*@//')"
          image_arch="$(docker image inspect "$IMAGE_REF" --format '{{.Architecture}}')"
          source_revision="$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$actual_digest" = "$EXPECTED_DIGEST"
          test "$image_arch" = "arm64"
          test "$source_revision" = "$GITHUB_SHA"
          printf 'Candidate digest verified: %s\n' "$actual_digest"

      - name: Scan pushed immutable digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
