name: Publish Staging Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing Staging Worker target
        required: true
        type: choice
        options: [staging]
      source_kind:
        description: Publish main or an exactly reviewed open PR head
        required: true
        type: choice
        options: [main, approved-pr]
      source_sha:
        description: Exact 40-character source commit to build
        required: true
        type: string
      pull_request_number:
        description: Required for approved-pr; current head must have an approving review
        required: false
        type: string
      deployment_token_id:
        description: Nonsecret Cloudflare token ID to inspect before approving the protected Staging environment
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

# Serialize every update to the single shared Staging Worker.
concurrency:
  group: dpg-staging-publication
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Build and browser-check exact source without Cloudflare credentials
    if: >-
      github.repository == 'tranhuunguyenhuy-hue/dongphugia.com.vn' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      inputs.environment == 'staging' &&
      (inputs.source_kind == 'main' || inputs.source_kind == 'approved-pr')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: npm

      - name: Validate the source commit and approval from trusted main code
        id: identity
        env:
          SOURCE_KIND: ${{ inputs.source_kind }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/app-foundation/validate-environment-worker-source.mjs \
            "$SOURCE_KIND" "$SOURCE_SHA" "$PULL_REQUEST_NUMBER"
          node scripts/app-foundation/verify-environment-worker-release-protection.mjs

      - name: Validate the nonsecret deployment token identity input
        env:
          DEPLOYMENT_TOKEN_ID: ${{ inputs.deployment_token_id }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_TOKEN_ID" =~ ^[a-f0-9]{32}$ ]] || {
            echo 'Expected a 32-character lowercase Cloudflare token ID.' >&2
            exit 1
          }

      - name: Check out the exact candidate source as untrusted build input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false

      - name: Install candidate dependencies from lockfiles
        working-directory: candidate
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix apps/public
          npm ci --prefix apps/admin
          npm ci --prefix apps/environment-worker

      - name: Run focused foundation, authorization, and type checks without credentials
        working-directory: candidate
        run: |
          set -euo pipefail
          npm run app:foundation:check
          npm run typecheck --prefix apps/admin
          npm run typecheck:worker --prefix apps/admin
          npm run typecheck:public

      - name: Build and browser-check without provider credentials
        working-directory: candidate
        env:
          APP_ENV: ${{ inputs.environment }}
          APP_WORKER_NAME: dpg-staging
          APP_ORIGIN: https://dpg-staging.tranhuunguyenhuy.workers.dev
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          APP_ENV="$APP_ENV" APP_WORKER_NAME="$APP_WORKER_NAME" \
            APP_ORIGIN="$APP_ORIGIN" PREVIEW_NOINDEX=true \
            BUILD_SOURCE_SHA="$BUILD_SOURCE_SHA" npm run build:environment-worker
          node scripts/app-foundation/environment-worker-browser.mjs "$APP_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dpg-environment-${{ inputs.environment }}-${{ inputs.source_sha }}
          path: candidate/.artifacts/environment-worker/${{ inputs.environment }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  review-candidate:
    name: Bind release review evidence to immutable inputs on a clean runner
    needs: build-candidate
    if: >-
      github.repository == 'tranhuunguyenhuy-hue/dongphugia.com.vn' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      needs.build-candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0

      - name: Revalidate the exact candidate and release protection from trusted main code
        env:
          SOURCE_KIND: ${{ inputs.source_kind }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/app-foundation/validate-environment-worker-source.mjs \
            "$SOURCE_KIND" "$SOURCE_SHA" "$PULL_REQUEST_NUMBER"
          node scripts/app-foundation/verify-environment-worker-release-protection.mjs

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dpg-environment-${{ inputs.environment }}-${{ inputs.source_sha }}
          path: candidate-artifact

      - name: Calculate artifact digest from downloaded candidate data
        id: artifact
        env:
          CANDIDATE_ARTIFACT_ROOT: candidate-artifact
        run: |
          set -euo pipefail
          sha256="$(node scripts/app-foundation/environment-worker-artifact-digest.mjs "$CANDIDATE_ARTIFACT_ROOT")"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Publish review identity from immutable inputs on the clean runner
        env:
          RELEASE_SERVER_URL: ${{ github.server_url }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          RELEASE_DEPLOYMENT_TOKEN_ID: ${{ inputs.deployment_token_id }}
        run: node scripts/app-foundation/render-environment-worker-review-summary.mjs

  publish-candidate:
    name: Publish and verify one active Worker deployment
    needs: review-candidate
    if: >-
      github.repository == 'tranhuunguyenhuy-hue/dongphugia.com.vn' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      needs.review-candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: cloudflare-${{ inputs.environment }}
    env:
      APP_ENV: staging
      SOURCE_SHA: ${{ inputs.source_sha }}
      ARTIFACT_SHA256: ${{ needs.review-candidate.outputs.artifact_sha256 }}
      EXPECTED_DEPLOYMENT_TOKEN_ID: ${{ inputs.deployment_token_id }}
      CLOUDFLARE_ACCOUNT_ID: d54f3402b9d112ab64d6135e0e3f1fb1
      ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/environment-worker/staging
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install the trusted pinned deployment tool before credentials
        run: npm ci --prefix apps/environment-worker

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dpg-environment-staging-${{ inputs.source_sha }}
          path: ${{ env.ARTIFACT_ROOT }}

      - name: Verify downloaded artifact identity before modifying it
        env:
          CANDIDATE_ARTIFACT_ROOT: ${{ env.ARTIFACT_ROOT }}
        run: |
          set -euo pipefail
          actual_sha256="$(node scripts/app-foundation/environment-worker-artifact-digest.mjs "$CANDIDATE_ARTIFACT_ROOT")"
          test "$actual_sha256" = "$ARTIFACT_SHA256"

      - name: Verify artifact data and replace config with the trusted allowlist
        run: >-
          node scripts/app-foundation/prepare-environment-worker-publication.mjs
          "$ARTIFACT_ROOT" "$APP_ENV" "$SOURCE_SHA" "$CLOUDFLARE_ACCOUNT_ID"

      - name: Recheck required GitHub protection before exposing Cloudflare credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/app-foundation/verify-environment-worker-release-protection.mjs

      - name: Verify actual token identity after required external policy review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          node scripts/app-foundation/verify-environment-worker-deployment-token.mjs
          "$APP_ENV" "$CLOUDFLARE_ACCOUNT_ID" "$EXPECTED_DEPLOYMENT_TOKEN_ID"

      - name: Capture read-only Production public baseline before deployment
        id: production_baseline_before
        run: >-
          node scripts/app-foundation/verify-production-public-baseline.mjs
          capture "$RUNNER_TEMP/dpg-production-public-baseline.json"

      - name: Deploy only the selected pre-created Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node apps/environment-worker/node_modules/wrangler/bin/wrangler.js deploy \
            --strict --config "$ARTIFACT_ROOT/wrangler.json" \
            --message "DPG $APP_ENV source $SOURCE_SHA"

      - name: Verify active deployment identity, noindex and Production-published catalogue reads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          node scripts/app-foundation/verify-environment-worker-deployment.mjs
          "$APP_ENV" "$SOURCE_SHA"

      - name: Compare read-only Production public baseline after Staging smoke
        id: production_baseline_compare
        if: always() && steps.production_baseline_before.outcome == 'success'
        run: >-
          node scripts/app-foundation/verify-production-public-baseline.mjs
          compare "$RUNNER_TEMP/dpg-production-public-baseline.json"

      - name: Record nonsecret release and external-review evidence
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISH_JOB_STATUS: ${{ job.status }}
          PRODUCTION_BASELINE_OUTCOME: ${{ steps.production_baseline_compare.outcome }}
        run: |
          deployment_config_sha256='not-prepared'
          if [[ -f "$ARTIFACT_ROOT/publication-manifest.json" ]]; then
            deployment_config_sha256="$(jq -r '.deploymentConfigSha256' "$ARTIFACT_ROOT/publication-manifest.json")"
          fi
          {
            echo '### Staging Worker release evidence'
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT"
            echo "- Job result: $PUBLISH_JOB_STATUS"
            echo "- Requested source SHA: $SOURCE_SHA"
            echo "- Candidate artifact content SHA-256: $ARTIFACT_SHA256"
            echo "- Expected and API-verified token ID: $EXPECTED_DEPLOYMENT_TOKEN_ID (identity/status only)"
            echo "- Deployment config SHA-256: $deployment_config_sha256"
            echo "- Production public baseline comparison: ${PRODUCTION_BASELINE_OUTCOME:-not-run}"
            echo "- Token policy evidence: external human inspection in the required cloudflare-staging environment approval; not machine verified by CI."
            echo "- Worker identity is dpg-staging in the shared Cloudflare account."
            echo "- Candidate build runs without Cloudflare credentials; publication consumes its data-only artifact."
            echo "- Public and Admin SSR share the Staging workers.dev origin; Admin auth is disabled and private data remains unavailable."
            echo "- Public reads only fixed Production catalogue paths; mutation requests are rejected before app or asset dispatch."
            echo "- The environment approval event is the supervised per-release gate; /tokens/verify verifies the selected token ID and active status only, not its policy scope."
          } >> "$GITHUB_STEP_SUMMARY"
