name: PR App source build
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 -B -m unittest discover -s scripts/app-foundation -p test_prepare_pr_preview.py
      - run: npm ci
      - run: npm ci --prefix apps/public
      - run: npm ci --prefix apps/admin
      - name: Build Public with the Local Preview origin
        run: npm run build:public-worker
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: public
          APP_ORIGIN: http://127.0.0.1:8787
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Build Admin with authentication disabled
        run: npm run build:admin
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: admin
          APP_ORIGIN: http://127.0.0.1:8787
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_ADMIN_AUTH_ENABLED: 'false'
          ADMIN_AUTH_ENABLED: 'false'
