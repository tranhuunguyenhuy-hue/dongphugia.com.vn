name: Public Production Worker

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the validated dedicated Production Worker version
        type: boolean
        default: false
        required: true
      candidate_run_id:
        description: Successful same-source Public Preview candidate run for the restored v4 snapshot
        type: string
        required: true
      candidate_manifest_sha256:
        description: SHA-256 of the approved v4 manifest.json; required with candidate_run_id
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: public-production-worker
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      checkpoint: ${{ steps.identity.outputs.checkpoint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the approved restored candidate producer
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/producer.json"
          jq -e --arg sha "$GITHUB_SHA" '.conclusion=="success" and .head_sha==$sha and .head_branch=="main" and .event=="workflow_dispatch" and .run_attempt==1 and .path==".github/workflows/catalogue-public-preview-v2.yml" and .actor.login=="tranhuunguyenhuy-hue"' "$RUNNER_TEMP/producer.json" >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-catalogue-preview-${{ github.sha }}
          path: ${{ runner.temp }}/accepted-public
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Audit the exact restored snapshot and manifest digest
        env:
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
        run: |
          set -euo pipefail
          npm ci
          snapshot="$RUNNER_TEMP/accepted-public/build/assets/__catalogue/v1/manifest.json"
          test -f "$snapshot"
          test "$(sha256sum "$snapshot" | cut -d' ' -f1)" = "$CANDIDATE_MANIFEST_SHA256"
          jq -e '.contentPolicy=="canonical-public-content-v4" and .contentStats.publicPrices>0 and .searchProducts>0' "$snapshot" >/dev/null
          node scripts/catalogue-direct/preview2-candidate-audit.mjs "$RUNNER_TEMP/accepted-public/build" "$RUNNER_TEMP/accepted-public-audit.json"
      - name: Validate snapshot identity and install pinned tools
        id: identity
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/accepted-public/build/assets/__catalogue/v1/manifest.json"
          test -f "$snapshot"
          checkpoint="$(jq -er '.checkpoint | select(test("^[a-f0-9]{40}$"))' "$snapshot")"
          jq -e '.contract=="dpg:public-catalogue-snapshot:v1" and .products==5223 and .listingProducts==4853 and .contentPolicy=="canonical-public-content-v4"' "$snapshot" >/dev/null
          echo "checkpoint=$checkpoint" >> "$GITHUB_OUTPUT"
          npm ci --prefix apps/public
      - name: Build Production Worker with canonical origin and public-only snapshot
        env:
          APP_ENV: production
          APP_BUILD_TARGET: public
          APP_ORIGIN: https://www.dongphugia.vn
          BUILD_SOURCE_SHA: ${{ github.sha }}
          PUBLIC_CATALOGUE_CHECKPOINT: ${{ steps.identity.outputs.checkpoint }}
        run: |
          set -euo pipefail
          cp apps/public/wrangler.production.jsonc apps/public/wrangler.jsonc
          npm run build:public-worker
          cp -R apps/public/dist "$RUNNER_TEMP/first-production-build"
          npm run build:public-worker
          python3 scripts/catalogue-direct/public-build-diff.py \
            "$RUNNER_TEMP/first-production-build" apps/public/dist \
            "$RUNNER_TEMP/public-build-diff.json"
          diff -qr "$RUNNER_TEMP/first-production-build" apps/public/dist
          cp -R "$RUNNER_TEMP/accepted-public/build/assets/__catalogue" apps/public/dist/client/__catalogue
          node scripts/catalogue-direct/build-public-sitemap.mjs apps/public/dist/client https://www.dongphugia.vn
          npm run app:assemble-public-worker -- --repository-root . --server-dir apps/public/dist/server --assets-dir apps/public/dist/client --output "$RUNNER_TEMP/render-source" --source-sha "$GITHUB_SHA"
          node apps/public/node_modules/wrangler/bin/wrangler.js dev --local --config "$RUNNER_TEMP/render-source/wrangler.json" --port 8790 --var CATALOGUE_BUILD_RENDER:true > "$RUNNER_TEMP/render.log" 2>&1 &
          render_pid=$!
          trap 'kill "$render_pid" 2>/dev/null || true' EXIT
          node scripts/catalogue-direct/prerender-public-snapshot.mjs --assets-root "$RUNNER_TEMP/render-source/assets" --checkpoint-root "$RUNNER_TEMP/prod-render" --base-url http://127.0.0.1:8790 --source-sha "$GITHUB_SHA" --checkpoint "$PUBLIC_CATALOGUE_CHECKPOINT"
          cp -R "$RUNNER_TEMP/prod-render" apps/public/dist/client/__render
          npm run app:assemble-public-worker -- --repository-root . --server-dir apps/public/dist/server --assets-dir apps/public/dist/client --output "$RUNNER_TEMP/production-build" --source-sha "$GITHUB_SHA"
          jq -e '.name=="dongphugia-v1-public-production" and .workers_dev==true and .preview_urls==false and .vars.APP_ENV=="production" and .vars.APP_ORIGIN=="https://www.dongphugia.vn" and (.vars|has("PREVIEW_NOINDEX")|not)' "$RUNNER_TEMP/production-build/wrangler.json" >/dev/null
          jq -e --arg sha "$GITHUB_SHA" --arg checkpoint "$PUBLIC_CATALOGUE_CHECKPOINT" '.status=="COMPLETE" and .sourceSha==$sha and .checkpoint==$checkpoint and .routes==5621 and .products==5223' "$RUNNER_TEMP/production-build/assets/__render/v1/$GITHUB_SHA/$PUBLIC_CATALOGUE_CHECKPOINT/ready.json" >/dev/null
          node apps/public/node_modules/wrangler/bin/wrangler.js dev --local --config "$RUNNER_TEMP/production-build/wrangler.json" --port 8791 > "$RUNNER_TEMP/production-smoke.log" 2>&1 &
          smoke_pid=$!
          trap 'kill "$smoke_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8791/api/health >/dev/null; then ready=1; break; fi
            sleep 0.25
          done
          test "$ready" -eq 1
          node scripts/catalogue-direct/public-production-smoke.mjs http://127.0.0.1:8791 "$GITHUB_SHA" local
      - name: Preserve bounded SSR comparison after a build failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-production-build-diff-${{ github.run_id }}
          path: ${{ runner.temp }}/public-build-diff.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload versioned Production candidate
        uses: actions/upload-artifact@v4
        with:
          name: public-production-${{ github.sha }}
          path: ${{ runner.temp }}/production-build
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: public-production-${{ github.sha }}
          path: ${{ runner.temp }}/production-build
      - name: Deploy only the dedicated Production Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm ci --prefix apps/public
          cd "$RUNNER_TEMP/production-build"
          node "$GITHUB_WORKSPACE/apps/public/node_modules/wrangler/bin/wrangler.js" deploy --config wrangler.json
          node "$GITHUB_WORKSPACE/scripts/catalogue-direct/public-production-smoke.mjs" https://dongphugia-v1-public-production.tranhuunguyenhuy.workers.dev "$GITHUB_SHA" workers-dev
