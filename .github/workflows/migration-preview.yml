name: New Production application CI and Preview foundation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_leo563_public_preview:
        description: Upload the exact verified PR #138 candidate as one isolated Worker Preview version
        required: true
        default: false
        type: boolean
      approved_source_sha:
        description: Exact 40-character PR #138 head SHA approved for the Preview upload
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: migration-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-code-gate:
    name: Gate New Production application changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.detect.outputs.source_sha }}
      public_changed: ${{ steps.detect.outputs.public_changed }}
      admin_changed: ${{ steps.detect.outputs.admin_changed }}
      preview_required: ${{ steps.detect.outputs.preview_required }}
      owner_approved_upload: ${{ steps.detect.outputs.owner_approved_upload }}
      pull_request_number: ${{ steps.detect.outputs.pull_request_number }}
    steps:
      - name: Checkout the complete candidate history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect material application changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          MANUAL_UPLOAD: ${{ inputs.publish_leo563_public_preview || false }}
          APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha || '' }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_UPLOAD" == "true" ]]; then
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$APPROVED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_REF_VALUE" = 'refs/heads/codex/leo-563-public-admin-ci-foundation'
            test "$SOURCE_SHA" = "$APPROVED_SOURCE_SHA"
            pr_json="$(gh api "repos/$REPOSITORY/pulls/138")"
            test "$(jq -r '.state' <<< "$pr_json")" = 'open'
            test "$(jq -r '.base.ref' <<< "$pr_json")" = 'main'
            test "$(jq -r '.head.ref' <<< "$pr_json")" = 'codex/leo-563-public-admin-ci-foundation'
            test "$(jq -r '.head.sha' <<< "$pr_json")" = "$SOURCE_SHA"
            {
              echo "source_sha=$SOURCE_SHA"
              echo 'public_changed=true'
              echo 'admin_changed=true'
              echo 'preview_required=true'
              echo 'owner_approved_upload=true'
              echo 'pull_request_number=138'
              echo 'reason=OWNER_APPROVED_EXACT_PR_138_PREVIEW_UPLOAD'
            } >> "$GITHUB_OUTPUT"
            echo 'LEO563_REPO_CODE_GATE status=OWNER_APPROVED_EXACT_PR_138_PREVIEW_UPLOAD'
            exit 0
          fi
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            {
              echo "source_sha=$SOURCE_SHA"
              echo 'public_changed=false'
              echo 'admin_changed=false'
              echo 'preview_required=false'
              echo 'owner_approved_upload=false'
              echo 'pull_request_number=0'
              echo 'reason=MANUAL_RUN_REQUIRES_EXACT_PR_DIFF'
            } >> "$GITHUB_OUTPUT"
            echo 'LEO563_REPO_CODE_GATE status=SKIPPED_MANUAL_RUN'
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          node scripts/app-foundation/preview-change-gate.mjs \
            --base "$BASE_SHA" \
            --head "$SOURCE_SHA" \
            --output "$GITHUB_OUTPUT"
          {
            echo 'reason=EXACT_PR_HEAD_DIFF'
            echo 'owner_approved_upload=false'
            echo 'pull_request_number=${{ github.event.pull_request.number }}'
          } >> "$GITHUB_OUTPUT"

  required-ci:
    name: Required repository CI
    needs: repo-code-gate
    if: needs.repo-code-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:45cd22f8d32e189d245403954882f88e7a8714301fda80dab6da90f1265b25a3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: leo561-ci-local-only
          POSTGRES_DB: leo561_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leo561_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEPLOY_TARGET: local
      LEO561_SCHEMA_TEST_URL: postgresql://postgres:leo561-ci-local-only@127.0.0.1:5432/leo561_ci
    steps:
      - name: Checkout the exact PR-head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repo-code-gate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the independently locked Public Worker toolchain
        run: npm ci --prefix apps/public

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Type-check Public independently
        run: npm run typecheck:public

      - name: Check official vinext compatibility
        working-directory: apps/public
        run: npm exec -- vinext check

      - name: Check Public Worker fail-closed contracts
        run: npm run app:public-worker:check

      - name: Test
        run: npm test

      - name: Check the legacy static artifact contract without publishing it
        run: npm run static:check

  app-preview-artifact:
    name: Build immutable Public and Admin Preview candidate
    needs: [repo-code-gate, required-ci]
    if: needs.repo-code-gate.outputs.preview_required == 'true' && needs.required-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_ready: ${{ steps.record.outputs.artifact_ready }}
      public_artifact_sha256: ${{ steps.record.outputs.public_artifact_sha256 }}
      admin_artifact_sha256: ${{ steps.record.outputs.admin_artifact_sha256 }}
    env:
      OUTPUT: ${{ github.workspace }}/.artifacts/dongphugia-app-preview
      SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
      PR_NUMBER: ${{ needs.repo-code-gate.outputs.pull_request_number }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout the exact PR-head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repo-code-gate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the independently locked Public Worker toolchain
        run: npm ci --prefix apps/public

      - name: Build the Public Worker and Static Assets independently
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: public
          APP_ORIGIN: https://public-preview.invalid
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
        run: npm run build:public-worker

      - name: Prove deterministic Public Worker, Static Assets, and config identities
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: public
          APP_ORIGIN: https://public-preview.invalid
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
          FIRST_BUILD: ${{ runner.temp }}/public-worker-first
          SECOND_BUILD: ${{ runner.temp }}/public-worker-second
        shell: bash
        run: |
          set -euo pipefail
          npm run app:assemble-public-worker -- \
            --repository-root . \
            --server-dir apps/public/dist/server \
            --assets-dir apps/public/dist/client \
            --output "$FIRST_BUILD" \
            --source-sha "$SOURCE_SHA"
          npm run build:public-worker
          npm run app:assemble-public-worker -- \
            --repository-root . \
            --server-dir apps/public/dist/server \
            --assets-dir apps/public/dist/client \
            --output "$SECOND_BUILD" \
            --source-sha "$SOURCE_SHA"
          for selector in '.worker.sha256' '.staticAssets.sha256' '.configSha256' '.previewConfig.sha256'; do
            first="$(jq -r "$selector" "$FIRST_BUILD/worker-artifact-evidence.json")"
            second="$(jq -r "$selector" "$SECOND_BUILD/worker-artifact-evidence.json")"
            test "$first" = "$second"
          done

      - name: Prove Public SSR, noindex, cache, and Preview isolation in workerd
        env:
          RUNTIME_PROOF: ${{ runner.temp }}/public-runtime-proof.json
          WRANGLER_STATE: ${{ runner.temp }}/public-worker-state
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/public run start:worker -- --persist-to "$WRANGLER_STATE" > "$RUNNER_TEMP/public-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then cat "$RUNNER_TEMP/public-worker.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null
          npm run app:runtime-proof -- \
            --application public \
            --base-url http://127.0.0.1:8787 \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNTIME_PROOF"
          kill "$worker_pid"
          wait "$worker_pid" || true
          trap - EXIT

      - name: Assemble and dry-run the deployable Public Worker candidate
        env:
          PUBLIC_DEPLOYABLE: ${{ runner.temp }}/public-worker-deployable
        run: >-
          npm run app:assemble-public-worker --
          --repository-root .
          --server-dir apps/public/dist/server
          --assets-dir apps/public/dist/client
          --output "$PUBLIC_DEPLOYABLE"
          --source-sha "$SOURCE_SHA"

      - name: Collect the Public artifact identity
        run: >-
          npm run app:collect-artifact --
          --application public
          --build-dir "${{ runner.temp }}/public-worker-deployable"
          --artifact-root "$OUTPUT/public"
          --source-sha "$SOURCE_SHA"
          --build-target public-worker-static-assets
          --runtime-proof "${{ runner.temp }}/public-runtime-proof.json"

      - name: Build Admin independently in private noindex Preview mode
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: admin
          APP_ORIGIN: https://admin-preview.invalid
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
        run: npm run build:admin

      - name: Prove Admin noindex and private no-store in its independent runtime
        env:
          RUNTIME_PROOF: ${{ runner.temp }}/admin-runtime-proof.json
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/admin run start -- --hostname 127.0.0.1 --port 8788 > "$RUNNER_TEMP/admin-runtime.log" 2>&1 &
          admin_pid=$!
          trap 'kill "$admin_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/api/health > /dev/null; then break; fi
            if ! kill -0 "$admin_pid" 2>/dev/null; then cat "$RUNNER_TEMP/admin-runtime.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8788/api/health > /dev/null
          npm run app:runtime-proof -- \
            --application admin \
            --base-url http://127.0.0.1:8788 \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNTIME_PROOF"
          kill "$admin_pid"
          wait "$admin_pid" || true
          trap - EXIT

      - name: Collect the Admin artifact identity
        run: >-
          npm run app:collect-artifact --
          --application admin
          --build-dir apps/admin/.next
          --artifact-root "$OUTPUT/admin"
          --source-sha "$SOURCE_SHA"
          --build-target admin-independent-private-runtime
          --runtime-proof "${{ runner.temp }}/admin-runtime-proof.json"

      - name: Prove deterministic Admin artifact identity
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: admin
          APP_ORIGIN: https://admin-preview.invalid
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
          ADMIN_SECOND: ${{ runner.temp }}/admin-artifact-second
        shell: bash
        run: |
          set -euo pipefail
          npm run build:admin
          npm run app:collect-artifact -- \
            --application admin \
            --build-dir apps/admin/.next \
            --artifact-root "$ADMIN_SECOND" \
            --source-sha "$SOURCE_SHA" \
            --build-target admin-independent-private-runtime \
            --runtime-proof "${{ runner.temp }}/admin-runtime-proof.json"
          first="$(jq -r '.artifactSha256' "$OUTPUT/admin/artifact-manifest.json")"
          second="$(jq -r '.artifactSha256' "$ADMIN_SECOND/artifact-manifest.json")"
          [[ "$first" =~ ^[0-9a-f]{64}$ ]]
          test "$first" = "$second"

      - name: Create the complete immutable candidate evidence
        run: >-
          npm run app:create-candidate --
          --artifact-root "$OUTPUT"
          --source-sha "$SOURCE_SHA"
          --pr-number "$PR_NUMBER"
          --workflow-run-id "$WORKFLOW_RUN_ID"
          --lockfile package-lock.json
          --public-lockfile apps/public/package-lock.json
          --migration-manifest db/postgres-migrations/manifest.json
          --evidence "$OUTPUT/candidate-evidence.json"

      - name: Verify candidate identity before artifact publication
        run: >-
          npm run app:verify-candidate --
          --artifact-root "$OUTPUT"
          --source-sha "$SOURCE_SHA"
          --pr-number "$PR_NUMBER"
          --workflow-run-id "$WORKFLOW_RUN_ID"
          --lockfile package-lock.json
          --public-lockfile apps/public/package-lock.json
          --migration-manifest db/postgres-migrations/manifest.json
          --evidence "$OUTPUT/candidate-evidence.json"

      - name: Record immutable candidate outputs
        id: record
        run: |
          set -euo pipefail
          public_sha="$(jq -r '.applications.public.artifactSha256' "$OUTPUT/candidate-evidence.json")"
          admin_sha="$(jq -r '.applications.admin.artifactSha256' "$OUTPUT/candidate-evidence.json")"
          worker_sha="$(jq -r '.candidate.publicWorkerSha256' "$OUTPUT/candidate-evidence.json")"
          assets_sha="$(jq -r '.candidate.publicStaticAssetsSha256' "$OUTPUT/candidate-evidence.json")"
          config_sha="$(jq -r '.candidate.publicConfigSha256' "$OUTPUT/candidate-evidence.json")"
          preview_config_sha="$(jq -r '.candidate.publicPreviewConfigSha256' "$OUTPUT/candidate-evidence.json")"
          [[ "$public_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$admin_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$worker_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$assets_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$config_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$preview_config_sha" =~ ^[0-9a-f]{64}$ ]]
          test "$public_sha" != "$admin_sha"
          {
            echo 'artifact_ready=true'
            echo "public_artifact_sha256=$public_sha"
            echo "admin_artifact_sha256=$admin_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### New Production application candidate: PASS'
            echo "- Exact source SHA: $SOURCE_SHA"
            echo "- Public artifact SHA-256: $public_sha"
            echo "- Admin artifact SHA-256: $admin_sha"
            echo "- Public Worker SHA-256: $worker_sha"
            echo "- Public Static Assets SHA-256: $assets_sha"
            echo "- Public deploy config SHA-256: $config_sha"
            echo "- Owner-gated Public Preview config SHA-256: $preview_config_sha"
            echo '- Public/Admin build targets: independent'
            echo '- Preview HTML/header/robots noindex posture: runtime-derived PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the immutable Public/Admin candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: dongphugia-app-preview-${{ needs.repo-code-gate.outputs.source_sha }}
          path: ${{ env.OUTPUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  cloudflare-readonly-discovery:
    name: Discover existing Cloudflare Preview resources read-only
    needs: [repo-code-gate, required-ci, app-preview-artifact]
    if: needs.repo-code-gate.outputs.preview_required == 'true' && needs.repo-code-gate.outputs.owner_approved_upload != 'true' && needs.required-ci.result == 'success' && needs.app-preview-artifact.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.record.outputs.result }}
    steps:
      - name: Checkout the exact PR-head discovery implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repo-code-gate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Inventory Cloudflare resources with read-only API calls
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READONLY_DISCOVERY_TOKEN }}
          DISCOVERY_OUTPUT: ${{ runner.temp }}/cloudflare-readonly-discovery.json
        run: >-
          node scripts/app-foundation/cloudflare-readonly-discovery.mjs
          --output "$DISCOVERY_OUTPUT"
          --source-sha "${{ needs.repo-code-gate.outputs.source_sha }}"

      - name: Record sanitized discovery disposition
        id: record
        env:
          DISCOVERY_OUTPUT: ${{ runner.temp }}/cloudflare-readonly-discovery.json
        shell: bash
        run: |
          set -euo pipefail
          account_state="$(jq -r '.credentials.accountId' "$DISCOVERY_OUTPUT")"
          token_state="$(jq -r '.credentials.apiToken' "$DISCOVERY_OUTPUT")"
          if [[ "$account_state" != "AVAILABLE" || "$token_state" != "AVAILABLE" ]]; then
            result='CREDENTIALS_UNAVAILABLE'
          elif jq -e '[.calls[] | select(.label == "workers.scripts.list" or .label == "workers.domains.list" or .label == "workers.routes.list.dongphugia.vn" or .label == "pages.projects.list") | .status] | length == 4 and all(. == "READ_OK")' "$DISCOVERY_OUTPUT" >/dev/null; then
            result='READ_COMPLETE'
          else
            result='READ_PERMISSION_INCOMPLETE'
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare read-only discovery: $result"
            echo "- Account ID secret reference: $account_state"
            echo "- API token secret reference: $token_state"
            echo "- Existing Workers: $(jq -r '[.workers[].name] | if length == 0 then "NONE_DISCOVERED" else join(", ") end' "$DISCOVERY_OUTPUT")"
            echo "- Existing Pages projects: $(jq -r '[.pagesProjects[].name] | if length == 0 then "NONE_DISCOVERED" else join(", ") end' "$DISCOVERY_OUTPUT")"
            echo "- Suitable isolated Public Worker: $(jq -r '.suitableIsolatedPublicWorker // "NONE_PROVEN"' "$DISCOVERY_OUTPUT")"
            echo "- Workers Free confirmed: $(jq -r '.workersPlan.freeConfirmed' "$DISCOVERY_OUTPUT")"
            echo '- Mutating API methods and Wrangler publication: not invoked.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized read-only discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-readonly-discovery-${{ needs.repo-code-gate.outputs.source_sha }}
          path: ${{ runner.temp }}/cloudflare-readonly-discovery.json
          if-no-files-found: error
          retention-days: 30

  cloudflare-preview-upload:
    name: Upload and verify the Owner-approved isolated Public Worker Preview
    needs: [repo-code-gate, required-ci, app-preview-artifact]
    if: needs.repo-code-gate.outputs.owner_approved_upload == 'true' && needs.repo-code-gate.outputs.preview_required == 'true' && needs.required-ci.result == 'success' && needs.app-preview-artifact.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.record.outputs.result }}
      worker_version_id: ${{ steps.record.outputs.worker_version_id }}
      preview_url: ${{ steps.record.outputs.preview_url }}
    env:
      SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
      PR_NUMBER: ${{ needs.repo-code-gate.outputs.pull_request_number }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/dongphugia-app-preview-download
      EVIDENCE_DIR: ${{ github.workspace }}/.artifacts/leo563-public-preview-evidence
      WRANGLER_BIN: ${{ github.workspace }}/apps/public/node_modules/wrangler/bin/wrangler.js
    steps:
      - name: Checkout the exact Owner-approved PR-head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repo-code-gate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install candidate verification and pinned Wrangler toolchains
        run: |
          npm ci
          npm ci --prefix apps/public

      - name: Download the immutable exact-head candidate from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: dongphugia-app-preview-${{ needs.repo-code-gate.outputs.source_sha }}
          path: ${{ env.ARTIFACT_ROOT }}

      - name: Re-verify the complete candidate identity before any Cloudflare mutation
        run: >-
          npm run app:verify-candidate --
          --artifact-root "$ARTIFACT_ROOT"
          --source-sha "$SOURCE_SHA"
          --pr-number "$PR_NUMBER"
          --workflow-run-id "$WORKFLOW_RUN_ID"
          --lockfile package-lock.json
          --public-lockfile apps/public/package-lock.json
          --migration-manifest db/postgres-migrations/manifest.json
          --evidence "$ARTIFACT_ROOT/candidate-evidence.json"

      - name: Prove Worker identity, Free limits, Preview-only config, and Production isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          npm run app:preview-publication -- preflight \
            --artifact-root "$ARTIFACT_ROOT" \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --output "$EVIDENCE_DIR/publication-preflight.json"
          cd "$ARTIFACT_ROOT/public/build"
          node "$WRANGLER_BIN" versions upload \
            --dry-run \
            --strict \
            --config wrangler.preview.json \
            --preview-alias pr-138

      - name: Prove the exact Worker does not already exist before creation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}
        run: >-
          npm run app:preview-publication -- assert-resource-absent
          --output "$EVIDENCE_DIR/remote-preflight.json"

      - name: Bootstrap the absent Worker from the verified candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.workerAbsent' "$EVIDENCE_DIR/remote-preflight.json")" = 'true'
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          cd "$ARTIFACT_ROOT/public/build"
          node "$WRANGLER_BIN" deploy \
            --strict \
            --config wrangler.preview.json \
            --message "LEO-563 PR #138 bootstrap source $SOURCE_SHA" \
            2>&1 | tee "$EVIDENCE_DIR/bootstrap-deploy.log"

      - name: Upload one immutable Worker version with the PR #138 Preview alias
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          cd "$ARTIFACT_ROOT/public/build"
          node "$WRANGLER_BIN" versions upload \
            --strict \
            --config wrangler.preview.json \
            --preview-alias pr-138 \
            --tag "leo563-${SOURCE_SHA:0:12}" \
            --message "LEO-563 PR #138 source $SOURCE_SHA" \
            2>&1 | tee "$EVIDENCE_DIR/wrangler-upload.log"

      - name: Record the immutable version and workers.dev Preview identity
        run: >-
          npm run app:preview-publication -- record-upload
          --input "$EVIDENCE_DIR/wrangler-upload.log"
          --preflight "$EVIDENCE_DIR/publication-preflight.json"
          --source-sha "$SOURCE_SHA"
          --output "$EVIDENCE_DIR/upload-evidence.json"

      - name: Inspect the created Worker with sanitized GET-only calls
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}
        run: >-
          npm run app:preview-publication -- inspect-resource
          --upload "$EVIDENCE_DIR/upload-evidence.json"
          --output "$EVIDENCE_DIR/resource-proof.json"

      - name: Prove real HTTPS SSR, noindex, cache, health, robots, and source identity
        shell: bash
        run: |
          set -euo pipefail
          preview_url="$(jq -r '.previewUrl' "$EVIDENCE_DIR/upload-evidence.json")"
          npm run app:real-preview-proof -- \
            --url "$preview_url" \
            --source-sha "$SOURCE_SHA" \
            --output "$EVIDENCE_DIR/runtime-proof.json"

      - name: Record the accepted real Public Preview result
        id: record
        shell: bash
        run: |
          set -euo pipefail
          version_id="$(jq -r '.workerVersionId' "$EVIDENCE_DIR/upload-evidence.json")"
          preview_url="$(jq -r '.previewUrl' "$EVIDENCE_DIR/upload-evidence.json")"
          test "$(jq -r '.sourceCommit' "$EVIDENCE_DIR/runtime-proof.json")" = "$SOURCE_SHA"
          test "$(jq -r '.observations.cache.first' "$EVIDENCE_DIR/runtime-proof.json")" = 'MISS'
          test "$(jq -r '.observations.cache.subsequent' "$EVIDENCE_DIR/runtime-proof.json")" = 'HIT'
          test "$(jq -r '.customDomains | length' "$EVIDENCE_DIR/resource-proof.json")" = '0'
          {
            echo 'result=REAL_PUBLIC_PREVIEW_PASS'
            echo "worker_version_id=$version_id"
            echo "preview_url=$preview_url"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### LEO-563 isolated Public Worker Preview: PASS'
            echo "- Exact source SHA: $SOURCE_SHA"
            echo '- Worker: dongphugia-v1-public-preview'
            echo "- Worker version ID: $version_id"
            echo '- Preview alias: pr-138'
            echo "- Preview URL: $preview_url"
            echo '- Workers Free plan and hard 10 ms CPU / 50 subrequest limits: confirmed'
            echo '- Real SSR, health, HTML/header/robots noindex, MISS/HIT/bypass, and 300-second freshness: PASS'
            echo '- Preview URL CPU measurement: PROVIDER_LIMITATION; Preview URL logs/tail/Logpush are unavailable.'
            echo '- Custom domains/routes/Production binding/DNS/traffic: NONE'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized immutable Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leo563-real-public-preview-${{ needs.repo-code-gate.outputs.source_sha }}
          path: |
            ${{ env.EVIDENCE_DIR }}/publication-preflight.json
            ${{ env.EVIDENCE_DIR }}/remote-preflight.json
            ${{ env.EVIDENCE_DIR }}/upload-evidence.json
            ${{ env.EVIDENCE_DIR }}/resource-proof.json
            ${{ env.EVIDENCE_DIR }}/runtime-proof.json
          if-no-files-found: warn
          retention-days: 90

  cloudflare-preview-gate:
    name: Existing Cloudflare Preview owner gate
    needs: [repo-code-gate, required-ci, app-preview-artifact, cloudflare-readonly-discovery, cloudflare-preview-upload]
    if: always()
    outputs:
      result: ${{ steps.gate.outputs.result }}
    runs-on: ubuntu-latest
    steps:
      - name: Keep external Preview fail closed
        id: gate
        env:
          REPO_GATE_RESULT: ${{ needs.repo-code-gate.result }}
          CI_RESULT: ${{ needs.required-ci.result }}
          PREVIEW_REQUIRED: ${{ needs.repo-code-gate.outputs.preview_required }}
          ARTIFACT_RESULT: ${{ needs.app-preview-artifact.result }}
          ARTIFACT_READY: ${{ needs.app-preview-artifact.outputs.artifact_ready }}
          DISCOVERY_RESULT: ${{ needs.cloudflare-readonly-discovery.outputs.result }}
          OWNER_APPROVED_UPLOAD: ${{ needs.repo-code-gate.outputs.owner_approved_upload }}
          UPLOAD_JOB_RESULT: ${{ needs.cloudflare-preview-upload.result }}
          UPLOAD_RESULT: ${{ needs.cloudflare-preview-upload.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPO_GATE_RESULT" != "success" || "$CI_RESULT" != "success" ]]; then
            echo 'result=BLOCKED_BY_CI_FAILURE' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PREVIEW_REQUIRED" != "true" ]]; then
            echo 'result=SKIPPED_UNRELATED_CHANGE' >> "$GITHUB_OUTPUT"
            echo '### Cloudflare Preview: SKIPPED_UNRELATED_CHANGE' >> "$GITHUB_STEP_SUMMARY"
            echo 'The exact repository predicate found no material Public/Admin artifact change; no Preview candidate or external call was attempted.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$ARTIFACT_RESULT" == "failure" || "$ARTIFACT_READY" != "true" ]]; then
            echo 'result=BLOCKED_BY_ARTIFACT_FAILURE' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OWNER_APPROVED_UPLOAD" == "true" ]]; then
            if [[ "$UPLOAD_JOB_RESULT" != "success" || "$UPLOAD_RESULT" != "REAL_PUBLIC_PREVIEW_PASS" ]]; then
              echo 'result=BLOCKED_BY_REAL_PREVIEW_FAILURE' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'result=REAL_PUBLIC_PREVIEW_PASS' >> "$GITHUB_OUTPUT"
            {
              echo '### Cloudflare Preview: REAL_PUBLIC_PREVIEW_PASS'
              echo '- One immutable version was uploaded to dongphugia-v1-public-preview with alias pr-138.'
              echo '- No Production deployment, custom domain, route, DNS, traffic, or paid-plan mutation was performed.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$DISCOVERY_RESULT" != "READ_COMPLETE" && "$DISCOVERY_RESULT" != "READ_PERMISSION_INCOMPLETE" && "$DISCOVERY_RESULT" != "CREDENTIALS_UNAVAILABLE" ]]; then
            echo 'result=BLOCKED_BY_DISCOVERY_FAILURE' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'result=BLOCKED_BY_OWNER_GATE' >> "$GITHUB_OUTPUT"
          {
            echo '### Cloudflare Preview: BLOCKED_BY_OWNER_GATE'
            echo "- Read-only discovery result: $DISCOVERY_RESULT"
            echo '- Admin external Preview is deferred and is not an LEO-563 blocker.'
            echo '- Supabase connectivity is deferred to LEO-564; no legacy runtime is bound.'
            echo '- No Cloudflare resource/version/deployment, binding, custom-domain, DNS, or traffic mutation was attempted.'
            echo '- Owner decision required: approve the exact isolated Public Preview Worker resource and immutable version-upload contract after reviewing sanitized discovery.'
          } >> "$GITHUB_STEP_SUMMARY"

  preview-gate:
    name: New Production Preview gate
    needs: [repo-code-gate, required-ci, app-preview-artifact, cloudflare-preview-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce CI and record the final Preview result
        env:
          REPO_GATE_RESULT: ${{ needs.repo-code-gate.result }}
          CI_RESULT: ${{ needs.required-ci.result }}
          PREVIEW_REQUIRED: ${{ needs.repo-code-gate.outputs.preview_required }}
          ARTIFACT_RESULT: ${{ needs.app-preview-artifact.result }}
          ARTIFACT_READY: ${{ needs.app-preview-artifact.outputs.artifact_ready }}
          CLOUDFLARE_RESULT: ${{ needs.cloudflare-preview-gate.outputs.result }}
          OWNER_APPROVED_UPLOAD: ${{ needs.repo-code-gate.outputs.owner_approved_upload }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPO_GATE_RESULT" != "success" || "$CI_RESULT" != "success" ]]; then
            echo 'Repository CI or exact repo-code gate failed; the Preview path is blocked.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$PREVIEW_REQUIRED" != "true" ]]; then
            {
              echo '### Final Preview result: SKIPPED_UNRELATED_CHANGE'
              echo '- DB/import/docs-only changes cannot reach the application candidate or Cloudflare publication path.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$ARTIFACT_RESULT" == "failure" || "$ARTIFACT_READY" != "true" ]]; then
            echo 'Application candidate build or identity verification failed closed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$OWNER_APPROVED_UPLOAD" == "true" ]]; then
            if [[ "$CLOUDFLARE_RESULT" != "REAL_PUBLIC_PREVIEW_PASS" ]]; then
              echo 'Owner-approved real Public Preview failed closed.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            {
              echo '### Final Preview result: REAL_PUBLIC_PREVIEW_PASS'
              echo '- Exact-head Public/Admin candidate verification: PASS'
              echo '- Isolated Public Worker version/alias Preview and real HTTPS acceptance: PASS'
              echo '- Admin external Preview: downstream scope and not an LEO-563 blocker.'
              echo '- Supabase connectivity: deferred to LEO-564.'
              echo '- Production custom domain/DNS/traffic: unchanged.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$CLOUDFLARE_RESULT" != "BLOCKED_BY_OWNER_GATE" ]]; then
            echo 'Unexpected external Preview state; fail closed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo '### Final Preview result: BLOCKED_BY_OWNER_GATE'
            echo '- Public/Admin artifacts: built, separately identified, and uploaded as CI-only evidence.'
            echo '- Cloudflare publication: not attempted until the exact isolated Public Preview Worker contract is owner-approved.'
            echo '- Admin external Preview: downstream scope and not an LEO-563 blocker.'
            echo '- Supabase connectivity: deferred to LEO-564.'
            echo '- Production custom domain/DNS/traffic: unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
