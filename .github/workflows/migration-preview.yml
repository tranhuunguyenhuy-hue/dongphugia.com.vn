name: New Production application CI and Preview foundation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: migration-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-code-gate:
    name: Gate New Production application changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.detect.outputs.source_sha }}
      public_changed: ${{ steps.detect.outputs.public_changed }}
      admin_changed: ${{ steps.detect.outputs.admin_changed }}
      preview_required: ${{ steps.detect.outputs.preview_required }}
      integration_required: ${{ steps.detect.outputs.integration_required }}
      b11_required: ${{ steps.detect.outputs.b11_required }}
      ci_required: ${{ steps.detect.outputs.ci_required }}
      owner_approved_upload: ${{ steps.detect.outputs.owner_approved_upload }}
      pull_request_number: ${{ steps.detect.outputs.pull_request_number }}
    steps:
      - name: Checkout the complete candidate history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect material application changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            {
              echo "source_sha=$SOURCE_SHA"
              echo 'public_changed=false'
              echo 'admin_changed=false'
              echo 'preview_required=false'
              echo 'integration_required=false'
              echo 'b11_required=false'
              echo 'ci_required=false'
              echo 'owner_approved_upload=false'
              echo 'pull_request_number=0'
              echo 'reason=PR_EVENT_REQUIRED'
            } >> "$GITHUB_OUTPUT"
            echo 'LEO563_REPO_CODE_GATE status=SKIPPED_NON_PR_EVENT'
            exit 0
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          node scripts/app-foundation/preview-change-gate.mjs \
            --base "$BASE_SHA" \
            --head "$SOURCE_SHA" \
            --output "$GITHUB_OUTPUT"
          owner_approved_upload=false
          if [[ "$EVENT_ACTION" == 'labeled' && "$EVENT_LABEL" == 'preview-approved' ]]; then
            test "$ACTOR" = 'tranhuunguyenhuy-hue'
            pr_json="$(gh api "repos/$REPOSITORY/pulls/${{ github.event.pull_request.number }}")"
            test "$(jq -r '.state' <<< "$pr_json")" = 'open'
            test "$(jq -r '.base.ref' <<< "$pr_json")" = 'main'
            test "$(jq -r '.base.repo.full_name' <<< "$pr_json")" = "$REPOSITORY"
            test "$(jq -r '.head.repo.full_name' <<< "$pr_json")" = "$REPOSITORY"
            test "$(jq -r '.head.sha' <<< "$pr_json")" = "$SOURCE_SHA"
            grep -qx 'preview_required=true' "$GITHUB_OUTPUT"
            owner_approved_upload=true
            echo 'LEO563_REPO_CODE_GATE status=OWNER_LABEL_APPROVED_EXACT_PR_SHA'
          fi
          {
            echo 'reason=EXACT_PR_HEAD_DIFF'
            echo "owner_approved_upload=$owner_approved_upload"
            echo 'pull_request_number=${{ github.event.pull_request.number }}'
          } >> "$GITHUB_OUTPUT"

  required-ci:
    name: Required repository CI
    needs: repo-code-gate
    if: needs.repo-code-gate.result == 'success' && needs.repo-code-gate.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:45cd22f8d32e189d245403954882f88e7a8714301fda80dab6da90f1265b25a3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: leo561-ci-local-only
          POSTGRES_DB: leo561_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leo561_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEPLOY_TARGET: local
      LEO561_SCHEMA_TEST_URL: postgresql://postgres:leo561-ci-local-only@127.0.0.1:5432/leo561_ci
    steps:
      - name: Checkout the exact PR-head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repo-code-gate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        if: needs.repo-code-gate.outputs.preview_required == 'true' || needs.repo-code-gate.outputs.integration_required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: needs.repo-code-gate.outputs.preview_required == 'true' || needs.repo-code-gate.outputs.integration_required == 'true'
        run: npm ci

      - name: Install the independently locked Public Worker toolchain
        if: needs.repo-code-gate.outputs.preview_required == 'true'
        run: npm ci --prefix apps/public

      # General lint/typecheck/unit tests belong exclusively to quality.yml.
      # A second test pass is justified only for data/auth/order/CI control changes:
      # this job supplies a disposable Postgres URL absent from the fast quality job.
      - name: Database, Auth and commerce integration tests
        if: needs.repo-code-gate.outputs.integration_required == 'true'
        run: npm test

      - name: Type-check Public independently
        if: needs.repo-code-gate.outputs.preview_required == 'true'
        run: npm run typecheck:public

      - name: Check official vinext compatibility
        if: needs.repo-code-gate.outputs.preview_required == 'true'
        working-directory: apps/public
        run: npm exec -- vinext check

      - name: Check Public Worker fail-closed contracts
        if: needs.repo-code-gate.outputs.preview_required == 'true'
        run: npm run app:public-worker:check

      - name: B11 public synthetic re-wrap contracts
        if: needs.repo-code-gate.outputs.b11_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/backup -p 'test_b11_rewrap_*.py' -v
          mkdir -p "$RUNNER_TEMP/b11-public-age"
          curl --fail --location --silent --show-error --max-time 120 \
            --output "$RUNNER_TEMP/b11-public-age/age.tar.gz" \
            'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz'
          printf '%s  %s\n' \
            'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10' \
            "$RUNNER_TEMP/b11-public-age/age.tar.gz" | sha256sum --check --status
          tar -xOzf "$RUNNER_TEMP/b11-public-age/age.tar.gz" age/age > "$RUNNER_TEMP/b11-public-age/age"
          tar -xOzf "$RUNNER_TEMP/b11-public-age/age.tar.gz" age/age-keygen > "$RUNNER_TEMP/b11-public-age/age-keygen"
          chmod 0555 "$RUNNER_TEMP/b11-public-age/age" "$RUNNER_TEMP/b11-public-age/age-keygen"
          printf '%s  %s\n' \
            'eb7dd1b518f0a307c99cd97782623c5321da049154b04acd2d98d21aa7bc9b2c' \
            "$RUNNER_TEMP/b11-public-age/age" | sha256sum --check --status
          docker pull 'python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704' >/dev/null
          docker run --rm --pull=never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 768m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --mount "type=bind,src=$RUNNER_TEMP/b11-public-age/age,dst=/opt/age,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/b11-public-age/age-keygen,dst=/opt/age-keygen,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/backup/b11_rewrap_core.py,dst=/opt/b11_rewrap_core.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/backup/test_b11_rewrap_linux.py,dst=/opt/test_b11_rewrap_linux.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/backup/fixtures/b11-stalled-age.sh,dst=/opt/b11-stalled-age.sh,readonly" \
            --env B11_TEST_AGE_BIN=/opt/age --env B11_TEST_AGE_KEYGEN_BIN=/opt/age-keygen \
            --env B11_TEST_STALLED_AGE_BIN=/opt/b11-stalled-age.sh \
            --env PYTHONDONTWRITEBYTECODE=1 \
            'python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704' \
            python3 -B /opt/test_b11_rewrap_linux.py

      - name: B11 public-only Docker file permission handoff
        if: needs.repo-code-gate.outputs.b11_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/b11-public-permission-probe"
          mkdir -p "$probe/output"
          printf 'B11_PUBLIC_PERMISSION_FIXTURE' > "$probe/input"
          chmod 0600 "$probe/input"
          chmod 0700 "$probe/output"
          sudo chown 65534:65534 "$probe/input" "$probe/output"
          docker run --rm --pull=never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --mount "type=bind,src=$probe/input,dst=/input/probe,readonly" \
            --mount "type=bind,src=$probe/output,dst=/output" \
            'python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704' \
            sh -c 'umask 077; cat /input/probe > /output/probe'
          sudo test -f "$probe/output/probe"
          sudo test ! -L "$probe/output/probe"
          sudo chown "$(id -u):$(id -g)" "$probe/output" "$probe/output/probe"
          test -r "$probe/output/probe"
          test "$(cat "$probe/output/probe")" = 'B11_PUBLIC_PERMISSION_FIXTURE'

      - name: Check the legacy static artifact contract without publishing it
        if: needs.repo-code-gate.outputs.preview_required == 'true'
        run: npm run static:check

  app-preview-artifact:
    name: Build immutable Public and Admin Preview candidate
    needs: [repo-code-gate, required-ci]
    if: needs.repo-code-gate.outputs.preview_required == 'true' && needs.required-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_ready: ${{ steps.record.outputs.artifact_ready }}
      public_artifact_sha256: ${{ steps.record.outputs.public_artifact_sha256 }}
      admin_artifact_sha256: ${{ steps.record.outputs.admin_artifact_sha256 }}
      admin_worker_artifact_sha256: ${{ steps.record.outputs.admin_worker_artifact_sha256 }}
    env:
      OUTPUT: ${{ github.workspace }}/.artifacts/dongphugia-app-preview
      SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
      PR_NUMBER: ${{ needs.repo-code-gate.outputs.pull_request_number }}
      DPG_PREVIEW_PR_NUMBER: ${{ needs.repo-code-gate.outputs.pull_request_number }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout the exact PR-head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repo-code-gate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the independently locked Public Worker toolchain
        run: npm ci --prefix apps/public

      - name: Build the Public Worker and Static Assets independently
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: public
          APP_ORIGIN: https://public-preview.invalid
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
        run: npm run build:public-worker

      - name: Prove deterministic Public Worker, Static Assets, and config identities
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: public
          APP_ORIGIN: https://public-preview.invalid
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
          FIRST_BUILD: ${{ runner.temp }}/public-worker-first
          SECOND_BUILD: ${{ runner.temp }}/public-worker-second
        shell: bash
        run: |
          set -euo pipefail
          npm run app:assemble-public-worker -- \
            --repository-root . \
            --server-dir apps/public/dist/server \
            --assets-dir apps/public/dist/client \
            --output "$FIRST_BUILD" \
            --source-sha "$SOURCE_SHA"
          npm run build:public-worker
          npm run app:assemble-public-worker -- \
            --repository-root . \
            --server-dir apps/public/dist/server \
            --assets-dir apps/public/dist/client \
            --output "$SECOND_BUILD" \
            --source-sha "$SOURCE_SHA"
          for selector in '.worker.sha256' '.staticAssets.sha256' '.configSha256' '.previewConfig.sha256'; do
            first="$(jq -r "$selector" "$FIRST_BUILD/worker-artifact-evidence.json")"
            second="$(jq -r "$selector" "$SECOND_BUILD/worker-artifact-evidence.json")"
            test "$first" = "$second"
          done

      - name: Preserve code-only evidence when immutable identity proof fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-determinism-failure-${{ needs.repo-code-gate.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/public-worker-first/worker
            ${{ runner.temp }}/public-worker-first/worker-artifact-evidence.json
            ${{ runner.temp }}/public-worker-second/worker
            ${{ runner.temp }}/public-worker-second/worker-artifact-evidence.json
          retention-days: 1
          if-no-files-found: ignore
          include-hidden-files: false

      - name: Prove Public SSR, noindex, cache, and Preview isolation in workerd
        env:
          RUNTIME_PROOF: ${{ runner.temp }}/public-runtime-proof.json
          WRANGLER_STATE: ${{ runner.temp }}/public-worker-state
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/public run start:worker -- --persist-to "$WRANGLER_STATE" > "$RUNNER_TEMP/public-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then cat "$RUNNER_TEMP/public-worker.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null
          npm run app:runtime-proof -- \
            --application public \
            --base-url http://127.0.0.1:8787 \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNTIME_PROOF"
          kill "$worker_pid"
          wait "$worker_pid" || true
          trap - EXIT

      - name: Assemble and dry-run the deployable Public Worker candidate
        env:
          PUBLIC_DEPLOYABLE: ${{ runner.temp }}/public-worker-deployable
        run: >-
          npm run app:assemble-public-worker --
          --repository-root .
          --server-dir apps/public/dist/server
          --assets-dir apps/public/dist/client
          --output "$PUBLIC_DEPLOYABLE"
          --source-sha "$SOURCE_SHA"

      - name: Collect the Public artifact identity
        run: >-
          npm run app:collect-artifact --
          --application public
          --build-dir "${{ runner.temp }}/public-worker-deployable"
          --artifact-root "$OUTPUT/public"
          --source-sha "$SOURCE_SHA"
          --build-target public-worker-static-assets
          --runtime-proof "${{ runner.temp }}/public-runtime-proof.json"

      - name: Install the independently locked Admin toolchain before Next builds
        run: npm ci --prefix apps/admin

      - name: Build Admin independently in private noindex Preview mode
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: admin
          APP_ORIGIN: https://admin-preview.invalid
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_preview_runtime_test
        run: npm run build:admin

      - name: Prove Admin noindex and private no-store in its independent runtime
        env:
          RUNTIME_PROOF: ${{ runner.temp }}/admin-runtime-proof.json
          BUILD_SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_preview_runtime_test
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/admin run start -- --hostname 127.0.0.1 --port 8788 > "$RUNNER_TEMP/admin-runtime.log" 2>&1 &
          admin_pid=$!
          trap 'kill "$admin_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/api/health > /dev/null; then break; fi
            if ! kill -0 "$admin_pid" 2>/dev/null; then cat "$RUNNER_TEMP/admin-runtime.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8788/api/health > /dev/null
          npm run app:runtime-proof -- \
            --application admin \
            --base-url http://127.0.0.1:8788 \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNTIME_PROOF"
          kill "$admin_pid"
          wait "$admin_pid" || true
          trap - EXIT

      - name: Collect the Admin artifact identity
        run: >-
          npm run app:collect-artifact --
          --application admin
          --build-dir apps/admin/.next
          --artifact-root "$OUTPUT/admin"
          --source-sha "$SOURCE_SHA"
          --build-target admin-independent-private-runtime
          --runtime-proof "${{ runner.temp }}/admin-runtime-proof.json"

      - name: Build the isolated Cloudflare Admin Worker
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: admin
          APP_ORIGIN: https://dongphugia-phase2-admin-preview-290.tranhuunguyenhuy.workers.dev
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
        run: npm --prefix apps/admin run build:vinext

      - name: Capture the exact Admin Worker artifact identity
        env:
          ADMIN_WORKER_OUTPUT: ${{ env.OUTPUT }}/admin-worker/build-output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT/admin-worker"
          cp -a apps/admin/.cloudflare/output/v0 "$ADMIN_WORKER_OUTPUT"
          node scripts/preview/admin-worker-artifact.mjs \
            --mode capture \
            --build-output "$ADMIN_WORKER_OUTPUT" \
            --evidence "$OUTPUT/admin-worker/artifact-evidence.json" \
            --source-sha "$SOURCE_SHA"

      - name: Prove deterministic Admin artifact identity
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: admin
          APP_ORIGIN: https://admin-preview.invalid
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ needs.repo-code-gate.outputs.source_sha }}
          ADMIN_SECOND: ${{ runner.temp }}/admin-artifact-second
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_preview_runtime_test
        shell: bash
        run: |
          set -euo pipefail
          npm run build:admin
          npm run app:collect-artifact -- \
            --application admin \
            --build-dir apps/admin/.next \
            --artifact-root "$ADMIN_SECOND" \
            --source-sha "$SOURCE_SHA" \
            --build-target admin-independent-private-runtime \
            --runtime-proof "${{ runner.temp }}/admin-runtime-proof.json"
          first="$(jq -r '.artifactSha256' "$OUTPUT/admin/artifact-manifest.json")"
          second="$(jq -r '.artifactSha256' "$ADMIN_SECOND/artifact-manifest.json")"
          [[ "$first" =~ ^[0-9a-f]{64}$ ]]
          test "$first" = "$second"

      - name: Create the complete immutable candidate evidence
        run: >-
          npm run app:create-candidate --
          --artifact-root "$OUTPUT"
          --source-sha "$SOURCE_SHA"
          --pr-number "$PR_NUMBER"
          --workflow-run-id "$WORKFLOW_RUN_ID"
          --lockfile package-lock.json
          --public-lockfile apps/public/package-lock.json
          --migration-manifest db/postgres-migrations/manifest.json
          --evidence "$OUTPUT/candidate-evidence.json"

      - name: Verify candidate identity before artifact publication
        run: >-
          npm run app:verify-candidate --
          --artifact-root "$OUTPUT"
          --source-sha "$SOURCE_SHA"
          --pr-number "$PR_NUMBER"
          --workflow-run-id "$WORKFLOW_RUN_ID"
          --lockfile package-lock.json
          --public-lockfile apps/public/package-lock.json
          --migration-manifest db/postgres-migrations/manifest.json
          --evidence "$OUTPUT/candidate-evidence.json"

      - name: Record immutable candidate outputs
        id: record
        run: |
          set -euo pipefail
          public_sha="$(jq -r '.applications.public.artifactSha256' "$OUTPUT/candidate-evidence.json")"
          admin_sha="$(jq -r '.applications.admin.artifactSha256' "$OUTPUT/candidate-evidence.json")"
          admin_worker_sha="$(jq -r '.buildOutput.sha256' "$OUTPUT/admin-worker/artifact-evidence.json")"
          worker_sha="$(jq -r '.candidate.publicWorkerSha256' "$OUTPUT/candidate-evidence.json")"
          assets_sha="$(jq -r '.candidate.publicStaticAssetsSha256' "$OUTPUT/candidate-evidence.json")"
          config_sha="$(jq -r '.candidate.publicConfigSha256' "$OUTPUT/candidate-evidence.json")"
          preview_config_sha="$(jq -r '.candidate.publicPreviewConfigSha256' "$OUTPUT/candidate-evidence.json")"
          [[ "$public_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$admin_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$admin_worker_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$worker_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$assets_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$config_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$preview_config_sha" =~ ^[0-9a-f]{64}$ ]]
          test "$public_sha" != "$admin_sha"
          {
            echo 'artifact_ready=true'
            echo "public_artifact_sha256=$public_sha"
            echo "admin_artifact_sha256=$admin_sha"
            echo "admin_worker_artifact_sha256=$admin_worker_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### New Production application candidate: PASS'
            echo "- Exact source SHA: $SOURCE_SHA"
            echo "- Public artifact SHA-256: $public_sha"
            echo "- Admin artifact SHA-256: $admin_sha"
            echo "- Admin Worker artifact SHA-256: $admin_worker_sha"
            echo "- Public Worker SHA-256: $worker_sha"
            echo "- Public Static Assets SHA-256: $assets_sha"
            echo "- Public deploy config SHA-256: $config_sha"
            echo "- Owner-gated Public Preview config SHA-256: $preview_config_sha"
            echo '- Public/Admin build targets: independent'
            echo '- Preview HTML/header/robots noindex posture: runtime-derived PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the immutable Public/Admin candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: dongphugia-app-preview-${{ needs.repo-code-gate.outputs.source_sha }}
          path: ${{ env.OUTPUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  cloudflare-readonly-discovery:
    name: Discover existing Cloudflare Preview resources read-only
    needs: [repo-code-gate, required-ci, app-preview-artifact]
    if: needs.repo-code-gate.outputs.preview_required == 'true' && needs.required-ci.result == 'success' && needs.app-preview-artifact.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.record.outputs.result }}
      workers_plan_status: ${{ steps.record.outputs.workers_plan_status }}
    steps:
      - name: Checkout the exact PR-head discovery implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repo-code-gate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Inventory Cloudflare resources with read-only API calls
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READONLY_DISCOVERY_TOKEN }}
          DISCOVERY_OUTPUT: ${{ runner.temp }}/cloudflare-readonly-discovery.json
        run: >-
          node scripts/app-foundation/cloudflare-readonly-discovery.mjs
          --output "$DISCOVERY_OUTPUT"
          --source-sha "${{ needs.repo-code-gate.outputs.source_sha }}"

      - name: Record sanitized discovery disposition
        id: record
        env:
          DISCOVERY_OUTPUT: ${{ runner.temp }}/cloudflare-readonly-discovery.json
        shell: bash
        run: |
          set -euo pipefail
          account_state="$(jq -r '.credentials.accountId' "$DISCOVERY_OUTPUT")"
          token_state="$(jq -r '.credentials.apiToken' "$DISCOVERY_OUTPUT")"
          plan_status="$(jq -r '.workersPlan.planStatus // "UNKNOWN"' "$DISCOVERY_OUTPUT")"
          plan_evidence="$(jq -r '.workersPlan.evidence // "NO_COST_EVIDENCE"' "$DISCOVERY_OUTPUT")"
          if [[ "$account_state" != "AVAILABLE" || "$token_state" != "AVAILABLE" ]]; then
            result='CREDENTIALS_UNAVAILABLE'
          elif jq -e '[.calls[] | select(.label == "workers.scripts.list" or .label == "workers.domains.list" or .label == "workers.routes.list.dongphugia.vn" or .label == "workers.account-settings.get") | .status] | length == 4 and all(. == "READ_OK")' "$DISCOVERY_OUTPUT" >/dev/null; then
            result='READ_COMPLETE'
          else
            result='READ_PERMISSION_INCOMPLETE'
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "workers_plan_status=$plan_status" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare read-only discovery: $result"
            echo "- Account ID secret reference: $account_state"
            echo "- API token secret reference: $token_state"
            echo "- Existing Workers: $(jq -r '[.workers[].name] | if length == 0 then "NONE_DISCOVERED" else join(", ") end' "$DISCOVERY_OUTPUT")"
            echo "- Workers plan: $plan_status ($plan_evidence)"
            echo "- Pages listing status (not required for Workers deployment): $(jq -r '[.calls[] | select(.label == "pages.projects.list") | .status] | first // "NOT_READ"' "$DISCOVERY_OUTPUT")"
            echo "- Suitable isolated Public Worker: $(jq -r '.suitableIsolatedPublicWorker // "NONE_PROVEN"' "$DISCOVERY_OUTPUT")"
            echo "- Workers Free confirmed: $(jq -r '.workersPlan.freeConfirmed' "$DISCOVERY_OUTPUT")"
            echo '- Mutating API methods and Wrangler publication: not invoked.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized read-only discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-readonly-discovery-${{ needs.repo-code-gate.outputs.source_sha }}
          path: ${{ runner.temp }}/cloudflare-readonly-discovery.json
          if-no-files-found: error
          retention-days: 30

  preview-public-admin:
    name: Reusable exact-SHA Public and Admin Preview publisher
    needs: [repo-code-gate, required-ci, app-preview-artifact, cloudflare-readonly-discovery]
    if: needs.repo-code-gate.outputs.owner_approved_upload == 'true' && needs.repo-code-gate.outputs.preview_required == 'true' && needs.required-ci.result == 'success' && needs.app-preview-artifact.result == 'success' && needs.cloudflare-readonly-discovery.outputs.result == 'READ_COMPLETE' && needs.cloudflare-readonly-discovery.outputs.workers_plan_status == 'FREE'
    uses: ./.github/workflows/preview-public-admin.yml
    with:
      source_sha: ${{ needs.repo-code-gate.outputs.source_sha }}
      pull_request_number: ${{ needs.repo-code-gate.outputs.pull_request_number }}
      workers_plan_status: ${{ needs.cloudflare-readonly-discovery.outputs.workers_plan_status }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_LEO563_PREVIEW_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}

  cloudflare-preview-gate:
    name: Preview deployment result
    needs: [repo-code-gate, required-ci, app-preview-artifact, cloudflare-readonly-discovery, preview-public-admin]
    if: always()
    outputs:
      result: ${{ steps.gate.outputs.result }}
    runs-on: ubuntu-latest
    steps:
      - name: Report CI and Preview as separate results
        id: gate
        env:
          REPO_GATE_RESULT: ${{ needs.repo-code-gate.result }}
          CI_RESULT: ${{ needs.required-ci.result }}
          CI_REQUIRED: ${{ needs.repo-code-gate.outputs.ci_required }}
          PREVIEW_REQUIRED: ${{ needs.repo-code-gate.outputs.preview_required }}
          ARTIFACT_RESULT: ${{ needs.app-preview-artifact.result }}
          ARTIFACT_READY: ${{ needs.app-preview-artifact.outputs.artifact_ready }}
          DISCOVERY_RESULT: ${{ needs.cloudflare-readonly-discovery.outputs.result }}
          WORKERS_PLAN_STATUS: ${{ needs.cloudflare-readonly-discovery.outputs.workers_plan_status }}
          OWNER_APPROVED_UPLOAD: ${{ needs.repo-code-gate.outputs.owner_approved_upload }}
          UPLOAD_JOB_RESULT: ${{ needs.preview-public-admin.result }}
          UPLOAD_RESULT: ${{ needs.preview-public-admin.outputs.public_result }}
          ADMIN_JOB_RESULT: ${{ needs.preview-public-admin.result }}
          ADMIN_RESULT: ${{ needs.preview-public-admin.outputs.admin_result }}
          PR_NUMBER: ${{ needs.repo-code-gate.outputs.pull_request_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPO_GATE_RESULT" != "success" ]] ||
             [[ "$CI_REQUIRED" == 'true' && "$CI_RESULT" != "success" ]] ||
             [[ "$CI_REQUIRED" != 'true' && "$CI_RESULT" != "skipped" ]]; then
            echo 'result=BLOCKED_BY_CI_FAILURE' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PREVIEW_REQUIRED" != "true" ]]; then
            echo 'result=SKIPPED_UNRELATED_CHANGE' >> "$GITHUB_OUTPUT"
            echo '### Cloudflare Preview: SKIPPED_UNRELATED_CHANGE' >> "$GITHUB_STEP_SUMMARY"
            echo 'The exact repository predicate found no material Public/Admin artifact change; no Preview candidate or external call was attempted.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$ARTIFACT_RESULT" == "failure" || "$ARTIFACT_READY" != "true" ]]; then
            echo 'result=BLOCKED_BY_ARTIFACT_FAILURE' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OWNER_APPROVED_UPLOAD" == "true" ]]; then
            if [[ "$WORKERS_PLAN_STATUS" != 'FREE' ]]; then
              echo 'result=BLOCKED_BY_WORKERS_COST_OR_QUOTA' >> "$GITHUB_OUTPUT"
              {
                echo '### Preview deployment: BLOCKED_BY_WORKERS_COST_OR_QUOTA'
                echo "- Cloudflare Workers plan status: $WORKERS_PLAN_STATUS"
                echo '- No Worker version, deployment, route, domain, DNS, or paid-plan mutation was attempted.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$DISCOVERY_RESULT" != "READ_COMPLETE" ]]; then
              echo 'result=BLOCKED_BY_DISCOVERY_FAILURE' >> "$GITHUB_OUTPUT"
              echo "### Preview deployment: BLOCKED_BY_DISCOVERY_FAILURE ($DISCOVERY_RESULT)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$UPLOAD_JOB_RESULT" != "success" || "$UPLOAD_RESULT" != "REAL_PUBLIC_PREVIEW_PASS" || "$ADMIN_JOB_RESULT" != "success" || "$ADMIN_RESULT" != "REAL_ADMIN_PREVIEW_PASS" ]]; then
              echo 'result=BLOCKED_BY_PUBLIC_ADMIN_PREVIEW_FAILURE' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'result=PREVIEW_DEPLOYED' >> "$GITHUB_OUTPUT"
            {
              echo '### Public and Admin Preview: PREVIEW_DEPLOYED'
              echo "- Public exact-SHA Worker Preview: ${{ needs.preview-public-admin.outputs.public_preview_url }}"
              echo "- Admin exact-SHA Worker Preview: ${{ needs.preview-public-admin.outputs.admin_preview_url }}"
              echo '- No Production deployment, custom domain, route, DNS, traffic, or paid-plan mutation was performed.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$DISCOVERY_RESULT" != "READ_COMPLETE" && "$DISCOVERY_RESULT" != "READ_PERMISSION_INCOMPLETE" && "$DISCOVERY_RESULT" != "CREDENTIALS_UNAVAILABLE" ]]; then
            echo 'result=BLOCKED_BY_DISCOVERY_FAILURE' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'result=CI_PASS_PREVIEW_NOT_DEPLOYED' >> "$GITHUB_OUTPUT"
          {
            echo '### CI_PASS_PREVIEW_NOT_DEPLOYED'
            echo "- Read-only Cloudflare discovery: $DISCOVERY_RESULT; Workers cost state: $WORKERS_PLAN_STATUS."
            echo '- Exact-SHA label preview-approved by the repository Owner is required to start Preview publication.'
            echo '- Green CI and candidate artifacts do not mean a live Preview exists.'
          } >> "$GITHUB_STEP_SUMMARY"

  preview-gate:
    name: Preview status (CI is separate)
    needs: [repo-code-gate, required-ci, app-preview-artifact, cloudflare-preview-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce CI and record the final Preview result
        env:
          REPO_GATE_RESULT: ${{ needs.repo-code-gate.result }}
          CI_RESULT: ${{ needs.required-ci.result }}
          CI_REQUIRED: ${{ needs.repo-code-gate.outputs.ci_required }}
          PREVIEW_REQUIRED: ${{ needs.repo-code-gate.outputs.preview_required }}
          ARTIFACT_RESULT: ${{ needs.app-preview-artifact.result }}
          ARTIFACT_READY: ${{ needs.app-preview-artifact.outputs.artifact_ready }}
          CLOUDFLARE_RESULT: ${{ needs.cloudflare-preview-gate.outputs.result }}
          OWNER_APPROVED_UPLOAD: ${{ needs.repo-code-gate.outputs.owner_approved_upload }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPO_GATE_RESULT" != "success" ]] ||
             [[ "$CI_REQUIRED" == 'true' && "$CI_RESULT" != "success" ]] ||
             [[ "$CI_REQUIRED" != 'true' && "$CI_RESULT" != "skipped" ]]; then
            echo 'Repository CI or exact repo-code gate failed; the Preview path is blocked.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$PREVIEW_REQUIRED" != "true" ]]; then
            {
              echo '### Final Preview result: SKIPPED_UNRELATED_CHANGE'
              echo '- Non-artifact changes cannot reach the application candidate or Cloudflare publication path.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$ARTIFACT_RESULT" == "failure" || "$ARTIFACT_READY" != "true" ]]; then
            echo 'Application candidate build or identity verification failed closed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$OWNER_APPROVED_UPLOAD" == "true" ]]; then
            if [[ "$CLOUDFLARE_RESULT" != "PREVIEW_DEPLOYED" ]]; then
              echo "Owner-labeled exact-SHA Preview did not deploy: $CLOUDFLARE_RESULT." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            {
              echo '### Final Preview result: PREVIEW_DEPLOYED'
              echo '- Public live proof: PASS'
              echo '- Admin live proof: PASS'
              echo '- Exact source SHA and noindex proof are attached to this workflow run.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$CLOUDFLARE_RESULT" != "CI_PASS_PREVIEW_NOT_DEPLOYED" ]]; then
            echo "Unexpected Preview publication state before Owner label: $CLOUDFLARE_RESULT." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo '### Final Preview result: CI_PASS_PREVIEW_NOT_DEPLOYED'
            echo '- Public/Admin candidate artifacts were built and verified in CI only.'
            echo '- No Cloudflare deployment occurred in this run.'
          } >> "$GITHUB_STEP_SUMMARY"
