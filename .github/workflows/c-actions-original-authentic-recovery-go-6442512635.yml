name: C original authentic recovery verification GO 6442512635 (one-time)

on:
  workflow_dispatch:
    inputs:
      approved_control_sha:
        description: Exact main SHA approved for this single isolated recovery verification
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: c-authentic-recovery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'tranhuunguyenhuy-hue/dongphugia.com.vn' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'tranhuunguyenhuy-hue' &&
      github.run_number == 1 &&
      github.run_attempt == 1 &&
      inputs.approved_control_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: runtime-backup
    env:
      POSTGRES_IMAGE: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
      BACKUP_DIR: /tmp/c-original-authentic-backup
      OUTPUT_DIR: /dev/shm/c-original-authentic-evidence
      EXPECTED_PR_NUMBER: '156'
      EXPECTED_CANDIDATE_SHA: d300eb696a94acfa557fbaf7a8c0e66876dafb63
      EXPECTED_CONTROL_SHA: ce64e8cc7caf91b8bf2e4e2315d49e21bacdfffc
      EXPECTED_MERGE_SHA: 59d9ea02dbceb5a3b83d00f929a8ee3a8f70cc35
      EXPECTED_WORKFLOW_RUN_ID: '38915575745'
      EXPECTED_AGE_RECIPIENT: age12zqtv9r2fc4v2j0kk6v79xrvy66gxcht2uqfxvqske4lzh83uq2qtqhfmc

    steps:
      - name: Check out the exact approved control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require the single exact-main source and runner capacity
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.approved_control_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = tranhuunguyenhuy-hue
          test "$GITHUB_RUN_NUMBER" = 1
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$(findmnt -no FSTYPE -T /dev/shm)" = tmpfs
          tmpfs_available="$(df -B1 --output=avail /dev/shm | tail -1 | xargs)"
          disk_available="$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1 | xargs)"
          memory_available_kib="$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)"
          [[ "$tmpfs_available" =~ ^[0-9]+$ && "$disk_available" =~ ^[0-9]+$ &&
             "$memory_available_kib" =~ ^[0-9]+$ ]]
          if (( tmpfs_available < 6442450944 || disk_available < 4294967296 ||
                memory_available_kib < 6291456 )); then
            echo 'C_ORIGINAL_RECOVERY status=STOP stage=runner_capacity'
            exit 1
          fi
          echo 'C_ORIGINAL_RECOVERY status=PASS stage=source_and_capacity'

      - name: Disable runner host swap before protected input
        shell: bash
        run: bash scripts/backup/c-actions-host-swap-preflight.sh

      - name: Install pinned tooling and image before protected input
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0

      - name: Prepare pinned age tools and isolated container smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/c-original-authentic-tools"
          curl --fail --location --silent --show-error --max-time 120 \
            --output "$RUNNER_TEMP/c-original-authentic-tools/age.tar.gz" \
            'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz'
          printf '%s  %s\n' \
            'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10' \
            "$RUNNER_TEMP/c-original-authentic-tools/age.tar.gz" | sha256sum --check --status
          tar -xOzf "$RUNNER_TEMP/c-original-authentic-tools/age.tar.gz" age/age > "$RUNNER_TEMP/c-original-authentic-tools/age"
          tar -xOzf "$RUNNER_TEMP/c-original-authentic-tools/age.tar.gz" age/age-keygen > "$RUNNER_TEMP/c-original-authentic-tools/age-keygen"
          chmod 0500 "$RUNNER_TEMP/c-original-authentic-tools/age" "$RUNNER_TEMP/c-original-authentic-tools/age-keygen"
          printf '%s  %s\n' \
            'eb7dd1b518f0a307c99cd97782623c5321da049154b04acd2d98d21aa7bc9b2c' \
            "$RUNNER_TEMP/c-original-authentic-tools/age" | sha256sum --check --status
          echo "$RUNNER_TEMP/c-original-authentic-tools" >> "$GITHUB_PATH"
          docker pull "$POSTGRES_IMAGE" >/dev/null 2>&1
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$POSTGRES_IMAGE")" = linux/amd64
          RECIPIENT_DIAGNOSTIC_IMAGE="$POSTGRES_IMAGE" bash scripts/backup/c-actions-container-swap-smoke.sh

      - name: Retrieve and verify the exact original encrypted artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/backup/c_actions_original_source.py
          node scripts/backup/manifest-contract.mjs validate "$BACKUP_DIR/leo540-38915575745.manifest.json" >/dev/null
          node scripts/backup/catalogue-restore-contract.mjs validate-source \
            "$BACKUP_DIR/leo540-38915575745.manifest.json" \
            "$EXPECTED_PR_NUMBER" "$EXPECTED_CANDIDATE_SHA" "$EXPECTED_CONTROL_SHA" \
            "$EXPECTED_WORKFLOW_RUN_ID" "$EXPECTED_MERGE_SHA" >/dev/null
          (cd "$BACKUP_DIR" && sha256sum -c leo540-38915575745.checksums.sha256 >/dev/null)
          echo 'C_ORIGINAL_RECOVERY status=PASS stage=artifact_identity'

      - name: Preflight the exact isolated recovery container before key access
        shell: bash
        run: |
          set -euo pipefail
          env -i \
            PATH="$PATH" \
            HOME="$RUNNER_TEMP" \
            GITHUB_ACTIONS=true \
            GITHUB_EVENT_NAME=workflow_dispatch \
            GITHUB_REF=refs/heads/main \
            MODE=container-preflight \
            HOSTED_RECOVERY=true \
            RUNNER_TEMP="$RUNNER_TEMP" \
            POSTGRES_IMAGE="$POSTGRES_IMAGE" \
            BACKUP_DIR="$BACKUP_DIR" \
            OUTPUT_DIR="$OUTPUT_DIR" \
            EXPECTED_PR_NUMBER="$EXPECTED_PR_NUMBER" \
            EXPECTED_CANDIDATE_SHA="$EXPECTED_CANDIDATE_SHA" \
            EXPECTED_CONTROL_SHA="$EXPECTED_CONTROL_SHA" \
            EXPECTED_MERGE_SHA="$EXPECTED_MERGE_SHA" \
            EXPECTED_WORKFLOW_RUN_ID="$EXPECTED_WORKFLOW_RUN_ID" \
            EXPECTED_AGE_RECIPIENT="$EXPECTED_AGE_RECIPIENT" \
            /bin/bash scripts/backup/c-actions-isolated-rehearsal.sh

      - name: Verify and restore only in the isolated non-root container
        shell: bash
        env:
          BACKUP_AGE_PRIVATE_KEY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          ulimit -c 0
          identity="$BACKUP_AGE_PRIVATE_KEY"
          unset BACKUP_AGE_PRIVATE_KEY
          trap 'unset identity BACKUP_AGE_PRIVATE_KEY' EXIT
          test -n "$identity"
          printf '%s' "$identity" |
            env -i \
              PATH="$PATH" \
              HOME="$RUNNER_TEMP" \
              GITHUB_ACTIONS=true \
              GITHUB_EVENT_NAME=workflow_dispatch \
              GITHUB_REF=refs/heads/main \
              MODE=rehearsal \
              HOSTED_RECOVERY=true \
              RUNNER_TEMP="$RUNNER_TEMP" \
              POSTGRES_IMAGE="$POSTGRES_IMAGE" \
              BACKUP_DIR="$BACKUP_DIR" \
              OUTPUT_DIR="$OUTPUT_DIR" \
              EXPECTED_PR_NUMBER="$EXPECTED_PR_NUMBER" \
              EXPECTED_CANDIDATE_SHA="$EXPECTED_CANDIDATE_SHA" \
              EXPECTED_CONTROL_SHA="$EXPECTED_CONTROL_SHA" \
              EXPECTED_MERGE_SHA="$EXPECTED_MERGE_SHA" \
              EXPECTED_WORKFLOW_RUN_ID="$EXPECTED_WORKFLOW_RUN_ID" \
              EXPECTED_AGE_RECIPIENT="$EXPECTED_AGE_RECIPIENT" \
              /bin/bash scripts/backup/c-actions-isolated-rehearsal.sh
          unset identity

      - name: Remove temporary encrypted source and public tools
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo -n rm -rf -- "$BACKUP_DIR" "$OUTPUT_DIR" "$RUNNER_TEMP/c-original-authentic-tools"
          sudo -n rm -f -- "$(dirname -- "$BACKUP_DIR")/c-actions-source.zip" \
            "$(dirname -- "$BACKUP_DIR")/c-actions-source.manifest.json"
