AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated Dong Phu Gia isolated Staging EC2 foundation for LEO-527. No SSH or Production application/database access; clone reads are conditional and exact-object scoped.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing project VPC verified during LEO-527 preflight. This stack adds only dedicated Staging network resources.
  VpcDnsResolverCidr:
    Type: String
    Default: 10.42.0.2/32
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
    Description: Verified VPC DNS resolver address; no other private DNS egress is allowed.
  InternetGatewayId:
    Type: String
    AllowedPattern: '^igw-[0-9a-f]+$'
    Description: Existing VPC internet gateway verified during LEO-527 preflight.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-southeast-1a
    Description: Dedicated Staging availability zone. Keep the EC2 and data volume in the same AZ.
  StagingSubnetCidr:
    Type: String
    Default: 10.42.20.0/24
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
    Description: New subnet CIDR must be unused inside the verified project VPC.
  NatGatewaySubnetCidr:
    Type: String
    Default: 10.42.21.0/24
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
    Description: New public subnet CIDR for the single-AZ NAT Gateway; it must be unused inside the verified project VPC.
  InstanceType:
    Type: String
    Default: t4g.medium
    AllowedValues:
      - t4g.medium
      - t4g.small
    Description: ARM64 instance sized for isolated Staging PostgreSQL plus the application without co-hosted Production services.
  RootVolumeSizeGiB:
    Type: Number
    Default: 50
    MinValue: 30
    MaxValue: 200
    Description: Encrypted root EBS size for the Docker runtime and immutable image cache.
  DataVolumeSizeGiB:
    Type: Number
    Default: 80
    MinValue: 40
    MaxValue: 500
    Description: Encrypted dedicated EBS size for the label-owned isolated Staging Docker volume.
  LatestAmiArm64:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 ARM64 AMI from the public SSM parameter store.
  AlarmNotificationTopicArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]{1,256}$'
    Description: Optional existing SNS topic for non-secret alarm notifications. Leave blank for no actions.
  CloneBackupObjectArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:s3:::dongphugia-prod-db-backup-[0-9]{12}-[a-z0-9-]+/daily/target/[0-9]{4}/[0-9]{2}/[0-9]{2}/[A-Za-z0-9._/-]+\.dump$'
    Description: Optional exact approved daily Production-derived backup object. Set only for the bounded clone, then remove it.
  CloneBackupChecksumObjectArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:s3:::dongphugia-prod-db-backup-[0-9]{12}-[a-z0-9-]+/daily/target/[0-9]{4}/[0-9]{2}/[0-9]{2}/[A-Za-z0-9._/-]+\.dump\.sha256$'
    Description: Optional checksum sidecar for the exact approved clone object. Set with CloneBackupObjectArn, then remove both.

Conditions:
  HasAlarmNotificationTopic: !Not [!Equals [!Ref AlarmNotificationTopicArn, '']]
  HasCloneBackupObjects: !And
    - !Not [!Equals [!Ref CloneBackupObjectArn, '']]
    - !Not [!Equals [!Ref CloneBackupChecksumObjectArn, '']]

Resources:
  StagingSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref StagingSubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-subnet'
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-only
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  NatGatewaySubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref NatGatewaySubnetCidr
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-subnet'
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-egress
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  NatGatewayRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-route-table'
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-egress
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  NatGatewayRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref NatGatewaySubnet
      RouteTableId: !Ref NatGatewayRouteTable

  NatGatewayDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: NatGateway
    Properties:
      RouteTableId: !Ref NatGatewayRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayId

  NatGatewayEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-eip'
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-egress
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: NatGatewayRouteTableAssociation
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref NatGatewaySubnet
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat'
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-egress
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  StagingRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-route-table'
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-only
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  StagingDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - StagingRouteTable
      - NatGateway
    Properties:
      RouteTableId: !Ref StagingRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  StagingSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref StagingSubnet
      RouteTableId: !Ref StagingRouteTable

  StagingSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Dedicated isolated Staging with no inbound ingress; browser smoke uses the SSM local port-forward.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: DNS to the verified VPC resolver
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcDnsResolverCidr
        - Description: DNS TCP fallback to the verified VPC resolver
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcDnsResolverCidr
        - Description: HTTPS for SSM, OS packages, GHCR and approved read-only source path
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTP package mirror fallback only
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-security-group'
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-only
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  StagingInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-only
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  StagingObservationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-observation'
      Roles:
        - !Ref StagingInstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublishStagingMetricsOnly
            Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: DongPhuGia/Staging

  StagingInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref StagingInstanceRole
      Tags:
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-only
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  StagingCloneReadPolicy:
    Type: AWS::IAM::Policy
    Condition: HasCloneBackupObjects
    Properties:
      PolicyName: !Sub '${AWS::StackName}-clone-read-once'
      Roles:
        - !Ref StagingInstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadExactApprovedCloneObject
            Effect: Allow
            Action:
              - s3:GetObject
            Resource:
              - !Ref CloneBackupObjectArn
              - !Ref CloneBackupChecksumObjectArn

  StagingDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Encrypted: true
      VolumeType: gp3
      Size: !Ref DataVolumeSizeGiB
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-data'
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-only
        - Key: Purpose
          Value: dpg-isolated-staging-volume
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  StagingLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-launch-template'
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Project
              Value: dongphugia
            - Key: Environment
              Value: staging
            - Key: Role
              Value: isolated-staging-only
            - Key: Owner
              Value: dongphugia
            - Key: ManagedBy
              Value: cloudformation
            - Key: SourceOfTruth
              Value: LEO-527
      LaunchTemplateData:
        ImageId: !Ref LatestAmiArm64
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt StagingInstanceProfile.Arn
        CreditSpecification:
          CpuCredits: standard
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2
          InstanceMetadataTags: enabled
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: false
            DeleteOnTermination: true
            Groups:
              - !Ref StagingSecurityGroup
            SubnetId: !Ref StagingSubnet
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: !Ref RootVolumeSizeGiB
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -Eeuo pipefail
            exec > >(tee -a /var/log/dongphugia-staging-bootstrap.log | logger -t dongphugia-staging-bootstrap -s 2>/dev/console) 2>&1

            install_attempt=0
            until dnf install -y docker amazon-cloudwatch-agent xfsprogs; do
              install_attempt=$((install_attempt + 1))
              if [ "$install_attempt" -ge 12 ]; then
                exit 1
              fi
              sleep 10
            done
            install -d -m 0755 /etc/docker
            cat >/etc/docker/daemon.json <<'EOF'
            {
              "data-root": "/var/lib/dongphugia-staging/docker",
              "log-driver": "json-file",
              "log-opts": {
                "max-size": "50m",
                "max-file": "5"
              }
            }
            EOF
            systemctl enable --now amazon-ssm-agent
            data_volume_id='${StagingDataVolume}'
            data_device=''
            for attempt in $(seq 1 60); do
              for device in /dev/nvme*n1; do
                [ -e "$device" ] || continue
                serial="$(udevadm info --query=property --name="$device" 2>/dev/null | awk -F= '/^ID_SERIAL_SHORT=/{print $2}')"
                if [ "$serial" = "$data_volume_id" ] || [ "$serial" = "${!data_volume_id#vol-}" ]; then
                  data_device="$device"
                  break
                fi
              done
              [ -n "$data_device" ] && break
              sleep 2
            done
            test -n "$data_device"
            if ! blkid "$data_device" >/dev/null 2>&1; then
              mkfs.xfs -L dpg-isolated-staging "$data_device"
            fi
            data_uuid="$(blkid -s UUID -o value "$data_device")"
            install -d -m 0750 /var/lib/dongphugia-staging
            grep -q "UUID=$data_uuid /var/lib/dongphugia-staging" /etc/fstab || \
              echo "UUID=$data_uuid /var/lib/dongphugia-staging xfs defaults,nofail 0 2" >>/etc/fstab
            mountpoint -q /var/lib/dongphugia-staging || mount /var/lib/dongphugia-staging
            install -d -m 0750 /var/lib/dongphugia-staging/docker
            systemctl enable --now docker

            install -d -m 0755 /opt/aws/amazon-cloudwatch-agent/etc
            cat >/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'EOF'
            {
              "agent": {
                "metrics_collection_interval": 60,
                "run_as_user": "root"
              },
              "metrics": {
                "namespace": "DongPhuGia/Staging",
                "append_dimensions": {
                  "InstanceId": "${!aws:InstanceId}"
                },
                "metrics_collected": {
                  "mem": {
                    "measurement": ["mem_used_percent"],
                    "metrics_collection_interval": 60
                  },
                  "disk": {
                    "measurement": ["used_percent", "inodes_free"],
                    "resources": ["/", "/var/lib/dongphugia-staging"],
                    "metrics_collection_interval": 60
                  }
                }
              }
            }
            EOF
            /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
              -a fetch-config -m ec2 \
              -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

            install -d -m 0750 /opt/dongphugia
            cat >/etc/dongphugia-staging-contract <<'EOF'
            project=dongphugia
            environment=staging
            topology=dedicated-ec2
            role=isolated-staging-only
            source_of_truth=LEO-527
            production_access=prohibited
            postgres_public_ingress=prohibited
            scheduler=disabled
            external_side_effects=disabled
            EOF

  StagingInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - NatGatewayDefaultRoute
      - StagingDefaultRoute
      - StagingSubnetRouteTableAssociation
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref StagingLaunchTemplate
        Version: !GetAtt StagingLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2'
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-only
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  StagingDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    DependsOn: StagingInstance
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref StagingInstance
      VolumeId: !Ref StagingDataVolume

  StatusCheckFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Dedicated isolated Staging EC2 status check failed.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref StagingInstance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmNotificationTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-only
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

  CpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Dedicated isolated Staging EC2 CPU is high for a sustained period.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref StagingInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 75
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue
      OKActions: !If
        - HasAlarmNotificationTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: dongphugia
        - Key: Environment
          Value: staging
        - Key: Role
          Value: isolated-staging-only
        - Key: Owner
          Value: dongphugia
        - Key: ManagedBy
          Value: cloudformation
        - Key: SourceOfTruth
          Value: LEO-527

Outputs:
  StackContract:
    Description: Dedicated Staging ownership contract.
    Value: dongphugia-leo-527-dedicated-staging-v1
  InstanceId:
    Description: Dedicated Staging EC2 instance; use only for sanitized operator evidence.
    Value: !Ref StagingInstance
  VpcId:
    Description: Verified project VPC containing the dedicated Staging subnet.
    Value: !Ref VpcId
  SubnetId:
    Description: Dedicated Staging subnet.
    Value: !Ref StagingSubnet
  NatGatewayId:
    Description: Single-AZ NAT Gateway providing private Staging outbound connectivity.
    Value: !Ref NatGateway
  SecurityGroupId:
    Description: Dedicated Staging-only security group with no PostgreSQL ingress.
    Value: !Ref StagingSecurityGroup
  DataVolumeId:
    Description: Encrypted dedicated Staging data volume.
    Value: !Ref StagingDataVolume
  ManagementPath:
    Description: Required management path.
    Value: SSM-Session-Manager-and-RunCommand
