name: PR Preview publish
on:
  workflow_run:
    workflows: [PR Preview build]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: pr-preview-publish-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pr-preview
    steps:
      - name: Verify source run and current PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/pr-preview-build.yml') throw new Error('Unexpected producer');
            let prs = run.pull_requests;
            if (!prs.length) {
              prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit,
                {...context.repo, commit_sha: run.head_sha});
              prs = prs.filter(p => p.state === 'open' && p.head.sha === run.head_sha);
            }
            if (prs.length !== 1) throw new Error('Expected one current PR');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: prs[0].number});
            if (pr.state !== 'open' || pr.head.sha !== run.head_sha) {
              core.setOutput('current', 'false'); return;
            }
            core.setOutput('current', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('sha', pr.head.sha);
      - uses: actions/checkout@v4
        if: steps.pr.outputs.current == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted
      - uses: actions/download-artifact@v4
        if: steps.pr.outputs.current == 'true'
        with:
          name: public-preview
          path: candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.current == 'true'
        with:
          node-version: '24'
      - name: Install deployment tool outside candidate
        if: steps.pr.outputs.current == 'true'
        run: npm install --prefix "$RUNNER_TEMP/deploy-tool" --ignore-scripts --no-audit --no-fund wrangler@4.127.1
      - name: Prepare isolated configuration
        if: steps.pr.outputs.current == 'true'
        id: config
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SUBDOMAIN: ${{ vars.PREVIEW_WORKERS_SUBDOMAIN }}
        run: python3 trusted/scripts/app-foundation/prepare-pr-preview.py candidate "$PR_NUMBER" "$SUBDOMAIN" "$RUNNER_TEMP/preview.json"
      - name: Publish to dedicated Preview account
        if: steps.pr.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        working-directory: ${{ runner.temp }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          node "$RUNNER_TEMP/deploy-tool/node_modules/wrangler/bin/wrangler.js" deploy --config "$RUNNER_TEMP/preview.json"
      - name: Smoke deployed identity and noindex
        if: steps.pr.outputs.current == 'true'
        env:
          PREVIEW_URL: ${{ steps.config.outputs.url }}
          SOURCE_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 -D "$RUNNER_TEMP/headers" "$PREVIEW_URL/" -o /dev/null
          tr -d '\r' < "$RUNNER_TEMP/headers" > "$RUNNER_TEMP/headers-clean"
          grep -iFx "x-dpg-source-sha: $SOURCE_SHA" "$RUNNER_TEMP/headers-clean"
          grep -iE '^x-robots-tag:.*noindex' "$RUNNER_TEMP/headers-clean"
      - name: Report Preview
        if: steps.pr.outputs.current == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SOURCE_SHA: ${{ steps.pr.outputs.sha }}
          PREVIEW_URL: ${{ steps.config.outputs.url }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            if (pr.state !== 'open' || pr.head.sha !== process.env.SOURCE_SHA) throw new Error('PR changed during publication');
            const body = `<!-- dpg-pr-preview -->\nPublic Preview: ${process.env.PREVIEW_URL}\nSource: ${process.env.SOURCE_SHA}\nSmoke: identity and noindex PASS. Admin: build only; no hosted Auth/backend acceptance. Existing required CI still applies.`;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: number});
            const prior = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('<!-- dpg-pr-preview -->'));
            if (prior) await github.rest.issues.updateComment({...context.repo, comment_id: prior.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: number, body});
