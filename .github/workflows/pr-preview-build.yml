name: PR Preview build
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 -B -m unittest discover -s scripts/app-foundation -p test_prepare_pr_preview.py
      - run: npm ci
      - run: npm ci --prefix apps/public
      - name: Build Public without provider credentials
        run: npm run build:public-worker
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: public
          APP_ORIGIN: https://public-preview.invalid
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Build Admin without hosted credentials
        run: npm run build:admin
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: admin
          APP_ORIGIN: https://admin-preview.invalid
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_preview_runtime_test
      - uses: actions/upload-artifact@v4
        with:
          name: public-preview
          path: apps/public/dist/
          if-no-files-found: error
          retention-days: 7
