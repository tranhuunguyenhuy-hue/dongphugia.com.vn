log_format redirect_json escape=json
  '{"service":"dongphugia-apex-redirect",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"duration_ms":$request_time,'
  '"remote":"$remote_addr"}';

error_log /dev/stderr warn;
server_tokens off;

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  access_log /dev/stdout redirect_json;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  location / {
    return 308 https://www.dongphugia.vn$request_uri;
  }
}
