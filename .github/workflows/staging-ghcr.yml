name: Build staging container

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag suffix. Defaults to the commit SHA.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dongphugia-web

jobs:
  build:
    name: Build and push linux/arm64 image
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ inputs.image_tag }}"
          if [ -z "$suffix" ]; then
            suffix="${GITHUB_SHA}"
          fi
          echo "tag=staging-${suffix}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Validate staging configuration
        shell: bash
        env:
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL }}
          STAGING_NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          STAGING_BUNNY_CDN_HOSTNAME: ${{ vars.STAGING_BUNNY_CDN_HOSTNAME }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$STAGING_SITE_URL" ] || missing+=("STAGING_SITE_URL")
          [ -n "$STAGING_NEXT_PUBLIC_SUPABASE_URL" ] || missing+=("STAGING_NEXT_PUBLIC_SUPABASE_URL")
          [ -n "$STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY" ] || missing+=("STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY")
          [ -n "$STAGING_BUNNY_CDN_HOSTNAME" ] || missing+=("STAGING_BUNNY_CDN_HOSTNAME")
          [ -n "$STAGING_DATABASE_URL" ] || missing+=("STAGING_DATABASE_URL")
          [ -n "$STAGING_DIRECT_URL" ] || missing+=("STAGING_DIRECT_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required staging configuration keys:\n'
            printf -- '- %s\n' "${missing[@]}"
            exit 1
          fi

          case "$STAGING_SITE_URL" in
            *dongphugia.vn*|*dongphugia.com.vn*)
              echo "STAGING_SITE_URL must not use the production domain."
              exit 1
              ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:staging-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.STAGING_SITE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ vars.STAGING_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
            NEXT_PUBLIC_GTM_ID=${{ vars.STAGING_NEXT_PUBLIC_GTM_ID }}
            BUNNY_CDN_HOSTNAME=${{ vars.STAGING_BUNNY_CDN_HOSTNAME }}
          secrets: |
            DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
            DIRECT_URL=${{ secrets.STAGING_DIRECT_URL }}

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Staging image"
            echo
            echo "- Image: \`${IMAGE_NAME}:${{ steps.meta.outputs.tag }}\`"
            echo "- Rolling tag: \`${IMAGE_NAME}:staging-latest\`"
            echo "- Platform: \`linux/arm64\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
