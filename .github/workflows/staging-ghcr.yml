name: Verify staging production-candidate contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-production-candidate-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Verify source handoff contract without a staging image build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository tools
        run: npm ci

      - name: Verify immutable production-candidate staging contract
        run: >-
          npx vitest run
          scripts/quality/staging-workflow-contract.test.ts
          src/lib/write-freeze.test.ts
          src/lib/site.test.ts
          src/app/robots.txt/route.test.ts
