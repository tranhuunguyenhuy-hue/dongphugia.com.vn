name: Local Preview and Staging source CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: local-preview-source-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-code-gate:
    name: Gate application changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.detect.outputs.source_sha }}
      public_changed: ${{ steps.detect.outputs.public_changed }}
      admin_changed: ${{ steps.detect.outputs.admin_changed }}
      preview_required: ${{ steps.detect.outputs.preview_required }}
      integration_required: ${{ steps.detect.outputs.integration_required }}
      b11_required: ${{ steps.detect.outputs.b11_required }}
      ci_required: ${{ steps.detect.outputs.ci_required }}
    steps:
      - name: Checkout the complete candidate history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect material application changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          node scripts/app-foundation/preview-change-gate.mjs \
            --base "$BASE_SHA" \
            --head "$SOURCE_SHA" \
            --output "$GITHUB_OUTPUT"

  required-ci:
    name: Required repository CI
    needs: repo-code-gate
    if: needs.repo-code-gate.result == 'success' && needs.repo-code-gate.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:45cd22f8d32e189d245403954882f88e7a8714301fda80dab6da90f1265b25a3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: leo561-ci-local-only
          POSTGRES_DB: leo561_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leo561_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEPLOY_TARGET: local
      LEO561_SCHEMA_TEST_URL: postgresql://postgres:leo561-ci-local-only@127.0.0.1:5432/leo561_ci
    steps:
      - name: Checkout the exact PR-head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repo-code-gate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        if: needs.repo-code-gate.outputs.preview_required == 'true' || needs.repo-code-gate.outputs.integration_required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: needs.repo-code-gate.outputs.preview_required == 'true' || needs.repo-code-gate.outputs.integration_required == 'true'
        run: npm ci

      - name: Install the independently locked Public Worker toolchain
        if: needs.repo-code-gate.outputs.preview_required == 'true'
        run: npm ci --prefix apps/public

      # General lint/typecheck/unit tests belong exclusively to quality.yml.
      # A second test pass is justified only for data/auth/order/CI control changes:
      # this job supplies a disposable Postgres URL absent from the fast quality job.
      - name: Database, Auth and commerce integration tests
        if: needs.repo-code-gate.outputs.integration_required == 'true'
        run: npm test

      - name: Type-check Public independently
        if: needs.repo-code-gate.outputs.preview_required == 'true'
        run: npm run typecheck:public

      - name: Check official vinext compatibility
        if: needs.repo-code-gate.outputs.preview_required == 'true'
        working-directory: apps/public
        run: npm exec -- vinext check

      - name: Check Public Worker fail-closed contracts
        if: needs.repo-code-gate.outputs.preview_required == 'true'
        run: npm run app:public-worker:check

      - name: B11 public synthetic re-wrap contracts
        if: needs.repo-code-gate.outputs.b11_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/backup -p 'test_b11_rewrap_*.py' -v
          mkdir -p "$RUNNER_TEMP/b11-public-age"
          curl --fail --location --silent --show-error --max-time 120 \
            --output "$RUNNER_TEMP/b11-public-age/age.tar.gz" \
            'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz'
          printf '%s  %s\n' \
            'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10' \
            "$RUNNER_TEMP/b11-public-age/age.tar.gz" | sha256sum --check --status
          tar -xOzf "$RUNNER_TEMP/b11-public-age/age.tar.gz" age/age > "$RUNNER_TEMP/b11-public-age/age"
          tar -xOzf "$RUNNER_TEMP/b11-public-age/age.tar.gz" age/age-keygen > "$RUNNER_TEMP/b11-public-age/age-keygen"
          chmod 0555 "$RUNNER_TEMP/b11-public-age/age" "$RUNNER_TEMP/b11-public-age/age-keygen"
          printf '%s  %s\n' \
            'eb7dd1b518f0a307c99cd97782623c5321da049154b04acd2d98d21aa7bc9b2c' \
            "$RUNNER_TEMP/b11-public-age/age" | sha256sum --check --status
          docker pull 'python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704' >/dev/null
          docker run --rm --pull=never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 768m --cpus 1 \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --mount "type=bind,src=$RUNNER_TEMP/b11-public-age/age,dst=/opt/age,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/b11-public-age/age-keygen,dst=/opt/age-keygen,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/backup/b11_rewrap_core.py,dst=/opt/b11_rewrap_core.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/backup/test_b11_rewrap_linux.py,dst=/opt/test_b11_rewrap_linux.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/backup/fixtures/b11-stalled-age.sh,dst=/opt/b11-stalled-age.sh,readonly" \
            --env B11_TEST_AGE_BIN=/opt/age --env B11_TEST_AGE_KEYGEN_BIN=/opt/age-keygen \
            --env B11_TEST_STALLED_AGE_BIN=/opt/b11-stalled-age.sh \
            --env PYTHONDONTWRITEBYTECODE=1 \
            'python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704' \
            python3 -B /opt/test_b11_rewrap_linux.py

      - name: B11 public-only Docker file permission handoff
        if: needs.repo-code-gate.outputs.b11_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/b11-public-permission-probe"
          mkdir -p "$probe/output"
          printf 'B11_PUBLIC_PERMISSION_FIXTURE' > "$probe/input"
          chmod 0600 "$probe/input"
          chmod 0700 "$probe/output"
          sudo chown 65534:65534 "$probe/input" "$probe/output"
          docker run --rm --pull=never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 \
            --mount "type=bind,src=$probe/input,dst=/input/probe,readonly" \
            --mount "type=bind,src=$probe/output,dst=/output" \
            'python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704' \
            sh -c 'umask 077; cat /input/probe > /output/probe'
          sudo test -f "$probe/output/probe"
          sudo test ! -L "$probe/output/probe"
          sudo chown "$(id -u):$(id -g)" "$probe/output" "$probe/output/probe"
          test -r "$probe/output/probe"
          test "$(cat "$probe/output/probe")" = 'B11_PUBLIC_PERMISSION_FIXTURE'

      - name: Check the legacy static artifact contract without publishing it
        if: needs.repo-code-gate.outputs.preview_required == 'true'
        run: npm run static:check

  local-preview-gate:
    name: Local-only Preview gate
    needs: [repo-code-gate, required-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce application checks without external Preview publication
        env:
          REPO_GATE_RESULT: ${{ needs.repo-code-gate.result }}
          CI_RESULT: ${{ needs.required-ci.result }}
          CI_REQUIRED: ${{ needs.repo-code-gate.outputs.ci_required }}
          PREVIEW_REQUIRED: ${{ needs.repo-code-gate.outputs.preview_required }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPO_GATE_RESULT" != "success" ]]; then
            echo 'Exact source change gate failed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$CI_REQUIRED" == 'true' && "$CI_RESULT" != "success" ]] ||
             [[ "$CI_REQUIRED" != 'true' && "$CI_RESULT" != "skipped" ]]; then
            echo 'Required repository CI did not reach its expected result.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$PREVIEW_REQUIRED" == 'true' ]]; then
            {
              echo '### Local-only Preview: checks passed'
              echo '- Public and Admin source/build checks run without an external Preview resource, token, or publication path.'
              echo '- Same-origin Public root and Admin /admin routing and mutation-denial contracts are checked in CI; desktop/mobile browser acceptance is recorded on the PR.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Local-only Preview: SKIPPED_UNRELATED_CHANGE'
              echo '- Unrelated changes cannot reach an application Preview or cloud publication path.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
