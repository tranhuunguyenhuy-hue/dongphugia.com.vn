name: Offline filtered catalogue restore rehearsal

on:
  workflow_dispatch:
    inputs:
      approved_main_sha:
        description: Exact trusted main SHA containing this workflow and the filtered restore contract
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: offline-catalogue-rehearsal-${{ github.repository }}
  cancel-in-progress: false

env:
  POSTGRES_IMAGE: postgres:17.6-bookworm@sha256:45cd22f8d32e189d245403954882f88e7a8714301fda80dab6da90f1265b25a3
  BACKUP_RUN_ID: '38915575745'
  BACKUP_ARTIFACT_ID: '12052107648'
  BACKUP_ARTIFACT_NAME: leo540-runtime-backup-38915575745
  BACKUP_ARTIFACT_DIGEST: sha256:348431a2837ae5c3f473d80f5ca8807242e5bb1e164caf71f740a4bb76049e57
  BACKUP_CONTROL_SHA: ce64e8cc7caf91b8bf2e4e2315d49e21bacdfffc
  BACKUP_CANDIDATE_SHA: d300eb696a94acfa557fbaf7a8c0e66876dafb63
  BACKUP_MERGE_SHA: 59d9ea02dbceb5a3b83d00f929a8ee3a8f70cc35
  BACKUP_PR_NUMBER: '156'
  BACKUP_SIZE_BYTES: '9286999'
  BACKUP_EXPIRES_AT: '2026-10-30T14:27:48Z'
  BACKUP_DIR: /dev/shm/dpg-catalogue-rehearsal-${{ github.run_id }}
  EVIDENCE_DIR: /dev/shm/dpg-catalogue-rehearsal-${{ github.run_id }}/evidence

jobs:
  rehearsal:
    name: Rehearse exact filtered catalogue in offline PostgreSQL
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, dpg-offline-pg17]
    environment: runtime-backup
    timeout-minutes: 55
    steps:
      - name: Check out the exact trusted main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require main dispatch and exact approved revision
        env:
          APPROVED_MAIN_SHA: ${{ inputs.approved_main_sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$APPROVED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_MAIN_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_MAIN_SHA"

      - name: Verify root-owned isolated-runner egress attestation
        shell: bash
        run: |
          set -euo pipefail
          verifier=/usr/local/sbin/dpg-offline-runner-attest
          test -f "$verifier"
          test ! -L "$verifier"
          test "$(stat -c %U "$verifier")" = root
          test ! -w "$verifier"
          sudo -n "$verifier" --profile dongphugia-catalogue-rehearsal --require-supabase-egress-deny
          echo 'OFFLINE_RUNNER_ATTESTATION status=PASS profile=dongphugia-catalogue-rehearsal'

      - name: Verify real tmpfs and preloaded PostgreSQL 17.6 image
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt --noheadings --output FSTYPE --target /dev/shm | xargs)" = 'tmpfs'
          docker info >/dev/null
          docker image inspect "$POSTGRES_IMAGE" >/dev/null
          mkdir -m 700 "$BACKUP_DIR"
          test "$(stat -c %a "$BACKUP_DIR")" = 700
          echo 'OFFLINE_REHEARSAL_RUNTIME status=PASS tmpfs=verified postgres_image=preloaded-pinned'

      - name: Verify exact backup run and immutable artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID")"
          jq -e --argjson run "$BACKUP_RUN_ID" --arg sha "$BACKUP_CONTROL_SHA" '
            .id == $run and .conclusion == "success" and .head_sha == $sha
          ' <<<"$run_json" >/dev/null

          artifact_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$BACKUP_ARTIFACT_ID")"
          jq -e \
            --arg name "$BACKUP_ARTIFACT_NAME" \
            --arg digest "$BACKUP_ARTIFACT_DIGEST" \
            --arg control "$BACKUP_CONTROL_SHA" \
            --argjson id "$BACKUP_ARTIFACT_ID" \
            --argjson run "$BACKUP_RUN_ID" \
            --argjson size "$BACKUP_SIZE_BYTES" \
            --arg expires "$BACKUP_EXPIRES_AT" '
              .id == $id and .name == $name and .expired == false
              and .digest == $digest and .size_in_bytes == $size
              and .expires_at == $expires
              and .workflow_run.id == $run and .workflow_run.head_sha == $control
            ' <<<"$artifact_json" >/dev/null
          echo 'OFFLINE_REHEARSAL_ARTIFACT status=PASS provenance=exact digest=verified retention=valid'

      - name: Download exact artifact into tmpfs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BACKUP_RUN_ID" --name "$BACKUP_ARTIFACT_NAME" --dir "$BACKUP_DIR"
          shopt -s nullglob
          archives=("$BACKUP_DIR"/*.dump.age)
          manifests=("$BACKUP_DIR"/*.manifest.json)
          checksums=("$BACKUP_DIR"/*.checksums.sha256)
          shopt -u nullglob
          test "${#archives[@]}" = 1
          test "${#manifests[@]}" = 1
          test "${#checksums[@]}" = 1
          (cd "$BACKUP_DIR" && sha256sum -c "$(basename "${checksums[0]}")" >/dev/null)
          node scripts/backup/manifest-contract.mjs validate "${manifests[0]}" >/dev/null
          node scripts/backup/catalogue-restore-contract.mjs validate-source \
            "${manifests[0]}" "$BACKUP_PR_NUMBER" "$BACKUP_CANDIDATE_SHA" \
            "$BACKUP_CONTROL_SHA" "$BACKUP_RUN_ID" "$BACKUP_MERGE_SHA" >/dev/null
          echo 'OFFLINE_REHEARSAL_BUNDLE status=PASS checksum=verified manifest=valid source_identity=exact'

      - name: Rehearse the filtered restore with age identity scoped to this step
        env:
          MODE: rehearsal
          BACKUP_DIR: ${{ env.BACKUP_DIR }}
          OUTPUT_DIR: ${{ env.EVIDENCE_DIR }}
          EXPECTED_PR_NUMBER: ${{ env.BACKUP_PR_NUMBER }}
          EXPECTED_CANDIDATE_SHA: ${{ env.BACKUP_CANDIDATE_SHA }}
          EXPECTED_CONTROL_SHA: ${{ env.BACKUP_CONTROL_SHA }}
          EXPECTED_MERGE_SHA: ${{ env.BACKUP_MERGE_SHA }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ env.BACKUP_RUN_ID }}
          POSTGRES_IMAGE: ${{ env.POSTGRES_IMAGE }}
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY }}
        shell: bash
        run: bash scripts/backup/restore-catalogue-runtime.sh

      - name: Publish sanitized aggregate evidence only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          manifest="$EVIDENCE_DIR/catalogue-expected.json"
          metrics="$EVIDENCE_DIR/rehearsal-metrics.json"
          jq -e '.contract == "dongphugia:catalogue-filtered-restore:v1" and (.tables | length) == 27' \
            "$manifest" >/dev/null
          jq -e '(.databaseBytes | type == "number") and (.durationSeconds | type == "number")' \
            "$metrics" >/dev/null
          {
            echo '## Filtered catalogue rehearsal: PASS'
            echo "- Main SHA: $GITHUB_SHA"
            echo "- Source artifact ID: $BACKUP_ARTIFACT_ID"
            echo "- Source artifact package SHA-256: ${BACKUP_ARTIFACT_DIGEST#sha256:}"
            echo '- Filtered table count: 27'
            echo '- Excluded rows in filtered target: 0 (manifest comparison passed)'
            echo "- Approximate target database bytes: $(jq -r '.databaseBytes' "$metrics")"
            echo "- Restore duration seconds: $(jq -r '.durationSeconds' "$metrics")"
            echo ''
            echo '| Allowed table | Rows |'
            echo '| --- | ---: |'
            jq -r '.tables[] | [.tableName, (.rowCount | tostring)] | @tsv' "$manifest" \
              | awk -F '\t' '{ printf "| %s | %s |\n", $1, $2 }'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove artifact and evidence from tmpfs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "$BACKUP_DIR" in
            /dev/shm/dpg-catalogue-rehearsal-*) rm -rf -- "$BACKUP_DIR" ;;
            *) echo 'OFFLINE_REHEARSAL_CLEANUP status=FAIL reason=unexpected_tmpfs_path'; exit 1 ;;
          esac
          echo 'OFFLINE_REHEARSAL_CLEANUP status=PASS tmpfs_artifact_and_evidence_removed=true'
