name: Bounded rejected Preview runtime diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalogue-direct-migration
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && github.actor == 'tranhuunguyenhuy-hue' && github.repository == 'tranhuunguyenhuy-hue/dongphugia.com.vn' && github.run_attempt == 1
    environment: catalogue-direct-migration
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
      - name: Install existing pinned diagnostic tool before credentials
        run: npm ci --prefix apps/public
      - name: Verify existing zero-cost gate
        env:
          DIRECT_ZERO_COST_ATTESTATION: ${{ vars.DIRECT_ZERO_COST_ATTESTATION }}
        run: node --input-type=module -e 'import {assertBudget} from "./scripts/catalogue-direct/contract.mjs"; assertBudget(JSON.parse(process.env.DIRECT_ZERO_COST_ATTESTATION));'
      - name: Capture only sanitized own-IP exact-version exceptions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_BIN: ${{ github.workspace }}/apps/public/node_modules/wrangler/bin/wrangler.js
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/preview-runtime-diagnostic.json
        run: node scripts/catalogue-direct/preview-runtime-diagnostic.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rejected-preview-runtime-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-runtime-diagnostic.json
          retention-days: 1
          if-no-files-found: error
