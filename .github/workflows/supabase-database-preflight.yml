name: Verify read-only Supabase database connection

on:
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: Exact merged main SHA for the read-only diagnostic
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-backup-role-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'tranhuunguyenhuy-hue/dongphugia.com.vn' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'tranhuunguyenhuy-hue' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: runtime-backup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Verify owner and exact source before dependencies or secrets
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$TRIGGERING_ACTOR" = 'tranhuunguyenhuy-hue'
          [[ "$APPROVED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Diagnose exact target using a read-only transaction
        env:
          SUPABASE_REHOME_DATABASE_URL: ${{ secrets.SUPABASE_REHOME_DATABASE_URL }}
        run: node scripts/backup/supabase-database-preflight.mjs
