name: Build staging container

on:
  workflow_dispatch:
  push:
    branches:
      - codex/self-hosted-postgres-staging-changeset
    paths:
      - .github/workflows/staging-ghcr.yml
      - Dockerfile
      - package.json
      - package-lock.json
      - prisma/**
      - src/**
      - public/**
      - next.config.ts
      - tsconfig.json
      - postcss.config.mjs
      - components.json
      - docs/deploy/staging-db-bootstrap/**

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dongphugia-web
  POSTGRES_IMAGE: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
  BUILD_DATABASE_URL: postgresql://dpg_staging_build:dpg_staging_build_password@postgres:5432/dpg_staging_build
  DEFAULT_STAGING_SITE_URL: https://dongphugia-staging.47-131-92-97.sslip.io
  DEFAULT_BUNNY_CDN_HOSTNAME: cdn.dongphugia.com.vn

jobs:
  build:
    name: Build and push linux/arm64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    environment: staging

    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: dpg_staging_build
          POSTGRES_USER: dpg_staging_build
          POSTGRES_PASSWORD: dpg_staging_build_password
        options: >-
          --health-cmd "pg_isready -U dpg_staging_build -d dpg_staging_build"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate staging configuration
        shell: bash
        env:
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL || env.DEFAULT_STAGING_SITE_URL }}
          STAGING_BUNNY_CDN_HOSTNAME: ${{ vars.STAGING_BUNNY_CDN_HOSTNAME || env.DEFAULT_BUNNY_CDN_HOSTNAME }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$STAGING_SITE_URL" ] || missing+=("STAGING_SITE_URL")
          [ -n "$STAGING_BUNNY_CDN_HOSTNAME" ] || missing+=("STAGING_BUNNY_CDN_HOSTNAME")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required staging configuration keys:\n'
            printf -- '- %s\n' "${missing[@]}"
            exit 1
          fi

          case "$STAGING_SITE_URL" in
            *dongphugia.vn*|*dongphugia.com.vn*)
              echo "STAGING_SITE_URL must not use the production domain."
              exit 1
              ;;
          esac

      - name: Bootstrap ephemeral build database
        shell: bash
        env:
          BUILD_NETWORK: ${{ job.services.postgres.network }}
        run: |
          set -euo pipefail

          docker run --rm --network "$BUILD_NETWORK" \
            -e PGPASSWORD=dpg_staging_build_password \
            -v "$PWD/docs/deploy/staging-db-bootstrap:/bootstrap:ro" \
            "$POSTGRES_IMAGE" \
            psql \
              --set=ON_ERROR_STOP=1 \
              --single-transaction \
              -h postgres \
              -U dpg_staging_build \
              -d dpg_staging_build \
              --file=/bootstrap/001_schema_from_prisma.sql \
              --file=/bootstrap/002_seed_synthetic_stg_demo.sql

          tables="$(
            docker run --rm --network "$BUILD_NETWORK" \
              -e PGPASSWORD=dpg_staging_build_password \
              "$POSTGRES_IMAGE" \
              psql -h postgres -U dpg_staging_build -d dpg_staging_build -Atc \
                "select count(*) from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE';"
          )"
          products="$(
            docker run --rm --network "$BUILD_NETWORK" \
              -e PGPASSWORD=dpg_staging_build_password \
              "$POSTGRES_IMAGE" \
              psql -h postgres -U dpg_staging_build -d dpg_staging_build -Atc \
                "select count(*) from products where sku like 'STG-DEMO-%';"
          )"

          if [ "$tables" != "46" ] || [ "$products" != "3" ]; then
            echo "Ephemeral build database bootstrap validation failed."
            exit 1
          fi

      - name: Verify native ARM64 build environment
        shell: bash
        run: |
          set -euo pipefail
          runner_arch="$(uname -m)"
          docker_arch="$(docker info --format '{{.Architecture}}')"
          node_arch="$(node -p 'process.arch')"

          case "$runner_arch" in aarch64|arm64) ;; *) exit 1 ;; esac
          case "$docker_arch" in aarch64|arm64) ;; *) exit 1 ;; esac
          test "$node_arch" = "arm64"

          printf 'Runner architecture: %s\n' "$runner_arch"
          printf 'Docker architecture: %s\n' "$docker_arch"
          printf 'Node architecture: %s\n' "$node_arch"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=staging-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.STAGING_SITE_URL || env.DEFAULT_STAGING_SITE_URL }}
            NEXT_PUBLIC_GTM_ID=${{ vars.STAGING_NEXT_PUBLIC_GTM_ID }}
            BUNNY_CDN_HOSTNAME=${{ vars.STAGING_BUNNY_CDN_HOSTNAME || env.DEFAULT_BUNNY_CDN_HOSTNAME }}

      - name: Smoke test pushed image
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          BUILD_NETWORK: ${{ job.services.postgres.network }}
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL || env.DEFAULT_STAGING_SITE_URL }}
          STAGING_BUNNY_CDN_HOSTNAME: ${{ vars.STAGING_BUNNY_CDN_HOSTNAME || env.DEFAULT_BUNNY_CDN_HOSTNAME }}
        run: |
          set -euo pipefail

          docker run --rm --detach \
            --name dpg-staging-image-smoke \
            --platform linux/arm64 \
            --network "$BUILD_NETWORK" \
            -e DATABASE_URL="$BUILD_DATABASE_URL" \
            -e DIRECT_URL="$BUILD_DATABASE_URL" \
            -e NEXT_PUBLIC_SITE_URL="$STAGING_SITE_URL" \
            -e BUNNY_CDN_HOSTNAME="$STAGING_BUNNY_CDN_HOSTNAME" \
            "$IMAGE_REF"

          redact_file() {
            local source_file="$1"
            [ -s "$source_file" ] || return 0
            SOURCE_FILE="$source_file" node <<'NODE'
          const fs = require('fs')
          const source = process.env.SOURCE_FILE
          let output = fs.readFileSync(source, 'utf8')
          output = output
            .replace(/postgres(?:ql)?:\/\/[^\s"'`]+/gi, 'postgresql://[REDACTED]')
            .replace(/((?:password|passwd|token|secret|app_key)\s*[=:]\s*)[^\s,;]+/gi, '$1[REDACTED]')
            .replace(/dpg_staging_build_password/g, '[REDACTED]')
          process.stdout.write(output)
          NODE
          }

          capture_evidence() {
            echo "Smoke failure evidence (sensitive values redacted):"
            printf 'Runner architecture: %s\n' "$(uname -m)"
            printf 'Docker architecture: %s\n' "$(docker info --format '{{.Architecture}}')"
            printf 'Image architecture: %s\n' "$(docker image inspect "$IMAGE_REF" --format '{{.Architecture}}')"
            docker inspect dpg-staging-image-smoke \
              --format 'Container status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restartCount={{.RestartCount}}' \
              || true
            printf 'Last health HTTP status: %s\n' "${health_status:-not-recorded}"
            printf 'Last homepage HTTP status: %s\n' "${homepage_status:-not-recorded}"

            docker exec dpg-staging-image-smoke node -e \
              "require('dns').lookup('postgres', (error, address, family) => { if (error) { console.error('DNS probe failed:', error.code || 'unknown'); process.exit(1) } console.log('DNS probe passed:', address, 'IPv' + family) })" \
              || true
            docker exec dpg-staging-image-smoke node -e \
              "const socket = require('net').createConnection({ host: 'postgres', port: 5432 }); socket.setTimeout(5000); socket.on('connect', () => { console.log('TCP probe passed: postgres:5432'); socket.end() }); socket.on('timeout', () => { console.error('TCP probe failed: timeout'); socket.destroy(); process.exit(1) }); socket.on('error', error => { console.error('TCP probe failed:', error.code || 'unknown'); process.exit(1) })" \
              || true

            docker exec dpg-staging-image-smoke sh -c \
              'if command -v openssl >/dev/null 2>&1; then openssl version; else echo "OpenSSL executable: missing"; fi' \
              || true
            docker exec dpg-staging-image-smoke sh -c \
              'engines="$(find /app -type f -name "*query_engine*" -print)"; if [ -z "$engines" ]; then echo "Prisma engine files: missing"; exit 0; fi; printf "%s\n" "$engines"; for engine in $engines; do echo "ldd: $engine"; ldd "$engine" || true; done' \
              || true

            docker logs dpg-staging-image-smoke > /tmp/dpg-smoke.log 2>&1 || true
            echo "Redacted application container logs:"
            redact_file /tmp/dpg-smoke.log
            if [ -s /tmp/health.json ]; then
              echo "Redacted health response:"
              redact_file /tmp/health.json
            fi
          }

          cleanup() {
            docker rm -f dpg-staging-image-smoke >/dev/null 2>&1 || true
            rm -f /tmp/dpg-smoke.log /tmp/health.json
          }
          on_exit() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              capture_evidence || true
            fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT

          smoke_ip="$(docker inspect dpg-staging-image-smoke --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')"

          health_status=000
          for _ in $(seq 1 40); do
            health_status="$(curl -sS -o /tmp/health.json -w '%{http_code}' "http://$smoke_ip:3000/api/health" || true)"
            if [ "$health_status" = "200" ]; then
              break
            fi
            sleep 3
          done

          test "$health_status" = "200"
          node -e "const fs = require('fs'); const body = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8')); if (!body.ok || JSON.stringify(body).includes('DATABASE_URL')) process.exit(1)"

          homepage_status="$(curl -sS -o /dev/null -w '%{http_code}' "http://$smoke_ip:3000/" || true)"
          test "$homepage_status" = "200"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Staging image"
            echo
            echo "- Image: \`${IMAGE_NAME}:${{ steps.meta.outputs.tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platform: \`linux/arm64\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- SBOM/provenance: requested from Docker Buildx"
            echo "- Smoke test: \`GET /api/health\` and \`GET /\` passed"
          } >> "$GITHUB_STEP_SUMMARY"
