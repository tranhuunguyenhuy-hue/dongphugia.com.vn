name: Exact-commit Coolify staging preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number targeting main
        required: true
        type: string
      head_sha:
        description: Exact 40-character pull request head SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dongphugia-staging-preview
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dongphugia-web
  POSTGRES_IMAGE: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
  BUILD_DATABASE_URL: postgresql://dpg_staging_build:dpg_staging_build_password@postgres:5432/dpg_staging_build
  STAGING_SITE_URL: https://dongphugia-staging.47-131-92-97.sslip.io
  STAGING_BUNNY_CDN_HOSTNAME: cdn.dongphugia.com.vn
  EVIDENCE_DIR: artifacts/staging-preview

jobs:
  candidate:
    name: Bind exact open PR and required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.identity.outputs.head_sha }}
      pr_number: ${{ steps.identity.outputs.pr_number }}
      main_sha: ${{ steps.main.outputs.main_sha }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate exact PR head and required checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PR_NUMBER: ${{ inputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ inputs.head_sha }}
          CANDIDATE_SOURCE_PATH: artifacts/staging-preview/candidate-source.json
        run: node scripts/staging-preview/github-gate.mjs

      - name: Export accepted identity
        id: identity
        shell: bash
        env:
          PREVIEW_PR_NUMBER: ${{ inputs.pr_number }}
          PREVIEW_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          echo "head_sha=$PREVIEW_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PREVIEW_PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Resolve exact origin main rollback source
        id: main
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote origin refs/heads/main | awk 'NF {print $1; exit}')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Upload candidate source gate
        uses: actions/upload-artifact@v4
        with:
          name: staging-candidate-source-${{ inputs.head_sha }}
          path: artifacts/staging-preview/candidate-source.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build and verify native linux/arm64 images
    needs: candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      candidate_digest: ${{ steps.build.outputs.digest }}
      rollback_digest: ${{ steps.rollback_build.outputs.digest }}
      rollback_sha: ${{ needs.candidate.outputs.main_sha }}
    permissions:
      actions: read
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: dpg_staging_build
          POSTGRES_USER: dpg_staging_build
          POSTGRES_PASSWORD: dpg_staging_build_password
        options: >-
          --health-cmd "pg_isready -U dpg_staging_build -d dpg_staging_build"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact accepted head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.head_sha }}
          persist-credentials: false

      - name: Prove checkout identity and staging configuration
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$STAGING_SITE_URL" = "https://dongphugia-staging.47-131-92-97.sslip.io"
          case "$STAGING_SITE_URL" in
            https://www.dongphugia.vn|https://dongphugia.vn|*vercel.app*) exit 1 ;;
          esac
          case "$IMAGE_NAME" in *:latest|*@latest) exit 1 ;; esac

      - name: Bootstrap ephemeral synthetic build database
        shell: bash
        env:
          BUILD_NETWORK: ${{ job.services.postgres.network }}
        run: |
          set -euo pipefail
          docker run --rm --network "$BUILD_NETWORK" \
            -e PGPASSWORD=dpg_staging_build_password \
            -v "$PWD/docs/deploy/staging-db-bootstrap:/bootstrap:ro" \
            "$POSTGRES_IMAGE" \
            psql --set=ON_ERROR_STOP=1 --single-transaction \
              -h postgres -U dpg_staging_build -d dpg_staging_build \
              --file=/bootstrap/001_schema_from_prisma.sql \
              --file=/bootstrap/002_seed_synthetic_stg_demo.sql

          read -r tables products canonical sensitive <<<"$(
            docker run --rm --network "$BUILD_NETWORK" \
              -e PGPASSWORD=dpg_staging_build_password \
              "$POSTGRES_IMAGE" \
              psql -h postgres -U dpg_staging_build -d dpg_staging_build -At -F ' ' -c \
                "select
                   (select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'),
                   (select count(*) from products where sku like 'STG-DEMO-%'),
                   (select count(*) from products p join categories c on c.id=p.category_id where p.sku like 'STG-DEMO-%' and c.slug in ('thiet-bi-ve-sinh','thiet-bi-bep')),
                   ((select count(*) from admin_users)+(select count(*) from admin_sessions)+(select count(*) from customers)+(select count(*) from orders)+(select count(*) from quote_requests));"
          )"
          test "$tables" = "46"
          test "$products" = "3"
          test "$canonical" = "3"
          test "$sensitive" = "0"

      - name: Verify native ARM64 build environment
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in aarch64|arm64) ;; *) exit 1 ;; esac
          case "$(docker info --format '{{.Architecture}}')" in aarch64|arm64) ;; *) exit 1 ;; esac
          test "$(node -p 'process.arch')" = "arm64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify recovery tags are absent
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: dongphugia-web
          ROLLBACK_TAG: ${{ env.IMAGE_NAME }}:staging-rollback-${{ needs.candidate.outputs.main_sha }}-${{ github.run_id }}
          CANDIDATE_TAG: ${{ env.IMAGE_NAME }}:staging-${{ needs.candidate.outputs.head_sha }}-${{ github.run_id }}
        run: |
          set -euo pipefail

          # Use the OCI Distribution API so a missing tag is identified by its
          # status code. Response bodies and client diagnostics stay discarded;
          # every response other than a definitive 404 fails closed.
          check_absent() {
            local image_ref="$1"
            local tag="${image_ref##*:}"
            local status
            [[ "$PACKAGE_OWNER" =~ ^[A-Za-z0-9_.-]+$ ]] || return 1
            [[ "$image_ref" == "ghcr.io/${PACKAGE_OWNER}/${PACKAGE_NAME}:$tag" ]] || return 1
            [[ "$tag" =~ ^(staging-rollback|staging)-[0-9a-f]{40}-[0-9]+$ ]] || return 1
            if ! status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request HEAD \
              --connect-timeout 15 \
              --max-time 30 \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${PACKAGE_OWNER}/${PACKAGE_NAME}/manifests/$tag" 2>/dev/null)"; then
              status=000
            fi
            case "$status" in
              404) return 0 ;;
              2??|401|403) return 1 ;;
              *) return 1 ;;
            esac
          }
          check_absent "$ROLLBACK_TAG"
          check_absent "$CANDIDATE_TAG"

      - name: Checkout exact origin main rollback source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.main_sha }}
          persist-credentials: false

      - name: Prove exact main rollback checkout
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ needs.candidate.outputs.main_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk 'NF {print $1; exit}')" = "$EXPECTED_MAIN_SHA"

      - name: Build and push exact main rollback image
        id: rollback_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:staging-rollback-${{ needs.candidate.outputs.main_sha }}-${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.candidate.outputs.main_sha }}
            org.opencontainers.image.version=staging-rollback-${{ needs.candidate.outputs.main_sha }}-${{ github.run_id }}
            io.dongphugia.recovery.provenance=canonical-source-baseline
            io.dongphugia.recovery.legacy-equivalence=not-claimed
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.STAGING_SITE_URL }}
            NEXT_PUBLIC_GTM_ID=
            BUNNY_CDN_HOSTNAME=${{ env.STAGING_BUNNY_CDN_HOSTNAME }}
            DPG_SOURCE_REVISION=${{ needs.candidate.outputs.main_sha }}
            DPG_BUILD_RUN_ID=${{ github.run_id }}
            DPG_STAGING_PREVIEW=true

      - name: Verify exact main rollback digest, platform, SBOM, and provenance
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.rollback_build.outputs.digest }}
          EXPECTED_DIGEST: ${{ steps.rollback_build.outputs.digest }}
          EXPECTED_SHA: ${{ needs.candidate.outputs.main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE_REF" >/dev/null
          test "$(docker image inspect "$IMAGE_REF" --format '{{index .RepoDigests 0}}' | sed 's/^.*@//')" = "$EXPECTED_DIGEST"
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Architecture}}')" = "arm64"
          test "$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_SHA"
          test "$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels "io.dongphugia.recovery.provenance"}}')" = "canonical-source-baseline"
          docker buildx imagetools inspect "$IMAGE_REF" --raw > /tmp/rollback-image-manifest.json
          test "$(jq '[.manifests[] | select(.platform.os != "unknown")] | length' /tmp/rollback-image-manifest.json)" = "1"
          test "$(jq '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length' /tmp/rollback-image-manifest.json)" = "1"
          test "$(jq '[.manifests[] | select(.platform.os != "unknown") | select(.platform.os != "linux" or .platform.architecture != "arm64")] | length' /tmp/rollback-image-manifest.json)" = "0"
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .SBOM}}' > /tmp/rollback-image-sbom.json
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Provenance}}' > /tmp/rollback-image-provenance.json
          test "$(jq 'if type == "object" then length else 0 end' /tmp/rollback-image-sbom.json)" -gt 0
          test "$(jq 'if type == "object" then length else 0 end' /tmp/rollback-image-provenance.json)" -gt 0

      - name: Scan exact main rollback digest for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.rollback_build.outputs.digest }}
          format: json
          output: /tmp/trivy-rollback-results.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Write sanitized rollback Trivy summary
        if: always()
        env:
          TRIVY_RESULT_PATH: /tmp/trivy-rollback-results.json
          TRIVY_SUMMARY_PATH: artifacts/staging-preview/rollback-trivy-summary.json
          CANDIDATE_SHA: ${{ needs.candidate.outputs.main_sha }}
          CANDIDATE_DIGEST: ${{ steps.rollback_build.outputs.digest }}
          IMAGE_ROLE: exact-main-rollback
        run: node scripts/staging-preview/write-trivy-summary.mjs

      - name: Upload sanitized rollback Trivy summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-rollback-trivy-${{ needs.candidate.outputs.main_sha }}
          path: artifacts/staging-preview/rollback-trivy-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce rollback Trivy HIGH and CRITICAL zero
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary_path="artifacts/staging-preview/rollback-trivy-summary.json"
          test -s "$summary_path"
          test "$(jq -r '.scanStatus' "$summary_path")" = "complete"
          test "$(jq -r '.counts.high // -1' "$summary_path")" = "0"
          test "$(jq -r '.counts.critical // -1' "$summary_path")" = "0"

      - name: Checkout exact accepted candidate head for candidate image
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.head_sha }}
          persist-credentials: false

      - name: Prove candidate checkout has not drifted
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.candidate.outputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Build and push exact candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:staging-${{ needs.candidate.outputs.head_sha }}-${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.candidate.outputs.head_sha }}
            org.opencontainers.image.version=staging-${{ needs.candidate.outputs.head_sha }}-${{ github.run_id }}
            io.dongphugia.recovery.provenance=exact-pr-head
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.STAGING_SITE_URL }}
            NEXT_PUBLIC_GTM_ID=
            BUNNY_CDN_HOSTNAME=${{ env.STAGING_BUNNY_CDN_HOSTNAME }}
            DPG_SOURCE_REVISION=${{ needs.candidate.outputs.head_sha }}
            DPG_BUILD_RUN_ID=${{ github.run_id }}
            DPG_STAGING_PREVIEW=true

      - name: Verify digest, source label, platform, SBOM, and provenance
        id: verify
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_SHA: ${{ needs.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE_REF" >/dev/null
          test "$(docker image inspect "$IMAGE_REF" --format '{{index .RepoDigests 0}}' | sed 's/^.*@//')" = "$EXPECTED_DIGEST"
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Architecture}}')" = "arm64"
          test "$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_SHA"
          test "$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels "io.dongphugia.recovery.provenance"}}')" = "exact-pr-head"
          docker buildx imagetools inspect "$IMAGE_REF" --raw > /tmp/image-manifest.json
          test "$(jq '[.manifests[] | select(.platform.os != "unknown")] | length' /tmp/image-manifest.json)" = "1"
          test "$(jq '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length' /tmp/image-manifest.json)" = "1"
          test "$(jq '[.manifests[] | select(.platform.os != "unknown") | select(.platform.os != "linux" or .platform.architecture != "arm64")] | length' /tmp/image-manifest.json)" = "0"
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .SBOM}}' > /tmp/image-sbom.json
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Provenance}}' > /tmp/image-provenance.json
          sbom_sections="$(jq 'if type == "object" then length else 0 end' /tmp/image-sbom.json)"
          provenance_sections="$(jq 'if type == "object" then length else 0 end' /tmp/image-provenance.json)"
          test "$sbom_sections" -gt 0
          test "$provenance_sections" -gt 0
          echo "sbom_sections=$sbom_sections" >> "$GITHUB_OUTPUT"
          echo "provenance_sections=$provenance_sections" >> "$GITHUB_OUTPUT"

      - name: Scan exact candidate digest for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: json
          output: /tmp/trivy-results.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Write sanitized candidate Trivy summary
        if: always()
        env:
          TRIVY_RESULT_PATH: /tmp/trivy-results.json
          TRIVY_SUMMARY_PATH: artifacts/staging-preview/trivy-summary.json
          CANDIDATE_SHA: ${{ needs.candidate.outputs.head_sha }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ROLE: exact-pr-head
        run: node scripts/staging-preview/write-trivy-summary.mjs

      - name: Upload sanitized candidate Trivy summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-trivy-${{ needs.candidate.outputs.head_sha }}
          path: artifacts/staging-preview/trivy-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce candidate Trivy HIGH and CRITICAL zero
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary_path="artifacts/staging-preview/trivy-summary.json"
          test -s "$summary_path"
          test "$(jq -r '.scanStatus' "$summary_path")" = "complete"
          test "$(jq -r '.counts.high // -1' "$summary_path")" = "0"
          test "$(jq -r '.counts.critical // -1' "$summary_path")" = "0"

      - name: Smoke exact pushed digest against ephemeral build database
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          BUILD_NETWORK: ${{ job.services.postgres.network }}
        run: |
          set -euo pipefail
          cleanup() { docker rm -f dpg-staging-image-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm --detach \
            --name dpg-staging-image-smoke \
            --platform linux/arm64 \
            --network "$BUILD_NETWORK" \
            -e DATABASE_URL="$BUILD_DATABASE_URL" \
            -e DIRECT_URL="$BUILD_DATABASE_URL" \
            -e NEXT_PUBLIC_SITE_URL="$STAGING_SITE_URL" \
            -e BUNNY_CDN_HOSTNAME="$STAGING_BUNNY_CDN_HOSTNAME" \
            "$IMAGE_REF"
          smoke_ip="$(docker inspect dpg-staging-image-smoke --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')"
          for _ in $(seq 1 40); do
            health_status="$(curl -sS -o /tmp/health.json -w '%{http_code}' "http://$smoke_ip:3000/api/health" || true)"
            [ "$health_status" = "200" ] && break
            sleep 3
          done
          test "$health_status" = "200"
          node -e "const fs=require('fs');const body=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));if(!body.ok||JSON.stringify(body).includes('DATABASE_URL'))process.exit(1)"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://$smoke_ip:3000/")" = "200"
          test "$(curl -sS -o /tmp/revision.json -w '%{http_code}' "http://$smoke_ip:3000/api/revision")" = "200"
          test "$(jq -r .sourceRevision /tmp/revision.json)" = "${{ needs.candidate.outputs.head_sha }}"
          for _ in $(seq 1 40); do
            container_health="$(docker inspect dpg-staging-image-smoke --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')"
            [ "$container_health" = "healthy" ] && break
            [ "$container_health" = "unhealthy" ] && exit 1
            sleep 3
          done
          test "$container_health" = "healthy"
          test "$(docker inspect dpg-staging-image-smoke --format '{{.RestartCount}}')" = "0"

      - name: Download candidate source gate
        uses: actions/download-artifact@v4
        with:
          name: staging-candidate-source-${{ needs.candidate.outputs.head_sha }}
          path: artifacts/staging-preview

      - name: Write deterministic candidate manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_PR_NUMBER: ${{ needs.candidate.outputs.pr_number }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.head_sha }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          ROLLBACK_DIGEST: ${{ steps.rollback_build.outputs.digest }}
          ROLLBACK_SHA: ${{ needs.candidate.outputs.main_sha }}
        run: node scripts/staging-preview/write-manifest.mjs

      - name: Write private manual Coolify operator handoff
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PREVIEW_PR_NUMBER: ${{ needs.candidate.outputs.pr_number }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.head_sha }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          ROLLBACK_DIGEST: ${{ steps.rollback_build.outputs.digest }}
          ROLLBACK_SHA: ${{ needs.candidate.outputs.main_sha }}
        run: node scripts/staging-preview/write-operator-handoff.mjs

      - name: Upload immutable candidate manifest and operator handoff
        uses: actions/upload-artifact@v4
        with:
          name: staging-candidate-${{ needs.candidate.outputs.head_sha }}
          path: artifacts/staging-preview
          if-no-files-found: error
          retention-days: 14

      - name: Build summary and stop before private Coolify deployment
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          HEAD_SHA: ${{ needs.candidate.outputs.head_sha }}
          ROLLBACK_DIGEST: ${{ steps.rollback_build.outputs.digest }}
          ROLLBACK_SHA: ${{ needs.candidate.outputs.main_sha }}
        run: |
          {
            echo "### Exact staging candidate — manual gate pending"
            echo
            echo "- PR: #${{ needs.candidate.outputs.pr_number }}"
            echo "- Commit: \`$HEAD_SHA\`"
            echo "- Candidate digest: \`$DIGEST\`"
            echo "- Exact-main rollback image: \`$ROLLBACK_SHA\` / \`$ROLLBACK_DIGEST\`"
            echo "- Platform: \`linux/arm64\`"
            echo "- SBOM/provenance: verified"
            echo "- Trivy HIGH/CRITICAL: \`0/0\`"
            echo
            echo "The workflow stops here. A Coordinator/PM operator must use the private Coolify UI procedure in operator-handoff.md."
            echo "No GitHub-hosted runner receives Coolify credentials or calls the Coolify control plane."
          } >> "$GITHUB_STEP_SUMMARY"
