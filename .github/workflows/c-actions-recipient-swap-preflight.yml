name: C recipient swap preflight (no secret)

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/c-actions-original-key-diagnostic-once.yml
      - .github/workflows/c-actions-recipient-diagnostic-once.yml
      - .github/workflows/c-actions-recipient-swap-preflight.yml
      - scripts/backup/c-actions-container-swap-smoke.sh
      - scripts/backup/c-actions-host-swap-preflight.sh
      - scripts/backup/c-actions-recipient-diagnostic.sh
      - scripts/backup/c-actions-recipient-diagnostic-container.sh
      - scripts/backup/c-actions-recipient-diagnostic-synthetic.test.sh

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RECIPIENT_DIAGNOSTIC_IMAGE: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate age identity-format handling with synthetic input
        shell: bash
        run: bash scripts/backup/c-actions-recipient-diagnostic-synthetic.test.sh

      - name: Pull the pinned public image
        shell: bash
        run: docker pull "$RECIPIENT_DIAGNOSTIC_IMAGE" >/dev/null 2>&1

      - name: Verify isolated container memory and swap controls
        shell: bash
        run: bash scripts/backup/c-actions-container-swap-smoke.sh

      - name: Measure and disable host swap
        shell: bash
        run: bash scripts/backup/c-actions-host-swap-preflight.sh
