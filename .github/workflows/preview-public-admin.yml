name: Reusable exact-SHA Public and Admin Preview publisher

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact immutable candidate source commit
        required: true
        type: string
      pull_request_number:
        description: Pull request whose Owner label authorized the candidate
        required: true
        type: string
      workers_plan_status:
        description: Read-only Workers cost classification from the caller
        required: true
        type: string
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_LEO563_PREVIEW_TOKEN:
        required: true
      PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET:
        required: true
    outputs:
      public_result:
        description: Exact-SHA live Public Worker proof result
        value: ${{ jobs.public-preview-upload.outputs.result }}
      public_preview_url:
        description: Public Worker Preview URL after live verification
        value: ${{ jobs.public-preview-upload.outputs.preview_url }}
      admin_result:
        description: Exact-SHA live Admin Worker proof result
        value: ${{ jobs.admin-preview-upload.outputs.result }}
      admin_preview_url:
        description: Admin Worker Preview URL after live verification
        value: ${{ jobs.admin-preview-upload.outputs.preview_url }}

permissions:
  contents: read
  actions: read

jobs:
  public-preview-upload:
    name: Publish the isolated Public Worker Preview
    if: inputs.workers_plan_status == 'FREE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.record.outputs.result }}
      worker_version_id: ${{ steps.record.outputs.worker_version_id }}
      preview_url: ${{ steps.record.outputs.preview_url }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
      DPG_PREVIEW_PR_NUMBER: ${{ inputs.pull_request_number }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/dongphugia-app-preview-download
      EVIDENCE_DIR: ${{ github.workspace }}/.artifacts/leo563-public-preview-evidence
      WRANGLER_BIN: ${{ github.workspace }}/apps/public/node_modules/wrangler/bin/wrangler.js
    steps:
      - name: Checkout the exact Owner-approved PR-head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install candidate verification and pinned Wrangler toolchains
        run: |
          npm ci
          npm ci --prefix apps/public

      - name: Download the immutable exact-head candidate from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: dongphugia-app-preview-${{ inputs.source_sha }}
          path: ${{ env.ARTIFACT_ROOT }}

      - name: Re-verify the complete candidate identity before any Cloudflare mutation
        run: >-
          npm run app:verify-candidate --
          --artifact-root "$ARTIFACT_ROOT"
          --source-sha "$SOURCE_SHA"
          --pr-number "$PR_NUMBER"
          --workflow-run-id "$WORKFLOW_RUN_ID"
          --lockfile package-lock.json
          --public-lockfile apps/public/package-lock.json
          --migration-manifest db/postgres-migrations/manifest.json
          --evidence "$ARTIFACT_ROOT/candidate-evidence.json"

      - name: Re-verify the Admin Worker artifact before Cloudflare mutation
        run: >-
          node scripts/preview/admin-worker-artifact.mjs
          --mode verify
          --build-output "$ARTIFACT_ROOT/admin-worker/build-output"
          --evidence "$ARTIFACT_ROOT/admin-worker/artifact-evidence.json"
          --source-sha "$SOURCE_SHA"

      - name: Prove Worker identity, Free limits, Preview-only config, and Production isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          npm run app:preview-publication -- preflight \
            --artifact-root "$ARTIFACT_ROOT" \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --output "$EVIDENCE_DIR/publication-preflight.json"
          cd "$ARTIFACT_ROOT/public/build"
          node "$WRANGLER_BIN" versions upload \
            --dry-run \
            --strict \
            --config wrangler.preview.json \
            --preview-alias "pr-$PR_NUMBER"

      - name: Inspect the current Worker state before publication
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm run app:preview-publication -- inspect-resource-state \
            --output "$EVIDENCE_DIR/remote-preflight.json"

      - name: Bootstrap absent, reconcile incomplete, or reuse managed active Preview
        id: bootstrap_write
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo 'write_attempted=false' >> "$GITHUB_OUTPUT"
          remote_state="$(jq -r '.state' "$EVIDENCE_DIR/remote-preflight.json")"
          test "$(jq -r '.reconciliationAllowed' "$EVIDENCE_DIR/remote-preflight.json")" = 'true'
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          case "$remote_state" in
            ABSENT)
              test "$(jq -r '.workerAbsent' "$EVIDENCE_DIR/remote-preflight.json")" = 'true'
              test "$(jq -r '.bootstrapRequired' "$EVIDENCE_DIR/remote-preflight.json")" = 'true'
              cd "$ARTIFACT_ROOT/public/build"
              echo 'write_attempted=true' >> "$GITHUB_OUTPUT"
              node "$WRANGLER_BIN" deploy \
                --strict \
                --config wrangler.preview.json \
                --message "PR #$PR_NUMBER bootstrap source $SOURCE_SHA" \
                2>&1 | tee "$EVIDENCE_DIR/bootstrap-deploy.log"
              ;;
            INCOMPLETE)
              test "$(jq -r '.workerAbsent' "$EVIDENCE_DIR/remote-preflight.json")" = 'false'
              test "$(jq -r '.bootstrapRequired' "$EVIDENCE_DIR/remote-preflight.json")" = 'false'
              echo 'Verified empty Worker record found; bootstrap is skipped and immutable version upload will reconcile it.'
              ;;
            MANAGED_ACTIVE_PREVIEW|MANAGED_BASELINE_ATTESTED)
              test "$(jq -r '.workerAbsent' "$EVIDENCE_DIR/remote-preflight.json")" = 'false'
              test "$(jq -r '.bootstrapRequired' "$EVIDENCE_DIR/remote-preflight.json")" = 'false'
              test "$(jq -r '.activeDeployment' "$EVIDENCE_DIR/remote-preflight.json")" = 'true'
              echo 'Verified isolated active Preview from current Worker read-back; bootstrap and deployment replacement are skipped and immutable version upload will preserve the active deployment.'
              ;;
            *)
              echo "Unexpected Worker preflight state: $remote_state" >&2
              exit 1
              ;;
          esac

      - name: Upload one immutable Worker version with the approved PR Preview alias
        id: version_upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET: ${{ secrets.PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET }}
          PUBLIC_ORDER_INTAKE_URL: https://uybumsnyqpwcidjxmfsv.supabase.co/functions/v1/order-intake
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo 'write_attempted=false' >> "$GITHUB_OUTPUT"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PREVIEW_SUPABASE_PUBLISHABLE_KEY"
          test "$PUBLIC_ORDER_INTAKE_URL" = 'https://uybumsnyqpwcidjxmfsv.supabase.co/functions/v1/order-intake'
          [[ "$PREVIEW_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]
          if (( ${#PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET} < 32 )); then
            echo 'Preview order signing secret is missing or too short.' >&2
            exit 1
          fi
          cd "$ARTIFACT_ROOT/public/build"
          umask 077
          secrets_file="$(mktemp "${RUNNER_TEMP}/phase2-preview-worker-secrets.XXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          node --input-type=module -e 'import { writeFile } from "node:fs/promises"; const file=process.argv[1]; const value=process.env.PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET; if (typeof value !== "string" || new TextEncoder().encode(value).byteLength < 32) throw new Error("PREVIEW_ORDER_SECRET_INVALID"); await writeFile(file, JSON.stringify({ ORDER_INTAKE_SIGNING_SECRET: value }), { mode: 0o600, flag: "wx" });' "$secrets_file"
          echo 'write_attempted=true' >> "$GITHUB_OUTPUT"
          node "$WRANGLER_BIN" versions upload \
            --strict \
            --config wrangler.preview.json \
            --var "PUBLIC_ORDER_INTAKE_URL:${PUBLIC_ORDER_INTAKE_URL}" \
            --var "PUBLIC_SUPABASE_PUBLISHABLE_KEY:${PREVIEW_SUPABASE_PUBLISHABLE_KEY}" \
            --secrets-file "$secrets_file" \
            --preview-alias "pr-$PR_NUMBER" \
            --tag "leo563-${SOURCE_SHA:0:12}" \
            --message "PR #$PR_NUMBER source $SOURCE_SHA" \
            2>&1 | tee "$EVIDENCE_DIR/wrangler-upload.log"

      - name: Record the immutable version and workers.dev Preview identity
        run: >-
          npm run app:preview-publication -- record-upload
          --input "$EVIDENCE_DIR/wrangler-upload.log"
          --preflight "$EVIDENCE_DIR/publication-preflight.json"
          --source-sha "$SOURCE_SHA"
          --output "$EVIDENCE_DIR/upload-evidence.json"

      - name: Inspect the created Worker and publication-attempt state with sanitized GET-only calls
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}
        run: >-
          npm run app:preview-publication -- inspect-resource
          --upload "$EVIDENCE_DIR/upload-evidence.json"
          --preflight "$EVIDENCE_DIR/remote-preflight.json"
          --bootstrap-log "$EVIDENCE_DIR/bootstrap-deploy.log"
          --output "$EVIDENCE_DIR/resource-proof.json"

      - name: Prove real HTTPS SSR, noindex, cache, health, robots, and source identity
        shell: bash
        run: |
          set -euo pipefail
          preview_url="$(jq -r '.previewUrl' "$EVIDENCE_DIR/upload-evidence.json")"
          npm run app:real-preview-proof -- \
            --url "$preview_url" \
            --source-sha "$SOURCE_SHA" \
            --output "$EVIDENCE_DIR/runtime-proof.json"

      - name: Record the accepted real Public Preview result
        id: record
        shell: bash
        run: |
          set -euo pipefail
          version_id="$(jq -r '.workerVersionId' "$EVIDENCE_DIR/upload-evidence.json")"
          preview_url="$(jq -r '.previewUrl' "$EVIDENCE_DIR/upload-evidence.json")"
          test "$(jq -r '.sourceCommit' "$EVIDENCE_DIR/runtime-proof.json")" = "$SOURCE_SHA"
          jq -e '.observations.cache.first | . == "MISS" or . == "HIT"' "$EVIDENCE_DIR/runtime-proof.json" >/dev/null
          jq -e '.observations.cache.subsequent | . == "MISS" or . == "HIT"' "$EVIDENCE_DIR/runtime-proof.json" >/dev/null
          test "$(jq -r '.customDomains | length' "$EVIDENCE_DIR/resource-proof.json")" = '0'
          {
            echo 'result=REAL_PUBLIC_PREVIEW_PASS'
            echo "worker_version_id=$version_id"
            echo "preview_url=$preview_url"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### LEO-563 isolated Public Worker Preview: PASS'
            echo "- Exact source SHA: $SOURCE_SHA"
            echo '- Worker: dongphugia-v1-public-preview'
            echo "- Worker version ID: $version_id"
            echo "- Preview alias: pr-$PR_NUMBER"
            echo "- Preview URL: $preview_url"
            echo '- Workers Free CPU/subrequest ceilings: provider-enforced; no explicit limits configured'
            echo '- Real SSR, health, HTML/header/robots noindex, MISS/HIT/bypass, and 300-second freshness: PASS'
            echo '- Preview URL CPU measurement: PROVIDER_LIMITATION; Preview URL logs/tail/Logpush are unavailable.'
            echo '- Custom domains/routes/Production binding/DNS/traffic: NONE'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect the Worker state after a failed publication or runtime gate
        if: ${{ failure() && (steps.bootstrap_write.outputs.write_attempted == 'true' || steps.version_upload.outputs.write_attempted == 'true') }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          state_args=(--output "$EVIDENCE_DIR/post-failure-remote-state.json")
          if [[ -f "$EVIDENCE_DIR/resource-proof.json" && -f "$EVIDENCE_DIR/upload-evidence.json" ]]; then
            state_args+=(
              --expected-resource-proof "$EVIDENCE_DIR/resource-proof.json"
              --upload "$EVIDENCE_DIR/upload-evidence.json"
            )
          fi
          npm run app:preview-publication -- inspect-resource-state "${state_args[@]}"

      - name: Upload sanitized immutable Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leo563-real-public-preview-${{ inputs.source_sha }}
          path: |
            ${{ env.EVIDENCE_DIR }}/publication-preflight.json
            ${{ env.EVIDENCE_DIR }}/remote-preflight.json
            ${{ env.EVIDENCE_DIR }}/upload-evidence.json
            ${{ env.EVIDENCE_DIR }}/resource-proof.json
            ${{ env.EVIDENCE_DIR }}/runtime-proof.json
            ${{ env.EVIDENCE_DIR }}/post-failure-remote-state.json
          if-no-files-found: warn
          retention-days: 90

  admin-preview-upload:
    name: Deploy and verify the isolated Admin Worker Preview
    needs: public-preview-upload
    if: needs.public-preview-upload.result == 'success' && needs.public-preview-upload.outputs.result == 'REAL_PUBLIC_PREVIEW_PASS' && inputs.workers_plan_status == 'FREE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.record.outputs.result }}
      preview_url: ${{ steps.record.outputs.preview_url }}
      worker_artifact_sha256: ${{ steps.record.outputs.worker_artifact_sha256 }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      ADMIN_PREVIEW_URL: https://dongphugia-phase2-admin-preview-290.tranhuunguyenhuy.workers.dev
      ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/dongphugia-app-preview-download
      BUILD_OUTPUT: ${{ github.workspace }}/apps/admin/.cloudflare/output/v0
      EVIDENCE_DIR: ${{ github.workspace }}/.artifacts/phase2-admin-preview-evidence
    steps:
      - name: Checkout the exact Owner-labeled PR-head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact source verifiers and Admin Worker toolchain
        run: |
          npm ci
          npm ci --prefix apps/admin

      - name: Download the immutable exact-SHA Public/Admin artifact
        uses: actions/download-artifact@v4
        with:
          name: dongphugia-app-preview-${{ inputs.source_sha }}
          path: ${{ env.ARTIFACT_ROOT }}

      - name: Verify the Admin Worker artifact and copy its exact Build Output
        shell: bash
        run: |
          set -euo pipefail
          node scripts/preview/admin-worker-artifact.mjs \
            --mode verify \
            --build-output "$ARTIFACT_ROOT/admin-worker/build-output" \
            --evidence "$ARTIFACT_ROOT/admin-worker/artifact-evidence.json" \
            --source-sha "$SOURCE_SHA"
          mkdir -p "$BUILD_OUTPUT"
          cp -a "$ARTIFACT_ROOT/admin-worker/build-output/." "$BUILD_OUTPUT/"

      - name: Deploy only the no-domain Admin Preview Worker
        working-directory: apps/admin
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: admin
          APP_ORIGIN: https://dongphugia-phase2-admin-preview-290.tranhuunguyenhuy.workers.dev
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ inputs.source_sha }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LEO563_PREVIEW_TOKEN }}
        run: npm run deploy:vinext -- --skip-build

      - name: Verify real HTTPS Admin health, noindex, and unauthenticated denial
        env:
          ADMIN_PROOF: ${{ env.EVIDENCE_DIR }}/admin-runtime-proof.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          for attempt in {1..10}; do
            if node scripts/preview/real-admin-preview-proof.mjs \
              --url "$ADMIN_PREVIEW_URL" \
              --source-sha "$SOURCE_SHA" > "$ADMIN_PROOF"; then
              exit 0
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo 'Admin Worker did not pass live acceptance after bounded propagation checks.' >&2
              exit 1
            fi
            sleep 3
          done

      - name: Record Admin Preview acceptance
        id: record
        shell: bash
        run: |
          set -euo pipefail
          worker_sha="$(jq -r '.buildOutput.sha256' "$ARTIFACT_ROOT/admin-worker/artifact-evidence.json")"
          test "$(jq -r '.sourceSha' "$EVIDENCE_DIR/admin-runtime-proof.json")" = "$SOURCE_SHA"
          test "$(jq -r '.observations.unauthenticatedOrdersDenied' "$EVIDENCE_DIR/admin-runtime-proof.json")" = 'PASS'
          {
            echo 'result=REAL_ADMIN_PREVIEW_PASS'
            echo "preview_url=$ADMIN_PREVIEW_URL"
            echo "worker_artifact_sha256=$worker_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Isolated Admin Worker Preview: PASS'
            echo "- Exact source SHA: $SOURCE_SHA"
            echo "- Worker artifact SHA-256: $worker_sha"
            echo "- Admin Preview URL: $ADMIN_PREVIEW_URL"
            echo '- Health/source identity, login noindex/private no-store, robots disallow, and unauthenticated order denial: PASS'
            echo '- Custom domains, routes, and Production traffic: NONE'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized Admin Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-admin-preview-${{ inputs.source_sha }}
          path: ${{ env.EVIDENCE_DIR }}/admin-runtime-proof.json
          if-no-files-found: warn
          retention-days: 90
