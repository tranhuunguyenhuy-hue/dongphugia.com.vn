name: Reusable exact-SHA Public and Admin Preview publisher

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact immutable candidate source commit
        required: true
        type: string
      pull_request_number:
        description: Pull request whose Owner label authorized the candidate
        required: true
        type: string
      workers_plan_status:
        description: Read-only Workers cost classification from the caller
        required: true
        type: string
      run_order_intake_diagnostic:
        description: Run the temporary exact-SHA receipt diagnostic after Owner-approved Public/Admin publication
        required: false
        default: false
        type: boolean
    secrets:
      CLOUDFLARE_PHASE2_PREVIEW_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET:
        required: true
    outputs:
      public_result:
        description: Exact-SHA live Public Worker proof result
        value: ${{ jobs.public-preview-upload.outputs.result }}
      public_preview_url:
        description: Public Worker Preview URL after live verification
        value: ${{ jobs.public-preview-upload.outputs.preview_url }}
      admin_result:
        description: Exact-SHA live Admin Worker proof result
        value: ${{ jobs.admin-preview-upload.outputs.result }}
      admin_preview_url:
        description: Admin Worker Preview URL after live verification
        value: ${{ jobs.admin-preview-upload.outputs.preview_url }}
      order_intake_diagnostic_result:
        description: Safe exact-SHA synthetic receipt diagnostic result
        value: ${{ jobs.order-intake-diagnostic.outputs.result }}

permissions:
  contents: read
  actions: read

jobs:
  public-preview-upload:
    name: Publish the isolated Public Worker Preview
    if: inputs.workers_plan_status == 'FREE'
    environment: phase2-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.record.outputs.result }}
      worker_version_id: ${{ steps.record.outputs.worker_version_id }}
      preview_url: ${{ steps.record.outputs.preview_url }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
      DPG_PREVIEW_PR_NUMBER: ${{ inputs.pull_request_number }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/dongphugia-app-preview-download
      EVIDENCE_DIR: ${{ github.workspace }}/.artifacts/leo563-public-preview-evidence
      WRANGLER_BIN: ${{ github.workspace }}/apps/public/node_modules/wrangler/bin/wrangler.js
    steps:
      - name: Require dedicated Phase 2 Preview credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'Missing CLOUDFLARE_PHASE2_PREVIEW_TOKEN in GitHub environment phase2-preview; configure it after Owner approval.' >&2
            exit 1
          fi

      - name: Checkout the exact Owner-approved PR-head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install candidate verification and pinned Wrangler toolchains
        run: |
          npm ci
          npm ci --prefix apps/public

      - name: Download the immutable exact-head candidate from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: dongphugia-app-preview-${{ inputs.source_sha }}
          path: ${{ env.ARTIFACT_ROOT }}

      - name: Re-verify the complete candidate identity before any Cloudflare mutation
        run: >-
          npm run app:verify-candidate --
          --artifact-root "$ARTIFACT_ROOT"
          --source-sha "$SOURCE_SHA"
          --pr-number "$PR_NUMBER"
          --workflow-run-id "$WORKFLOW_RUN_ID"
          --lockfile package-lock.json
          --public-lockfile apps/public/package-lock.json
          --migration-manifest db/postgres-migrations/manifest.json
          --evidence "$ARTIFACT_ROOT/candidate-evidence.json"

      - name: Re-verify the Admin Worker artifact before Cloudflare mutation
        run: >-
          node scripts/preview/admin-worker-artifact.mjs
          --mode verify
          --build-output "$ARTIFACT_ROOT/admin-worker/build-output"
          --evidence "$ARTIFACT_ROOT/admin-worker/artifact-evidence.json"
          --source-sha "$SOURCE_SHA"

      - name: Attest the existing account-scoped Cloudflare credential before any Worker mutation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node scripts/app-foundation/order-intake-diagnostic.mjs attest-scope \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" > "$EVIDENCE_DIR/credential-scope.json"
          if [[ "$(jq -r '.result' "$EVIDENCE_DIR/credential-scope.json")" != 'ORDER_DIAGNOSTIC_CREDENTIAL_SCOPE_PASS' ]]; then
            reason="$(jq -r '.reason // "UNKNOWN"' "$EVIDENCE_DIR/credential-scope.json")"
            echo "Cloudflare credential scope could not be safely established: $reason" >&2
            exit 1
          fi
          echo 'Cloudflare credential scope: exact Preview account, no token-write permission, Worker write only.'

      - name: Prove Worker identity, Free limits, Preview-only config, and Production isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          npm run app:preview-publication -- preflight \
            --artifact-root "$ARTIFACT_ROOT" \
            --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --output "$EVIDENCE_DIR/publication-preflight.json"
          cd "$ARTIFACT_ROOT/public/build"
          node "$WRANGLER_BIN" versions upload \
            --dry-run \
            --strict \
            --config wrangler.preview.json \
            --preview-alias "pr-$PR_NUMBER"

      - name: Inspect the current Worker state before publication
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm run app:preview-publication -- inspect-resource-state \
            --output "$EVIDENCE_DIR/remote-preflight.json"

      - name: Bootstrap absent, reconcile incomplete, or reuse managed active Preview
        id: bootstrap_write
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo 'write_attempted=false' >> "$GITHUB_OUTPUT"
          remote_state="$(jq -r '.state' "$EVIDENCE_DIR/remote-preflight.json")"
          test "$(jq -r '.reconciliationAllowed' "$EVIDENCE_DIR/remote-preflight.json")" = 'true'
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          case "$remote_state" in
            ABSENT)
              test "$(jq -r '.workerAbsent' "$EVIDENCE_DIR/remote-preflight.json")" = 'true'
              test "$(jq -r '.bootstrapRequired' "$EVIDENCE_DIR/remote-preflight.json")" = 'true'
              cd "$ARTIFACT_ROOT/public/build"
              echo 'write_attempted=true' >> "$GITHUB_OUTPUT"
              node "$WRANGLER_BIN" deploy \
                --strict \
                --config wrangler.preview.json \
                --message "PR #$PR_NUMBER bootstrap source $SOURCE_SHA" \
                2>&1 | tee "$EVIDENCE_DIR/bootstrap-deploy.log"
              ;;
            INCOMPLETE)
              test "$(jq -r '.workerAbsent' "$EVIDENCE_DIR/remote-preflight.json")" = 'false'
              test "$(jq -r '.bootstrapRequired' "$EVIDENCE_DIR/remote-preflight.json")" = 'false'
              echo 'Verified empty Worker record found; bootstrap is skipped and immutable version upload will reconcile it.'
              ;;
            MANAGED_ACTIVE_PREVIEW|MANAGED_BASELINE_ATTESTED)
              test "$(jq -r '.workerAbsent' "$EVIDENCE_DIR/remote-preflight.json")" = 'false'
              test "$(jq -r '.bootstrapRequired' "$EVIDENCE_DIR/remote-preflight.json")" = 'false'
              test "$(jq -r '.activeDeployment' "$EVIDENCE_DIR/remote-preflight.json")" = 'true'
              echo 'Verified isolated active Preview from current Worker read-back; bootstrap and deployment replacement are skipped and immutable version upload will preserve the active deployment.'
              ;;
            *)
              echo "Unexpected Worker preflight state: $remote_state" >&2
              exit 1
              ;;
          esac

      - name: Upload one immutable Worker version with the approved PR Preview alias
        id: version_upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET: ${{ secrets.PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET }}
          PUBLIC_ORDER_INTAKE_URL: https://uybumsnyqpwcidjxmfsv.supabase.co/functions/v1/order-intake
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo 'write_attempted=false' >> "$GITHUB_OUTPUT"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PREVIEW_SUPABASE_PUBLISHABLE_KEY"
          test "$PUBLIC_ORDER_INTAKE_URL" = 'https://uybumsnyqpwcidjxmfsv.supabase.co/functions/v1/order-intake'
          [[ "$PREVIEW_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]
          if (( ${#PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET} < 32 )); then
            echo 'Preview order signing secret is missing or too short.' >&2
            exit 1
          fi
          cd "$ARTIFACT_ROOT/public/build"
          umask 077
          secrets_dir="$(mktemp -d "${RUNNER_TEMP}/phase2-preview-worker-secrets.XXXXXX")"
          secrets_file="${secrets_dir}/worker-secrets.json"
          trap 'rm -f "$secrets_file"; rmdir "$secrets_dir"' EXIT
          node --input-type=module -e 'import { writeFile } from "node:fs/promises"; const file=process.argv[1]; const value=process.env.PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET; if (typeof value !== "string" || new TextEncoder().encode(value).byteLength < 32) throw new Error("PREVIEW_ORDER_SECRET_INVALID"); await writeFile(file, JSON.stringify({ ORDER_INTAKE_SIGNING_SECRET: value }), { mode: 0o600, flag: "wx" });' "$secrets_file"
          echo 'write_attempted=true' >> "$GITHUB_OUTPUT"
          node "$WRANGLER_BIN" versions upload \
            --strict \
            --config wrangler.preview.json \
            --var "PUBLIC_ORDER_INTAKE_URL:${PUBLIC_ORDER_INTAKE_URL}" \
            --var "PUBLIC_SUPABASE_PUBLISHABLE_KEY:${PREVIEW_SUPABASE_PUBLISHABLE_KEY}" \
            --secrets-file "$secrets_file" \
            --preview-alias "pr-$PR_NUMBER" \
            --tag "leo563-${SOURCE_SHA:0:12}" \
            --message "PR #$PR_NUMBER source $SOURCE_SHA" \
            2>&1 | tee "$EVIDENCE_DIR/wrangler-upload.log"

      - name: Record the immutable version and workers.dev Preview identity
        run: >-
          npm run app:preview-publication -- record-upload
          --input "$EVIDENCE_DIR/wrangler-upload.log"
          --preflight "$EVIDENCE_DIR/publication-preflight.json"
          --source-sha "$SOURCE_SHA"
          --output "$EVIDENCE_DIR/upload-evidence.json"

      - name: Inspect the created Worker and publication-attempt state with sanitized GET-only calls
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
        run: >-
          npm run app:preview-publication -- inspect-resource
          --upload "$EVIDENCE_DIR/upload-evidence.json"
          --preflight "$EVIDENCE_DIR/remote-preflight.json"
          --bootstrap-log "$EVIDENCE_DIR/bootstrap-deploy.log"
          --output "$EVIDENCE_DIR/resource-proof.json"

      - name: Prove real HTTPS SSR, noindex, cache, health, robots, and source identity
        shell: bash
        run: |
          set -euo pipefail
          preview_url="$(jq -r '.previewUrl' "$EVIDENCE_DIR/upload-evidence.json")"
          npm run app:real-preview-proof -- \
            --url "$preview_url" \
            --source-sha "$SOURCE_SHA" \
            --output "$EVIDENCE_DIR/runtime-proof.json"

      - name: Record the accepted real Public Preview result
        id: record
        shell: bash
        run: |
          set -euo pipefail
          version_id="$(jq -r '.workerVersionId' "$EVIDENCE_DIR/upload-evidence.json")"
          preview_url="$(jq -r '.previewUrl' "$EVIDENCE_DIR/upload-evidence.json")"
          test "$(jq -r '.sourceCommit' "$EVIDENCE_DIR/runtime-proof.json")" = "$SOURCE_SHA"
          jq -e '.observations.cache.first | . == "MISS" or . == "HIT"' "$EVIDENCE_DIR/runtime-proof.json" >/dev/null
          jq -e '.observations.cache.subsequent | . == "MISS" or . == "HIT"' "$EVIDENCE_DIR/runtime-proof.json" >/dev/null
          test "$(jq -r '.customDomains | length' "$EVIDENCE_DIR/resource-proof.json")" = '0'
          {
            echo 'result=REAL_PUBLIC_PREVIEW_PASS'
            echo "worker_version_id=$version_id"
            echo "preview_url=$preview_url"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### LEO-563 isolated Public Worker Preview: PASS'
            echo "- Exact source SHA: $SOURCE_SHA"
            echo '- Worker: dongphugia-v1-public-preview'
            echo "- Worker version ID: $version_id"
            echo "- Preview alias: pr-$PR_NUMBER"
            echo "- Preview URL: $preview_url"
            echo '- Workers Free CPU/subrequest ceilings: provider-enforced; no explicit limits configured'
            echo '- Real SSR, health, HTML/header/robots noindex, MISS/HIT/bypass, and 300-second freshness: PASS'
            echo '- Preview URL CPU measurement: PROVIDER_LIMITATION; Preview URL logs/tail/Logpush are unavailable.'
            echo '- Custom domains/routes/Production binding/DNS/traffic: NONE'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect the Worker state after a failed publication or runtime gate
        if: ${{ failure() && (steps.bootstrap_write.outputs.write_attempted == 'true' || steps.version_upload.outputs.write_attempted == 'true') }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          state_args=(--output "$EVIDENCE_DIR/post-failure-remote-state.json")
          if [[ -f "$EVIDENCE_DIR/resource-proof.json" && -f "$EVIDENCE_DIR/upload-evidence.json" ]]; then
            state_args+=(
              --expected-resource-proof "$EVIDENCE_DIR/resource-proof.json"
              --upload "$EVIDENCE_DIR/upload-evidence.json"
            )
          fi
          npm run app:preview-publication -- inspect-resource-state "${state_args[@]}"

      - name: Upload sanitized immutable Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leo563-real-public-preview-${{ inputs.source_sha }}
          path: |
            ${{ env.EVIDENCE_DIR }}/publication-preflight.json
            ${{ env.EVIDENCE_DIR }}/remote-preflight.json
            ${{ env.EVIDENCE_DIR }}/upload-evidence.json
            ${{ env.EVIDENCE_DIR }}/resource-proof.json
            ${{ env.EVIDENCE_DIR }}/runtime-proof.json
            ${{ env.EVIDENCE_DIR }}/post-failure-remote-state.json
            ${{ env.EVIDENCE_DIR }}/credential-scope.json
          if-no-files-found: warn
          retention-days: 90

  admin-preview-upload:
    name: Deploy and verify the isolated Admin Worker Preview
    needs: public-preview-upload
    if: needs.public-preview-upload.result == 'success' && needs.public-preview-upload.outputs.result == 'REAL_PUBLIC_PREVIEW_PASS' && inputs.workers_plan_status == 'FREE'
    environment: phase2-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.record.outputs.result }}
      preview_url: ${{ steps.record.outputs.preview_url }}
      worker_artifact_sha256: ${{ steps.record.outputs.worker_artifact_sha256 }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      ADMIN_PREVIEW_URL: https://dongphugia-phase2-admin-preview-290.tranhuunguyenhuy.workers.dev
      ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/dongphugia-app-preview-download
      BUILD_OUTPUT: ${{ github.workspace }}/apps/admin/.cloudflare/output/v0
      EVIDENCE_DIR: ${{ github.workspace }}/.artifacts/phase2-admin-preview-evidence
    steps:
      - name: Require dedicated Phase 2 Preview credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'Missing CLOUDFLARE_PHASE2_PREVIEW_TOKEN in GitHub environment phase2-preview; configure it after Owner approval.' >&2
            exit 1
          fi

      - name: Checkout the exact Owner-labeled PR-head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact source verifiers and Admin Worker toolchain
        run: |
          npm ci
          npm ci --prefix apps/admin

      - name: Download the immutable exact-SHA Public/Admin artifact
        uses: actions/download-artifact@v4
        with:
          name: dongphugia-app-preview-${{ inputs.source_sha }}
          path: ${{ env.ARTIFACT_ROOT }}

      - name: Verify the Admin Worker artifact and copy its exact Build Output
        shell: bash
        run: |
          set -euo pipefail
          node scripts/preview/admin-worker-artifact.mjs \
            --mode verify \
            --build-output "$ARTIFACT_ROOT/admin-worker/build-output" \
            --evidence "$ARTIFACT_ROOT/admin-worker/artifact-evidence.json" \
            --source-sha "$SOURCE_SHA"
          mkdir -p "$BUILD_OUTPUT"
          cp -a "$ARTIFACT_ROOT/admin-worker/build-output/." "$BUILD_OUTPUT/"

      - name: Deploy only the no-domain Admin Preview Worker
        working-directory: apps/admin
        env:
          APP_ENV: preview
          APP_BUILD_TARGET: admin
          APP_ORIGIN: https://dongphugia-phase2-admin-preview-290.tranhuunguyenhuy.workers.dev
          PREVIEW_NOINDEX: 'true'
          BUILD_SOURCE_SHA: ${{ inputs.source_sha }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
        run: npm run deploy:vinext -- --skip-build

      - name: Verify real HTTPS Admin health, noindex, and unauthenticated denial
        env:
          ADMIN_PROOF: ${{ env.EVIDENCE_DIR }}/admin-runtime-proof.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          for attempt in {1..10}; do
            if node scripts/preview/real-admin-preview-proof.mjs \
              --url "$ADMIN_PREVIEW_URL" \
              --source-sha "$SOURCE_SHA" > "$ADMIN_PROOF"; then
              exit 0
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo 'Admin Worker did not pass live acceptance after bounded propagation checks.' >&2
              exit 1
            fi
            sleep 3
          done

      - name: Record Admin Preview acceptance
        id: record
        shell: bash
        run: |
          set -euo pipefail
          worker_sha="$(jq -r '.buildOutput.sha256' "$ARTIFACT_ROOT/admin-worker/artifact-evidence.json")"
          test "$(jq -r '.sourceSha' "$EVIDENCE_DIR/admin-runtime-proof.json")" = "$SOURCE_SHA"
          test "$(jq -r '.observations.unauthenticatedOrdersDenied' "$EVIDENCE_DIR/admin-runtime-proof.json")" = 'PASS'
          {
            echo 'result=REAL_ADMIN_PREVIEW_PASS'
            echo "preview_url=$ADMIN_PREVIEW_URL"
            echo "worker_artifact_sha256=$worker_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Isolated Admin Worker Preview: PASS'
            echo "- Exact source SHA: $SOURCE_SHA"
            echo "- Worker artifact SHA-256: $worker_sha"
            echo "- Admin Preview URL: $ADMIN_PREVIEW_URL"
            echo '- Health/source identity, login noindex/private no-store, robots disallow, and unauthenticated order denial: PASS'
            echo '- Custom domains, routes, and Production traffic: NONE'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized Admin Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-admin-preview-${{ inputs.source_sha }}
          path: ${{ env.EVIDENCE_DIR }}/admin-runtime-proof.json
          if-no-files-found: warn
          retention-days: 90

  order-intake-diagnostic:
    name: Run and remove the temporary exact-SHA receipt diagnostic Worker
    needs: [public-preview-upload, admin-preview-upload]
    if: inputs.run_order_intake_diagnostic == true && inputs.workers_plan_status == 'FREE' && needs.public-preview-upload.result == 'success' && needs.public-preview-upload.outputs.result == 'REAL_PUBLIC_PREVIEW_PASS' && needs.admin-preview-upload.result == 'success' && needs.admin-preview-upload.outputs.result == 'REAL_ADMIN_PREVIEW_PASS'
    environment: phase2-preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      result: ${{ steps.record.outputs.result }}
      worker_name: ${{ steps.record.outputs.worker_name }}
      preview_url: ${{ steps.record.outputs.preview_url }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      ARTIFACT_ROOT: ${{ github.workspace }}/.artifacts/dongphugia-app-preview-download
      EVIDENCE_DIR: ${{ github.workspace }}/.artifacts/order-intake-diagnostic-evidence
      WORKER_NAME: pr-${{ inputs.pull_request_number }}-dongphugia-v1-public-preview
      PUBLIC_ORDER_INTAKE_URL: https://uybumsnyqpwcidjxmfsv.supabase.co/functions/v1/order-intake
      WRANGLER_BIN: ${{ github.workspace }}/apps/public/node_modules/wrangler/bin/wrangler.js
    steps:
      - name: Require dedicated Phase 2 Preview credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'Missing CLOUDFLARE_PHASE2_PREVIEW_TOKEN in GitHub environment phase2-preview; configure it after Owner approval.' >&2
            exit 1
          fi

      - name: Check out the exact Owner-labeled source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install locked candidate verifiers and Wrangler
        run: |
          npm ci
          npm ci --prefix apps/public

      - name: Download and re-verify the immutable exact-SHA Public/Admin artifact
        uses: actions/download-artifact@v4
        with:
          name: dongphugia-app-preview-${{ inputs.source_sha }}
          path: ${{ env.ARTIFACT_ROOT }}

      - name: Verify candidate identity before any account credential is read
        run: >-
          npm run app:verify-candidate --
          --artifact-root "$ARTIFACT_ROOT"
          --source-sha "$SOURCE_SHA"
          --pr-number "$PR_NUMBER"
          --workflow-run-id "$WORKFLOW_RUN_ID"
          --lockfile package-lock.json
          --public-lockfile apps/public/package-lock.json
          --migration-manifest db/postgres-migrations/manifest.json
          --evidence "$ARTIFACT_ROOT/candidate-evidence.json"

      - name: Attest the existing Cloudflare token's exact scope
        id: scope
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node scripts/app-foundation/order-intake-diagnostic.mjs attest-scope \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" > "$EVIDENCE_DIR/credential-scope.json"

      - name: Confirm the dedicated workers.dev route is absent and live tail is available
        id: preflight
        continue-on-error: true
        if: steps.scope.outputs.result == 'ORDER_DIAGNOSTIC_CREDENTIAL_SCOPE_PASS'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/app-foundation/order-intake-diagnostic.mjs preflight \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --worker-name "$WORKER_NAME" > "$EVIDENCE_DIR/target-preflight.json"

      - name: Prepare an exact-account, no-custom-route, noindex temporary Worker config
        id: prepare
        continue-on-error: true
        if: steps.scope.outputs.result == 'ORDER_DIAGNOSTIC_CREDENTIAL_SCOPE_PASS' && steps.preflight.outputs.result == 'ORDER_DIAGNOSTIC_TARGET_PREFLIGHT_PASS'
        env:
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/app-foundation/order-intake-diagnostic.mjs prepare \
            --base "$ARTIFACT_ROOT/public/build/wrangler.preview.json" \
            --output "$ARTIFACT_ROOT/public/build/wrangler.diagnostic.json" \
            --evidence "$EVIDENCE_DIR/diagnostic-config.json" \
            --pr-number "$PR_NUMBER" \
            --source-sha "$SOURCE_SHA" > "$EVIDENCE_DIR/diagnostic-target.json"
          expected_origin="https://$WORKER_NAME.tranhuunguyenhuy.workers.dev"
          jq -e --arg worker "$WORKER_NAME" --arg source "$SOURCE_SHA" --arg origin "$expected_origin" \
            '.workerName == $worker and .sourceSha == $source and .previewUrl == $origin' \
            "$EVIDENCE_DIR/diagnostic-target.json" >/dev/null
          jq -e --arg worker "$WORKER_NAME" --arg account 'd54f3402b9d112ab64d6135e0e3f1fb1' --arg origin "$expected_origin" \
            '.name == $worker and .account_id == $account and .workers_dev == true and .preview_urls == false and .vars.APP_ORIGIN == $origin and .vars.PREVIEW_NOINDEX == "true" and .routes == null and .custom_domains == null and .observability.logs.enabled == true and .observability.logs.persist == false and .observability.traces.enabled == false and .observability.traces.persist == false' \
            "$ARTIFACT_ROOT/public/build/wrangler.diagnostic.json" >/dev/null

      - name: Dry-run the prepared Worker without provider writes
        id: dry_run
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$ARTIFACT_ROOT/public/build"
          node "$WRANGLER_BIN" deploy --dry-run --strict --config wrangler.diagnostic.json \
            > "$RUNNER_TEMP/order-diagnostic-dry-run.log" 2>&1

      - name: Deploy the isolated diagnostic Worker with nonpersistent telemetry
        id: deploy
        if: steps.dry_run.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET: ${{ secrets.PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = 'd54f3402b9d112ab64d6135e0e3f1fb1'
          test "$PUBLIC_ORDER_INTAKE_URL" = 'https://uybumsnyqpwcidjxmfsv.supabase.co/functions/v1/order-intake'
          [[ "$PREVIEW_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]
          if (( $(printf '%s' "$PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET" | wc -c) < 32 )); then
            echo 'Preview order signing secret is missing or too short.' >&2
            exit 1
          fi
          umask 077
          secret_dir="$(mktemp -d "$RUNNER_TEMP/order-diagnostic-secrets.XXXXXX")"
          secrets_file="$secret_dir/worker-secrets.json"
          trap 'rm -f "$secrets_file"; rmdir "$secret_dir"' EXIT
          node --input-type=module -e 'import { writeFile } from "node:fs/promises"; const file=process.argv[1]; const value=process.env.PHASE2_PREVIEW_ORDER_INTAKE_SIGNING_SECRET; if (typeof value !== "string" || new TextEncoder().encode(value).byteLength < 32) throw new Error("PREVIEW_ORDER_SECRET_INVALID"); await writeFile(file, JSON.stringify({ ORDER_INTAKE_SIGNING_SECRET: value }), { mode: 0o600, flag: "wx" });' "$secrets_file"
          echo 'write_attempted=true' >> "$GITHUB_OUTPUT"
          cd "$ARTIFACT_ROOT/public/build"
          node "$WRANGLER_BIN" deploy --strict --config wrangler.diagnostic.json \
            --secrets-file "$secrets_file" \
            --message "PR #$PR_NUMBER exact source $SOURCE_SHA temporary receipt diagnostic" \
            > "$RUNNER_TEMP/order-diagnostic-deploy.log" 2>&1

      - name: Stream one filtered GET tail and make one synthetic receipt GET
        id: probe
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tail_file="$RUNNER_TEMP/order-diagnostic-tail.jsonl"
          tail_error="$RUNNER_TEMP/order-diagnostic-tail.stderr"
          status_file="$RUNNER_TEMP/order-diagnostic-status.txt"
          headers_file="$RUNNER_TEMP/order-diagnostic-headers.txt"
          body_file="$RUNNER_TEMP/order-diagnostic-body.json"
          : > "$tail_file"
          : > "$tail_error"
          cd "$ARTIFACT_ROOT/public/build"
          node "$WRANGLER_BIN" tail "$WORKER_NAME" --format json --method GET \
            --search PUBLIC_ORDER_INTAKE_DIAGNOSTIC > "$tail_file" 2> "$tail_error" &
          tail_pid=$!
          stop_tail() {
            kill -INT "$tail_pid" 2>/dev/null || true
            for _ in {1..10}; do
              kill -0 "$tail_pid" 2>/dev/null || break
              sleep 1
            done
            kill -KILL "$tail_pid" 2>/dev/null || true
            wait "$tail_pid" 2>/dev/null || true
          }
          trap stop_tail EXIT
          sleep 3
          if ! kill -0 "$tail_pid" 2>/dev/null; then
            echo 'Filtered Worker tail did not stay connected.' >&2
            exit 1
          fi
          idempotency_key="$(node --input-type=module -e 'import { randomUUID } from "node:crypto"; process.stdout.write(randomUUID())')"
          probe_url="$(node --input-type=module -e 'const n=process.env.WORKER_NAME; if (!/^pr-[1-9][0-9]*-dongphugia-v1-public-preview$/.test(n)) process.exit(2); process.stdout.write("https://" + n + ".tranhuunguyenhuy.workers.dev/api/order-requests/receipt");')"
          set +e
          status="$(curl --silent --show-error --max-time 20 \
            --dump-header "$headers_file" --output "$body_file" --write-out '%{http_code}' \
            --header "Idempotency-Key: $idempotency_key" "$probe_url")"
          curl_status=$?
          set -e
          if [[ "$curl_status" -ne 0 ]]; then
            echo 'Synthetic receipt GET could not complete.' >&2
            exit 1
          fi
          printf '%s' "$status" > "$status_file"
          for _ in {1..10}; do
            grep -Fq 'PUBLIC_ORDER_INTAKE_DIAGNOSTIC' "$tail_file" && break
            sleep 1
          done
          stop_tail
          trap - EXIT
          node scripts/app-foundation/order-intake-diagnostic.mjs proof \
            --source-sha "$SOURCE_SHA" --status "$status_file" \
            --headers "$headers_file" --body "$body_file" --tail "$tail_file" \
            --output "$EVIDENCE_DIR/receipt-proof.json" > "$EVIDENCE_DIR/receipt-result.json"
          rm -f "$tail_file" "$tail_error" "$status_file" "$headers_file" "$body_file"

      - name: Delete the exact temporary tail and Worker, then verify absence
        id: cleanup
        if: always() && steps.deploy.outputs.write_attempted == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PHASE2_PREVIEW_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/app-foundation/order-intake-diagnostic.mjs cleanup \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --worker-name "$WORKER_NAME" > "$EVIDENCE_DIR/cleanup-proof.json"

      - name: Record sanitized diagnostic and rollback result
        id: record
        if: always()
        env:
          SCOPE_RESULT: ${{ steps.scope.outputs.result }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
          PREFLIGHT_RESULT: ${{ steps.preflight.outputs.result }}
          PREFLIGHT_REASON: ${{ steps.preflight.outputs.reason }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          WRITE_ATTEMPTED: ${{ steps.deploy.outputs.write_attempted }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_result='UNKNOWN'
          reason='UNKNOWN'
          if [[ "$SCOPE_RESULT" != 'ORDER_DIAGNOSTIC_CREDENTIAL_SCOPE_PASS' ]]; then
            diagnostic_result='BLOCKED_BY_CREDENTIAL_SCOPE'
            reason="${SCOPE_REASON:-UNKNOWN}"
          elif [[ "$PREFLIGHT_RESULT" != 'ORDER_DIAGNOSTIC_TARGET_PREFLIGHT_PASS' ]]; then
            diagnostic_result='BLOCKED_BY_TARGET_PREFLIGHT'
            reason="${PREFLIGHT_REASON:-UNKNOWN}"
          elif [[ "$PREPARE_OUTCOME" != 'success' ]]; then
            diagnostic_result='BLOCKED_BY_CONFIG_PREPARATION'
            reason='PREPARE_FAILED'
          elif [[ "$DRY_RUN_OUTCOME" != 'success' ]]; then
            diagnostic_result='BLOCKED_BY_WRANGLER_DRY_RUN'
            reason='DRY_RUN_FAILED'
          elif [[ "$DEPLOY_OUTCOME" != 'success' ]]; then
            diagnostic_result='DIAGNOSTIC_DEPLOY_FAILED'
            reason='DEPLOY_FAILED'
          elif [[ "$PROBE_OUTCOME" != 'success' ]]; then
            diagnostic_result='DIAGNOSTIC_PROBE_FAILED'
            reason='PROBE_FAILED'
          elif [[ "$WRITE_ATTEMPTED" == 'true' && "$CLEANUP_OUTCOME" != 'success' ]]; then
            diagnostic_result='DIAGNOSTIC_CLEANUP_FAILED'
            reason='CLEANUP_NOT_VERIFIED'
          else
            diagnostic_result="$(jq -r '.result // "UNKNOWN"' "$EVIDENCE_DIR/receipt-proof.json")"
            reason='NONE'
          fi
          {
            echo "result=$diagnostic_result"
            echo "worker_name=$WORKER_NAME"
            echo "preview_url=https://$WORKER_NAME.tranhuunguyenhuy.workers.dev"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Synthetic order-intake diagnostic: $diagnostic_result"
            echo "- Candidate source SHA: $SOURCE_SHA"
            echo "- Temporary Worker name: $WORKER_NAME"
            echo "- Diagnostic result: $diagnostic_result ($reason)"
            if [[ -f "$EVIDENCE_DIR/receipt-proof.json" ]]; then
              echo "- Correlated safe stage: $(jq -r '.event.stage // "NONE"' "$EVIDENCE_DIR/receipt-proof.json")"
              echo "- Upstream HTTP status: $(jq -r '.event.upstreamStatus // "UNKNOWN"' "$EVIDENCE_DIR/receipt-proof.json")"
            fi
            if [[ "$WRITE_ATTEMPTED" == 'true' ]]; then
              echo "- Worker cleanup: $CLEANUP_OUTCOME"
            else
              echo '- Worker cleanup: not needed; no diagnostic Worker mutation was attempted.'
            fi
            echo '- Telemetry: filtered live tail only; Cloudflare log and trace persistence disabled; no Version URL used.'
            echo '- Order intake operation: exactly one synthetic GET receipt lookup; no order POST or order write.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized exact-SHA diagnostic and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-intake-diagnostic-${{ inputs.source_sha }}
          path: |
            ${{ env.EVIDENCE_DIR }}/credential-scope.json
            ${{ env.EVIDENCE_DIR }}/target-preflight.json
            ${{ env.EVIDENCE_DIR }}/diagnostic-config.json
            ${{ env.EVIDENCE_DIR }}/diagnostic-target.json
            ${{ env.EVIDENCE_DIR }}/receipt-proof.json
            ${{ env.EVIDENCE_DIR }}/receipt-result.json
            ${{ env.EVIDENCE_DIR }}/cleanup-proof.json
          if-no-files-found: warn
          retention-days: 30
